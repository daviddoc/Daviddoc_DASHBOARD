    <style>
        :root {
            --bg: #121212; --container-max-width: 1400px; --card-bg: #1e1e1e; --card-hover: #252525;
            --text: #e0e0e0; --text-muted: #888; --accent: #007acc; --danger: #ff4444; --warn: #ffbb33;
            --border: #333; --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3); --radius: 8px;
            --top-bar-height: 60px; --search-bar-height: 50px; --total-header-height: 110px; 
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 15px; padding-top: calc(var(--total-header-height) + 20px); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box; user-select: none; touch-action: pan-y;
        }
        .header-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--total-header-height);
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center;
        }
        .header-inner { width: 100%; max-width: var(--container-max-width); padding: 0 15px; box-sizing: border-box; display: flex; flex-direction: column; height: 100%; }
        .top-row { height: var(--top-bar-height); display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
        .title-area { flex: 1; min-width: 0; display: flex; align-items: center; }
        .app-title { font-size: 18px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 1px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #titleInput { display: none; background: #111; border: 1px dashed var(--accent); color: var(--accent); padding: 5px 10px; border-radius: 4px; font-size: 16px; width: 100%; min-width: 50px; }
        .edit-mode #mainTitle { display: none; } .edit-mode #titleInput { display: block; }
        .actions-area { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .config-tools { display: none; gap: 8px; padding-right: 8px; border-right: 1px solid #333; margin-right: 0px; }
        .edit-mode .config-tools { display: flex; }
        @media (max-width: 600px) { .edit-mode .title-area { display: none !important; } .edit-mode .top-row { justify-content: flex-end; } .edit-mode .config-tools { border-right: none; } }
        .bottom-row { height: var(--search-bar-height); display: flex; align-items: center; width: 100%; padding-bottom: 10px; }
        .search-container { width: 100%; position: relative; }
        #searchInput { width: 100%; background: rgba(30, 30, 30, 0.6); border: 1px solid var(--border); color: var(--text); padding: 10px 35px 10px 15px; border-radius: var(--radius); font-size: 16px; outline: none; box-sizing: border-box; transition: all 0.2s; }
        #searchInput:focus { background: var(--card-bg); border-color: var(--accent); }
        .clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; padding: 5px; display: none; }
        .btn-icon { width: 40px; height: 40px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .btn-icon:hover { background: var(--card-hover); color: #fff; transform: translateY(-1px); border-color: #666; }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }
        #btnAdd { color: var(--accent); border-color: rgba(0, 122, 204, 0.3); }
        #btnConfig.active { background: var(--warn); color: #121212; border-color: var(--warn); }
        #btnSave.dirty { color: var(--danger); animation: pulse 2s infinite; border-color: rgba(255, 68, 68, 0.3); }
        .btn-tool { width: 36px; height: 36px; background: transparent; border: 1px solid transparent; color: #888; }
        .btn-tool:hover { background: #333; color: var(--accent); border-color: #444; }
        
        .masonry-container { width: 100%; max-width: var(--container-max-width); column-count: 1; column-gap: 15px; }
        .category-section { background: rgba(255, 255, 255, 0.03); border-radius: var(--radius); border: 1px solid transparent; padding: 10px; margin-bottom: 15px; break-inside: avoid; page-break-inside: avoid; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s; }
        @media (min-width: 768px) { .masonry-container { column-count: 2; column-gap: 20px; } }
        @media (min-width: 1200px) { .masonry-container { column-count: 3; column-gap: 25px; } }
        @media (min-width: 1600px) { .masonry-container { column-count: 4; } }
        .category-header { font-size: 13px; color: var(--accent); text-transform: uppercase; font-weight: 700; padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        ul.category-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); cursor: pointer; position: relative; transition: all 0.2s; box-shadow: var(--shadow-card); }
        .card:hover { background: var(--card-hover); border-color: #666; transform: translateY(-2px); }
        .card img { width: 22px; height: 22px; border-radius: 3px; object-fit: contain; }
        .card span { font-size: 14px; flex-grow: 1; pointer-events: none; }

        /* --- VISUAL FEEDBACK FOR DRAG --- */
        .edit-mode .category-section { border: 1px dashed #444; }
        .edit-mode .category-header { cursor: move; background: rgba(0,122,204,0.1); border-radius: 4px; padding-left: 10px; } 
        .edit-mode .card { cursor: move; }
        
        .dragging-el { opacity: 0.3; filter: grayscale(1); }
        
        /* Blue Line Indicators */
        .drop-target-top { border-top: 3px solid var(--accent) !important; box-shadow: 0 -4px 8px rgba(0,122,204,0.2); }
        .drop-target-bottom { border-bottom: 3px solid var(--accent) !important; box-shadow: 0 4px 8px rgba(0,122,204,0.2); }
        
        .actions-group { display: none; gap: 5px; } .edit-mode .actions-group { display: flex; }
        .icon-btn { background: transparent; border: none; cursor: pointer; color: #666; padding: 4px; display: flex; } .icon-btn:hover { color: #fff; } .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .drag-icon { margin-right: 5px; color: #555; display: none; } .edit-mode .drag-icon { display: block; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #444; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .modal h3 { margin-top: 0; color: #fff; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; } .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #888; }
        input[type="text"], select { width: 100%; background: #252525; border: 1px solid #444; color: #eee; padding: 10px; border-radius: 6px; outline: none; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-text { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; }
        .btn-primary { background: var(--accent); color: white; } .btn-cancel { background: #333; color: #ccc; } .btn-danger { background: var(--danger); color: white; }
        
        .drag-ghost { 
            position: fixed; pointer-events: none; z-index: 9999; 
            opacity: 0.9; box-shadow: 0 15px 30px rgba(0,0,0,0.5); 
            transform: scale(1.02); background: var(--card-bg);
            border: 2px solid var(--accent); border-radius: 6px; padding: 10px;
            width: 250px; color: #fff; font-weight: bold;
        }

        .edit-mode * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .edit-mode input, .edit-mode select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    </style>
</head>

    <script>
        /*DATA_START*/
        let appData = {
    "title": "AI CHATBOTS",
    "bookmarks": [
        {
            "title": "CHATBOTS & LLM",
            "items": [
                {
                    "name": "Gemini",
                    "url": "https://gemini.google.com/"
                },
                {
                    "name": "NotebookLM",
                    "url": "https://notebooklm.google.com/"
                },
                {
                    "name": "ChatGPT",
                    "url": "https://chatgpt.com/"
                },
                {
                    "name": "Claude",
                    "url": "https://claude.ai/"
                },
                {
                    "name": "Copilot",
                    "url": "https://m365.cloud.microsoft/chat?auth=2"
                },
                {
                    "name": "Perplexity",
                    "url": "https://www.perplexity.ai/"
                },
                {
                    "name": "Duckduckgo.ai",
                    "url": "https://duckduckgo.com/?q=Chat&ia=chat"
                }
            ]
        },
        {
            "title": "DESARROLLO",
            "items": [
                {
                    "name": "Google Firebase",
                    "url": "https://console.firebase.google.com/"
                },
                {
                    "name": "Google AI Studio",
                    "url": "https://aistudio.google.com/apps"
                },
                {
                    "name": "LM Arena",
                    "url": "https://lmarena.ai/"
                }
            ]
        },
        {
            "title": "CREATIVIDAD & IMAGEN",
            "items": [
                {
                    "name": "Canva",
                    "url": "https://www.canva.com/"
                },
                {
                    "name": "Adobe Firefly",
                    "url": "https://firefly.adobe.com/"
                },
                {
                    "name": "Leonardo.ai",
                    "url": "https://app.leonardo.ai/"
                }
            ]
        }
    ]
};
        /*DATA_END*/
        
        const KEY='ia_dash_v5_fix';
        try{const l=localStorage.getItem(KEY);if(l)appData=JSON.parse(l);}catch(e){}
        let bm=appData.bookmarks, mode=false, dirty=false;
        
        // DRAG & TOUCH STATE
        let dSrc = null; // { t:'CAT'|'ITEM', c:idx, i:idx }
        let tSrc = null; // { el:DOMElement, x:int, y:int }
        let touchTimer = null;
        let ghost = null;
        let autoScrollInterval = null;

        const $=(id)=>document.getElementById(id);
        const GEN_ICON="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23555555'/%3E%3Cpath d='M10 7l5 5-5 5' stroke='%23000000' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
        
        const svg={
            edit:'<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
            del:'<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
            drag:'<svg viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>'
        };

        function init(){
            $('mainTitle').innerText=appData.title; $('titleInput').value=appData.title;
            render();
            document.oncontextmenu = function(e) { if(mode) return false; };
        }

        function render(f=""){
            const c=$('mainContainer'); c.innerHTML='';
            const fl=f.toLowerCase();
            
            bm.forEach((cat,ci)=>{
                const its=cat.items.filter(i=>i.name.toLowerCase().includes(fl));
                if(f && !its.length) return;
                
                const sec=document.createElement('div'); 
                sec.className='category-section';
                
                const head=document.createElement('div');
                head.className='category-header';
                const dh=mode?`<span class="drag-icon">${svg.drag}</span>`:'';
                head.innerHTML=`<div style="display:flex;align-items:center;">${dh}<span>${cat.title}</span></div><div class="actions-group"><button class="icon-btn" onclick="editCat(${ci})">${svg.edit}</button><button class="icon-btn" onclick="delCat(${ci})">${svg.del}</button></div>`;
                
                if(mode){
                    // Pass SECTION as visual element for CAT drag
                    addTouchHandlers(head, 'CAT', ci, null, sec);
                }
                sec.appendChild(head);
                
                const ul=document.createElement('ul'); 
                ul.className='category-list';
                
                its.forEach((it,ii)=>{
                    const ri=cat.items.indexOf(it);
                    const li=document.createElement('li');
                    
                    const card=document.createElement('a'); 
                    card.className='card';
                    
                    if(!mode) { card.href=it.url; card.target="_self"; }
                    else {
                        // Pass CARD as visual element for ITEM drag
                        addTouchHandlers(card, 'ITEM', ci, ri, card);
                    }
                    
                    card.innerHTML=`<img src="${it.customIcon||GEN_ICON}"><span>${it.name}</span><div class="actions-group"><button class="icon-btn" onclick="editItem(${ci},${ri},event)">${svg.edit}</button><button class="icon-btn" onclick="delItem(${ci},${ri},event)">${svg.del}</button></div>`;
                    li.appendChild(card); ul.appendChild(li);
                });
                sec.appendChild(ul); c.appendChild(sec);
            });
        }

        // --- CORE TOUCH LOGIC ---
        function addTouchHandlers(handle, type, cIdx, iIdx, visualElement) {
            
            handle.addEventListener('touchstart', (e) => {
                if(!mode || e.target.closest('.icon-btn')) return;
                touchTimer = setTimeout(() => {
                    startDrag(e.touches[0], type, cIdx, iIdx, visualElement);
                }, 300);
            }, {passive: false});

            handle.addEventListener('touchmove', (e) => {
                if(touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                if(tSrc) { 
                    e.preventDefault(); 
                    moveDrag(e.touches[0]); 
                }
            }, {passive: false});

            handle.addEventListener('touchend', (e) => {
                if(touchTimer) clearTimeout(touchTimer);
                if(tSrc) endDrag(e.changedTouches[0]);
            });
            
            handle.addEventListener('touchcancel', () => {
                if(tSrc) cancelDrag();
            });
        }

        function startDrag(touch, type, c, i, el) {
            if(navigator.vibrate) navigator.vibrate(50);
            // Global State
            dSrc = { t:type, c, i }; 
            tSrc = { el: el, x: touch.clientX, y: touch.clientY }; // Store visual element
            
            // Ghost
            ghost = el.cloneNode(true);
            ghost.className += ' drag-ghost';
            ghost.style.width = (el.offsetWidth - 20) + 'px';
            ghost.style.position = 'fixed';
            ghost.style.top = (touch.clientY - 20) + 'px';
            ghost.style.left = (touch.clientX - 20) + 'px';
            ghost.style.zIndex = '9999';
            document.body.appendChild(ghost);
            
            el.classList.add('dragging-el');
        }

        function moveDrag(touch) {
            if(!ghost) return;
            ghost.style.top = (touch.clientY - 20) + 'px';
            ghost.style.left = (touch.clientX - 20) + 'px';
            
            handleAutoScroll(touch.clientY);

            const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            if(!elBelow) return;

            // Visual Cleanup
            document.querySelectorAll('.drop-target-top, .drop-target-bottom').forEach(e => e.classList.remove('drop-target-top', 'drop-target-bottom'));

            if(dSrc.t === 'CAT') {
                const targetSec = elBelow.closest('.category-section');
                if(targetSec && targetSec !== tSrc.el) {
                    const rect = targetSec.getBoundingClientRect();
                    if((touch.clientY - rect.top) < (rect.height / 2)) targetSec.classList.add('drop-target-top');
                    else targetSec.classList.add('drop-target-bottom');
                }
            } else {
                const targetCard = elBelow.closest('.card');
                if(targetCard && targetCard !== tSrc.el) {
                    const rect = targetCard.getBoundingClientRect();
                    if((touch.clientY - rect.top) < (rect.height / 2)) targetCard.classList.add('drop-target-top');
                    else targetCard.classList.add('drop-target-bottom');
                } else {
                    const targetSec = elBelow.closest('.category-section');
                    if(targetSec) targetSec.classList.add('drop-target-bottom');
                }
            }
        }

        function endDrag(touch) {
            // 1. Capture State BEFORE cleanup
            const srcData = { ...dSrc };
            const originEl = tSrc.el;
            
            // 2. Cleanup Visuals
            cancelDrag(); 
            
            // 3. Logic Execution
            const elBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            if(!elBelow) return;

            if(srcData.t === 'CAT') {
                const targetSec = elBelow.closest('.category-section');
                if(targetSec && targetSec !== originEl) {
                    const allSecs = Array.from(document.querySelectorAll('.category-section'));
                    const fromIdx = srcData.c;
                    const toIdx = allSecs.indexOf(targetSec);
                    
                    if(toIdx !== -1 && fromIdx !== toIdx) {
                        const rect = targetSec.getBoundingClientRect();
                        const insertAfter = (touch.clientY - rect.top) > (rect.height/2);
                        let finalIdx = toIdx; 
                        if(insertAfter) finalIdx++;
                        
                        const m = bm.splice(fromIdx, 1)[0];
                        if(finalIdx > fromIdx) finalIdx--;
                        bm.splice(finalIdx, 0, m);
                        setDirty(); render($('searchInput').value);
                    }
                }
            } else if(srcData.t === 'ITEM') {
                const targetCard = elBelow.closest('.card');
                if(targetCard && targetCard !== originEl) {
                    // Logic Target Card
                    const sec = targetCard.closest('.category-section');
                    const allSecs = Array.from(document.querySelectorAll('.category-section'));
                    const tCIdx = allSecs.indexOf(sec);
                    
                    const ul = sec.querySelector('ul');
                    const allCards = Array.from(ul.querySelectorAll('.card'));
                    const tIIdx = allCards.indexOf(targetCard);
                    
                    const rect = targetCard.getBoundingClientRect();
                    const insertAfter = (touch.clientY - rect.top) > (rect.height/2);
                    let finalIdx = tIIdx; if(insertAfter) finalIdx++;
                    
                    const item = bm[srcData.c].items.splice(srcData.i, 1)[0];
                    if(srcData.c === tCIdx && srcData.i < finalIdx) finalIdx--;
                    
                    bm[tCIdx].items.splice(finalIdx, 0, item);
                    setDirty(); render($('searchInput').value);
                } else {
                    // Logic Empty Section
                    const targetSec = elBelow.closest('.category-section');
                    if(targetSec) {
                        const allSecs = Array.from(document.querySelectorAll('.category-section'));
                        const tCIdx = allSecs.indexOf(targetSec);
                        const item = bm[srcData.c].items.splice(srcData.i, 1)[0];
                        bm[tCIdx].items.push(item);
                        setDirty(); render($('searchInput').value);
                    }
                }
            }
        }

        function cancelDrag() {
            if(ghost) { ghost.remove(); ghost = null; }
            if(tSrc && tSrc.el) tSrc.el.classList.remove('dragging-el');
            document.querySelectorAll('.drop-target-top, .drop-target-bottom').forEach(e => e.classList.remove('drop-target-top', 'drop-target-bottom'));
            if(autoScrollInterval) { cancelAnimationFrame(autoScrollInterval); autoScrollInterval = null; }
            tSrc = null; dSrc = null;
        }

        function handleAutoScroll(y) {
            const edgeSize = 100;
            const viewportHeight = window.innerHeight;
            if (autoScrollInterval) return;
            if (y < edgeSize) {
                autoScrollInterval = requestAnimationFrame(function scrollUp() {
                    window.scrollBy(0, -5);
                    if (ghost && parseInt(ghost.style.top) < edgeSize && tSrc) {
                        autoScrollInterval = requestAnimationFrame(scrollUp);
                    } else { cancelAnimationFrame(autoScrollInterval); autoScrollInterval = null; }
                });
            } else if (y > viewportHeight - edgeSize) {
                autoScrollInterval = requestAnimationFrame(function scrollDown() {
                    window.scrollBy(0, 5);
                    if (ghost && parseInt(ghost.style.top) > viewportHeight - edgeSize && tSrc) {
                        autoScrollInterval = requestAnimationFrame(scrollDown);
                    } else { cancelAnimationFrame(autoScrollInterval); autoScrollInterval = null; }
                });
            }
        }

        // --- APP LOGIC ---
        function setDirty(){ dirty=true; $('btnSave').classList.add('dirty'); }
        const sIn=$('searchInput'); const cl=$('clearSearch');
        sIn.oninput=e=>{ cl.style.display=e.target.value?'block':'none'; render(e.target.value); };
        cl.onclick=()=>{ sIn.value=''; cl.style.display='none'; render(); sIn.focus(); };
        
        $('btnConfig').onclick=()=>{
            mode=!mode; 
            document.body.classList.toggle('edit-mode',mode);
            $('btnConfig').classList.toggle('active',mode);
            if(!mode){ appData.title=$('titleInput').value; $('mainTitle').innerText=appData.title; setDirty(); }
            render($('searchInput').value);
        }
        
        $('btnSave').onclick=()=>{
            if(mode)$('btnConfig').click();
            dirty=false; $('btnSave').classList.remove('dirty');
            $('mainContainer').innerHTML='';
            const h=document.documentElement.outerHTML;
            render();
            const d=JSON.stringify(appData,null,4);
            const r=/(\/\*DATA_START\*\/)([\s\S]*?)(\/\*DATA_END\*\/)/;
            if(!r.test(h)) return alert("Error saving");
            const final=h.replace(r,`$1\n        let appData = ${d};\n        $3`);
            
            const b=new Blob([final],{type:'text/html'});
            const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='panel_ia_v5.4.html';
            document.body.appendChild(a); a.click(); a.remove();
        };

        // CRUD & MODALS
        const modalConfirm=document.getElementById('modalConfirm');
        const modalAlert=document.getElementById('modalAlert');
        let confirmCb=null;
        function showConfirm(t,m,cb){ document.getElementById('confirmTitle').innerText=t; document.getElementById('confirmMessage').innerText=m; confirmCb=cb; modalConfirm.style.display='flex'; }
        function closeConfirm(){ modalConfirm.style.display='none'; confirmCb=null; }
        document.getElementById('btnConfirmAction').onclick=()=>{ if(confirmCb)confirmCb(); closeConfirm(); };
        function showAlert(t,m){ document.getElementById('alertTitle').innerText=t; document.getElementById('alertMessage').innerText=m; modalAlert.style.display='flex'; }
        window.closeAlert=()=>{ modalAlert.style.display='none'; };

        window.editItem=(c,i,e)=>{e.stopPropagation();e.preventDefault(); openModal('modalItem',c,i);}
        window.delItem=(c,i,e)=>{ e.stopPropagation();e.preventDefault(); showConfirm("Eliminar",`¿Borrar "${bm[c].items[i].name}"?`,()=>{ bm[c].items.splice(i,1); setDirty(); render(); }); }
        window.editCat=(c)=>{openModal('modalCat',c);}
        window.delCat=(c)=>{ const cnt=bm[c].items.length; showConfirm("Eliminar Categoría",`¿Borrar "${bm[c].title}" y sus ${cnt} enlaces?`,()=>{ bm.splice(c,1); setDirty(); render(); }); }
        
        window.openItemModal = () => { closeAllModals(); openModal('modalItem'); };
        window.openCatModal = () => { closeAllModals(); openModal('modalCat'); };
        $('btnAdd').onclick=()=>$('modalType').style.display='flex';
        
        function openModal(id,c=null,i=null){
            $(id).style.display='flex';
            if(id==='modalItem'){
               $('editCatIndex').value=c!==null?c:''; $('editIndex').value=i!==null?i:'';
               $('itemCategory').innerHTML=bm.map((x,idx)=>`<option value="${idx}">${x.title}</option>`).join('');
               if(c!==null && i!==null){
                   const it=bm[c].items[i]; $('itemName').value=it.name; $('itemUrl').value=it.url; $('itemCategory').value=c;
               } else { $('itemName').value=''; $('itemUrl').value=''; }
            } else if(id==='modalCat'){
                $('editCatId').value=c!==null?c:'';
                $('catName').value=c!==null?bm[c].title:'';
            }
        }
        window.closeAllModals=()=>{document.querySelectorAll('.modal-overlay').forEach(e=>e.style.display='none');}
        
        $('btnSaveItem').onclick=()=>{
            const n=$('itemName').value, u=$('itemUrl').value, c=parseInt($('itemCategory').value);
            if(n){
                const it={name:n,url:u};
                const idx=$('editIndex').value;
                if(idx!=='') bm[c].items[idx]=it; else bm[c].items.push(it);
                setDirty(); closeAllModals(); render($('searchInput').value);
            }
        }
        $('btnSaveCat').onclick=()=>{
            const n=$('catName').value;
            if(n){
                const idx=$('editCatId').value;
                if(idx!=='') bm[idx].title=n; else bm.push({title:n,items:[]});
                setDirty(); closeAllModals(); render($('searchInput').value);
            }
        }
        document.getElementById('btnChangeFavicon').onclick=()=>faviconFile.click();
        faviconFile.onchange=e=>{
            const f=e.target.files[0]; if(!f)return;
            const r=new FileReader();
            r.onload=ev=>{ document.getElementById('dynamicFavicon').href=ev.target.result; setDirty(); alert("Icono cambiado."); };
            r.readAsDataURL(f);
        };
        document.getElementById('btnExportJson').onclick=()=>{
            const d="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(appData,null,2));
            const a=document.createElement('a'); a.href=d; a.download="backup_"+Date.now()+".json"; document.body.appendChild(a); a.click(); a.remove();
        };
        document.getElementById('btnImportJson').onclick=()=>document.getElementById('importJsonFile').click();
        document.getElementById('importJsonFile').onchange=e=>{
            const f=e.target.files[0]; if(!f)return;
            const r=new FileReader();
            r.onload=ev=>{
                try{
                    const d=JSON.parse(ev.target.result);
                    if(d.bookmarks){ appData=d; bm=appData.bookmarks; if(d.title){$('titleInput').value=d.title; $('mainTitle').innerText=d.title;} setDirty(); render(); alert("Datos importados."); }
                }catch(x){alert("JSON inválido");}
                e.target.value='';
            };
            r.readAsText(f);
        };

        init();
    </script>


</body></html>
