    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #007acc;
            --danger: #ff4444;
            --warn: #ffbb33;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        /* --- TÍTULO Y CONFIG --- */
        .title-container {
            text-align: center;
            margin-bottom: 10px;
            min-height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 18px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            pointer-events: none;
        }

        .config-controls {
            display: none;
            width: 100%;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .edit-mode .config-controls { display: flex; }
        .edit-mode h1 { display: none; }

        #titleInput {
            background: #111;
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px;
            border-radius: 4px;
            flex-grow: 1;
        }

        .btn-small {
            font-size: 12px;
            padding: 5px 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-small:hover { background: #444; }

        /* --- HEADER --- */
        .header { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; flex-shrink: 0; }
        .search-container { position: relative; flex-grow: 1; }

        input[type="text"], select {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 30px 8px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .clear-search {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: none;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            border-radius: 50%;
        }
        .clear-search:hover { background: #333; color: #fff; }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
            flex-shrink: 0;
        }
        .btn svg { width: 18px; height: 18px; fill: currentColor; }
        .btn:hover { background: #2a2a2a; }

        #btnSave { color: var(--text-muted); }
        #btnSave.dirty {
            background-color: rgba(255, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        #btnConfig.active { background-color: var(--warn); color: #121212; border-color: var(--warn); }

        /* --- LISTA --- */
        .grid-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 60px;
            padding-right: 5px;
        }

        .category-section { margin-bottom: 15px; border: 1px solid transparent; border-radius: 6px; transition: 0.2s; }
        /* DRAG AND DROP STYLES */
        .edit-mode .category-section.draggable-cat { cursor: grab; }
        .category-section.drag-over-top { border-top: 2px solid var(--accent); }
        .category-section.drag-over-bottom { border-bottom: 2px solid var(--accent); }
        
        .category-header {
            font-size: 13px; color: var(--accent); text-transform: uppercase; font-weight: bold;
            padding: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
        }

        .category-list { display: flex; flex-direction: column; gap: 6px; min-height: 10px; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 8px 12px; display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text); cursor: pointer; position: relative;
            outline: none; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { background: #252525; border-color: #555; }
        .card:focus { border-color: var(--accent); background: #252525; }

        /* DnD Cards */
        .edit-mode .card { cursor: grab; }
        .card.dragging { opacity: 0.5; transform: scale(0.98); }
        .card.drag-over-top { border-top: 2px solid var(--accent); }
        .card.drag-over-bottom { border-bottom: 2px solid var(--accent); }

        .card img { width: 20px; height: 20px; border-radius: 3px; object-fit: contain; }
        .card span { font-size: 14px; flex-grow: 1; pointer-events: none; }

        /* ACCIONES */
        .actions-group { display: none; gap: 4px; }
        .edit-mode .actions-group { display: flex; }

        .icon-btn {
            background: transparent; border: none; cursor: pointer; color: var(--text-muted);
            padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: #333; color: #fff; }
        .icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .icon-btn.delete:hover { color: var(--danger); background: rgba(255, 68, 68, 0.1); }
        
        .drag-handle-icon {
            color: var(--text-muted); margin-right: 5px; cursor: grab; display: none;
        }
        .edit-mode .drag-handle-icon { display: block; }

        /* MODALES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            width: 85%; max-width: 320px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal h3 { margin-top: 0; color: #fff; margin-bottom: 10px; font-size: 16px; }
        .modal p { color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--text-muted); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-text { padding: 8px 15px; background: #333; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: var(--accent); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-text:hover { filter: brightness(1.2); }

    </style>
</head>

        const icons = {
            edit: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
            delete: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
            drag: '<svg viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>'
        };

        function render(filter = "") {
            mainContainer.innerHTML = "";
            const filterLower = filter.toLowerCase();

            bookmarks.forEach((cat, catIndex) => {
                const filteredItems = cat.items.filter(item => item.name.toLowerCase().includes(filterLower));
                if (filter && filteredItems.length === 0) return;

                const catSection = document.createElement('div');
                catSection.className = 'category-section';
                if(isConfigMode) {
                    catSection.classList.add('draggable-cat');
                    catSection.draggable = true;
                    // Eventos Drag Categoría
                    catSection.addEventListener('dragstart', (e) => handleDragStart(e, 'cat', catIndex));
                    catSection.addEventListener('dragover', (e) => handleDragOver(e, 'cat'));
                    catSection.addEventListener('drop', (e) => handleDrop(e, 'cat', catIndex));
                    // Cleanup visual al salir
                    catSection.addEventListener('dragleave', (e) => {
                        e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
                    });
                }

                const header = document.createElement('div');
                header.className = 'category-header';
                
                const dragHandle = isConfigMode ? `<span class="drag-handle-icon" title="Arrastrar Categoría">${icons.drag}</span>` : '';
                
                header.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        ${dragHandle}
                        <span>${cat.title}</span>
                    </div>
                    <div class="actions-group">
                        <button class="icon-btn" title="Editar Categoría" onclick="editCategory(${catIndex})">${icons.edit}</button>
                        <button class="icon-btn delete" title="Borrar Categoría" onclick="deleteCategory(${catIndex})">${icons.delete}</button>
                    </div>
                `;
                catSection.appendChild(header);

                const list = document.createElement('div');
                list.className = 'category-list';

                const itemsToShow = filter ? filteredItems : cat.items;

                itemsToShow.forEach((bm, itemIndex) => {
                    const realIndex = cat.items.indexOf(bm);
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.tabIndex = 0;

                    if (!isConfigMode) {
                        card.href = bm.url;
                        card.target = "_self";
                    } else {
                        card.removeAttribute('href');
                        card.draggable = true;
                        // Eventos Drag Item
                        card.addEventListener('dragstart', (e) => handleDragStart(e, 'item', catIndex, realIndex));
                        card.addEventListener('dragover', (e) => {
                             // Si arrastramos una categoría, los items NO deben interceptar el evento
                             if (dragSource && dragSource.type === 'cat') return;
                             handleDragOver(e, 'item');
                        });
                        card.addEventListener('drop', (e) => {
                             // Si arrastramos una categoría, los items NO deben interceptar el drop
                             if (dragSource && dragSource.type === 'cat') return;
                             handleDrop(e, 'item', catIndex, realIndex);
                        });
                        card.addEventListener('dragenter', (e) => {}); // Opcional style
                        card.addEventListener('dragleave', (e) => {
                            e.currentTarget.classList.remove('drag-over-top');
                            e.currentTarget.classList.remove('drag-over-bottom');
                        });
                    }

                    // Ya no usamos onerror porque el SVG es local y siempre carga
                    card.innerHTML = `
                        <img src="${getFavicon(bm)}">
                        <span>${bm.name}</span>
                        <div class="actions-group">
                            <button class="icon-btn" title="Editar" onclick="editItem(${catIndex}, ${realIndex}, event)">${icons.edit}</button>
                            <button class="icon-btn delete" title="Borrar" onclick="deleteItem(${catIndex}, ${realIndex}, event)">${icons.delete}</button>
                        </div>
                    `;
                    list.appendChild(card);
                });

                // Drop zone vacía para categorías sin items o para soltar al final
                if(isConfigMode) {
                    list.addEventListener('dragover', (e) => {
                        // IMPORTANTE: Si es categoría, dejar pasar el evento al padre
                        if(dragSource && dragSource.type === 'cat') return;
                        
                        e.preventDefault();
                        if(dragSource && dragSource.type === 'item') {
                            list.style.background = 'rgba(0,122,204,0.05)';
                        }
                    });
                    list.addEventListener('dragleave', () => list.style.background = 'transparent');
                    list.addEventListener('drop', (e) => {
                        // IMPORTANTE: Si es categoría, dejar pasar el evento al padre
                        if(dragSource && dragSource.type === 'cat') return;

                        e.preventDefault();
                        e.stopPropagation();
                        list.style.background = 'transparent';
                        // Si soltamos en el espacio vacío de la lista, movemos al final
                        if(dragSource && dragSource.type === 'item') {
                            moveItem(dragSource.fromCatIdx, dragSource.fromIdx, catIndex, cat.items.length);
                        }
                    });
                }

                catSection.appendChild(list);
                mainContainer.appendChild(catSection);
            });
        }

        // --- DRAG & DROP LOGIC ---
        function handleDragStart(e, type, catIdx, itemIdx = null) {
            e.stopPropagation();
            dragSource = { type, fromCatIdx: catIdx, fromIdx: itemIdx };
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('dragging');
            
            // Hack para Firefox
            e.dataTransfer.setData('text/plain', JSON.stringify(dragSource));
        }

        function handleDragOver(e, type) {
            e.preventDefault();
            e.stopPropagation();
            if(!dragSource) return;

            // Visual feedback logic
            if(type === 'item' && dragSource.type === 'item') {
                const rect = e.currentTarget.getBoundingClientRect();
                const mid = (rect.bottom - rect.top) / 2;
                const clientY = e.clientY - rect.top;
                
                e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
                if(clientY < mid) e.currentTarget.classList.add('drag-over-top');
                else e.currentTarget.classList.add('drag-over-bottom');
            }
            
            // Visual feedback categories (NUEVO)
            if(type === 'cat' && dragSource.type === 'cat') {
                const rect = e.currentTarget.getBoundingClientRect();
                const mid = (rect.bottom - rect.top) / 2;
                const clientY = e.clientY - rect.top;
                
                e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
                if(clientY < mid) e.currentTarget.classList.add('drag-over-top');
                else e.currentTarget.classList.add('drag-over-bottom');
            }
        }

        function handleDrop(e, type, toCatIdx, toItemIdx = null) {
            e.preventDefault();
            e.stopPropagation();
            const targetEl = e.currentTarget;
            targetEl.classList.remove('dragging', 'drag-over', 'drag-over-top', 'drag-over-bottom');
            
            if(!dragSource) return;

            // 1. Reordenar Categorías
            if(type === 'cat' && dragSource.type === 'cat') {
                let finalCatIndex = toCatIdx;
                const rect = targetEl.getBoundingClientRect();
                const mid = (rect.bottom - rect.top) / 2;
                if((e.clientY - rect.top) > mid) {
                    finalCatIndex++; // Insertar después
                }
                
                if(dragSource.fromCatIdx === finalCatIndex || dragSource.fromCatIdx === finalCatIndex - 1) return;

                const movedCat = bookmarks.splice(dragSource.fromCatIdx, 1)[0];
                if(dragSource.fromCatIdx < finalCatIndex) {
                    finalCatIndex--; // Ajustar índice tras eliminación
                }
                
                bookmarks.splice(finalCatIndex, 0, movedCat);
                markAsDirty();
                render(searchInput.value);
            }

            // 2. Reordenar/Mover Items
            if(type === 'item' && dragSource.type === 'item') {
                // Calcular si insertar antes o después
                let finalIndex = toItemIdx;
                const rect = targetEl.getBoundingClientRect();
                const mid = (rect.bottom - rect.top) / 2;
                if((e.clientY - rect.top) > mid) {
                    finalIndex++; // Soltar debajo
                }
                
                moveItem(dragSource.fromCatIdx, dragSource.fromIdx, toCatIdx, finalIndex);
            }
            
            // Limpieza
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            dragSource = null;
        }

        function moveItem(fromCat, fromIdx, toCat, toIdx) {
            // Ajuste de índices si es en la misma categoría
            if(fromCat === toCat) {
                if(fromIdx < toIdx) toIdx--; // Al quitar el item, los índices posteriores bajan
                if(fromIdx === toIdx) return; // Mismo sitio
            }

            const item = bookmarks[fromCat].items.splice(fromIdx, 1)[0];
            bookmarks[toCat].items.splice(toIdx, 0, item);
            markAsDirty();
            render(searchInput.value);
        }


        // --- CONFIRMATION & ALERT LOGIC ---
        const modalConfirm = document.getElementById('modalConfirm');
        const modalAlert = document.getElementById('modalAlert');
        let confirmCallback = null;

        function showConfirm(title, message, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = callback;
            modalConfirm.style.display = 'flex';
        }

        function closeConfirm() {
            modalConfirm.style.display = 'none';
            confirmCallback = null;
        }

        document.getElementById('btnConfirmAction').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        };

        function showAlert(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            modalAlert.style.display = 'flex';
        }

        function closeAlert() {
            modalAlert.style.display = 'none';
        }


        // --- MODO CONFIGURACIÓN Y FAVICON ---
        btnConfig.addEventListener('click', () => {
            isConfigMode = !isConfigMode;
            if (isConfigMode) {
                btnConfig.classList.add('active');
                document.body.classList.add('edit-mode');
            } else {
                btnConfig.classList.remove('active');
                document.body.classList.remove('edit-mode');
                appData.title = titleInput.value;
                titleLabel.innerText = titleInput.value;
                markAsDirty();
            }
            render(searchInput.value);
        });

        // Lógica cambio de Favicon
        btnChangeFavicon.addEventListener('click', () => {
            faviconFile.click();
        });

        faviconFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const base64 = evt.target.result;
                const link = document.getElementById('dynamicFavicon');
                if(link) link.href = base64;
                markAsDirty();
                showAlert("Éxito", "Icono actualizado. Pulsa el botón de Guardar para hacerlo permanente.");
            };
            reader.readAsDataURL(file);
        });

        // --- CRUD LOGIC ---
        const modalType = document.getElementById('modalType');
        const modalItem = document.getElementById('modalItem');
        const modalCat = document.getElementById('modalCat');

        document.getElementById('btnAdd').onclick = () => modalType.style.display = 'flex';
        function closeAllModals() {
            modalType.style.display = 'none';
            modalItem.style.display = 'none';
            modalCat.style.display = 'none';
            closeConfirm();
            closeAlert();
        }

        function openItemModal(catIdx = null, itemIdx = null) {
            closeAllModals();
            const isEdit = (catIdx !== null && itemIdx !== null);
            document.getElementById('modalTitle').innerText = isEdit ? 'Editar Enlace' : 'Añadir Enlace';
            document.getElementById('editCatIndex').value = catIdx !== null ? catIdx : '';
            document.getElementById('editIndex').value = itemIdx !== null ? itemIdx : '';

            const select = document.getElementById('itemCategory');
            select.innerHTML = '';
            bookmarks.forEach((cat, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = cat.title;
                select.appendChild(opt);
            });

            if (isEdit) {
                const item = bookmarks[catIdx].items[itemIdx];
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemUrl').value = item.url;
                // CARGAR ICONO PERSONALIZADO SI EXISTE
                document.getElementById('itemIcon').value = item.customIcon || '';
                select.value = catIdx;
            } else {
                document.getElementById('itemName').value = '';
                document.getElementById('itemUrl').value = '';
                document.getElementById('itemIcon').value = '';
                select.disabled = false;
            }
            modalItem.style.display = 'flex';
            document.getElementById('itemName').focus();
        }

        function editItem(catIdx, itemIdx, e) {
            e.stopPropagation(); e.preventDefault();
            openItemModal(catIdx, itemIdx);
        }

        function deleteItem(catIdx, itemIdx, e) {
            e.stopPropagation(); e.preventDefault();
            showConfirm(
                'Eliminar Enlace',
                `¿Estás seguro de que quieres eliminar "${bookmarks[catIdx].items[itemIdx].name}"?`,
                () => {
                    bookmarks[catIdx].items.splice(itemIdx, 1);
                    markAsDirty();
                    render(searchInput.value);
                }
            );
        }

        document.getElementById('btnSaveItem').onclick = () => {
            const name = document.getElementById('itemName').value;
            let url = document.getElementById('itemUrl').value;
            const customIcon = document.getElementById('itemIcon').value; // CAPTURAR VALOR
            
            const catIdx = parseInt(document.getElementById('itemCategory').value);
            const itemIdx = document.getElementById('editIndex').value;
            const oldCatIdx = document.getElementById('editCatIndex').value;

            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                
                const newItem = { name, url, customIcon }; // GUARDAR OBJETO COMPLETO

                if (itemIdx !== '') {
                    if (oldCatIdx != catIdx) {
                        bookmarks[oldCatIdx].items.splice(itemIdx, 1);
                        bookmarks[catIdx].items.push(newItem);
                    } else {
                        bookmarks[catIdx].items[itemIdx] = newItem;
                    }
                } else {
                    bookmarks[catIdx].items.push(newItem);
                }
                markAsDirty();
                closeAllModals();
                render(searchInput.value);
            }
        };
        document.getElementById('btnCancelItem').onclick = closeAllModals;

        function openCatModal(idx = null) {
            closeAllModals();
            const isEdit = idx !== null;
            document.getElementById('editCatId').value = isEdit ? idx : '';
            document.getElementById('catName').value = isEdit ? bookmarks[idx].title : '';
            modalCat.style.display = 'flex';
            document.getElementById('catName').focus();
        }
        function editCategory(idx) { openCatModal(idx); }

        function deleteCategory(idx) {
            if (bookmarks[idx].items.length > 0) {
                showAlert("No se puede borrar", "La categoría debe estar vacía para poder eliminarla.");
                return;
            }
            showConfirm(
                'Eliminar Categoría',
                `¿Eliminar permanentemente la categoría "${bookmarks[idx].title}"?`,
                () => {
                    bookmarks.splice(idx, 1);
                    markAsDirty();
                    render(searchInput.value);
                }
            );
        }

        document.getElementById('btnSaveCat').onclick = () => {
            const name = document.getElementById('catName').value;
            const idx = document.getElementById('editCatId').value;
            if (name) {
                if (idx !== '') {
                    bookmarks[idx].title = name;
                } else {
                    bookmarks.push({ id: "cat" + Date.now(), title: name, items: [] });
                }
                markAsDirty();
                closeAllModals();
                render(searchInput.value);
            }
        };
        document.getElementById('btnCancelCat').onclick = closeAllModals;

        // --- SISTEMA DE GUARDADO OPTIMIZADO ---
        function markAsDirty() {
            if (!isDirty) {
                isDirty = true;
                btnSave.classList.add('dirty');
                document.title = "⚠️ Cambios sin guardar";
            }
            appData.bookmarks = bookmarks;
            appData.title = titleInput.value; // Asegurar título actualizado
            
            // GUARDADO AUTOMÁTICO EN LOCALSTORAGE
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        btnSave.addEventListener('click', () => {
            // 0. Si está en modo edición, salir primero para guardar la vista limpia
            if (isConfigMode) {
                appData.title = titleInput.value;
                titleLabel.innerText = titleInput.value;
                isConfigMode = false;
                btnConfig.classList.remove('active');
                document.body.classList.remove('edit-mode');
            }

            // 1. Limpieza de estado visual
            isDirty = false;
            btnSave.classList.remove('dirty');
            document.title = appData.title;

            // 2. Actualizar datos en memoria
            appData.title = titleInput.value;
            appData.bookmarks = bookmarks;

            // 3. LIMPIEZA CRÍTICA DEL DOM PARA REDUCIR PESO
            mainContainer.innerHTML = "";

            // 4. Capturar HTML limpio
            const htmlContent = document.documentElement.outerHTML;

            // 5. Restaurar vista inmediatamente
            render(searchInput.value);

            // 6. Inyectar datos JSON actualizados
            const newDataString = JSON.stringify(appData, null, 4);
            const regex = /(\/\*DATA_START\*\/)([\s\S]*?)(\/\*DATA_END\*\/)/;
            const newScriptContent = `$1\n        let appData = ${newDataString};\n        $3`;

            const newHtml = htmlContent.replace(regex, newScriptContent);

            // 7. COPIAR AL PORTAPAPELES
            try {
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = newHtml;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                console.log("Código copiado al portapapeles");
            } catch (err) {
                console.error("Error al copiar al portapapeles", err);
            }

            // 8. Generar descarga
            const blob = new Blob([newHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'panel_ia_final.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 9. Notificación final
            showAlert("Guardado y Copiado", "El código se ha copiado al portapapeles y el archivo se ha descargado.");
        });
    </script>
</body></html>
