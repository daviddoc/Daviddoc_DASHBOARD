    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando IA</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,

%3Cpath fill='%23800080' stroke-width='0.181273' d='M14.575688,95.227221 C11.934234,94.713436 9.8622448,93.600867 8.0176176,91.705808 4.210982,87.795111 3.535061,81.865229 6.346069,77.041265 6.8021882,76.258524 11.389104,71.551536 24.683286,58.224052 L42.412226,40.4507 41.96467,38.737108 c-0.661285,-2.531902 -0.880025,-4.318452 -0.875642,-7.151808 0.0049,-3.104451 0.374846,-5.437165 1.311635,-8.268316 C47.12686,9.0335162 62.179218,1.3515306 76.566086,5.8806213 c1.280774,0.4031973 2.373017,0.8531361 2.625865,1.0817011 0.04551,0.041137 -4.053595,4.2117476 -9.109131,9.2680116 l-9.191882,9.193206 6.843986,6.842209 6.843984,6.842206 9.152881,-9.154226 c5.034087,-5.034824 9.204319,-9.154227 9.267188,-9.154227 0.379963,0 1.651104,4.071856 2.093138,6.704977 0.390423,2.325675 0.378735,6.451539 -0.02491,8.793941 C92.358769,52.015714 77.030342,62.018791 61.617858,58.126925 L59.534792,57.60092 41.677725,75.425989 C24.321969,92.750658 23.779947,93.27181 22.370467,93.989505 c-2.504633,1.275357 -5.310583,1.720905 -7.794779,1.237716 z'/%3E

    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #007acc;
            --danger: #ff4444;
            --warn: #ffbb33;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        /* --- TÍTULO Y CONFIG --- */
        .title-container {
            text-align: center;
            margin-bottom: 10px;
            min-height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 18px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            pointer-events: none;
        }

        .config-controls {
            display: none;
            width: 100%;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .edit-mode .config-controls { display: flex; }
        .edit-mode h1 { display: none; }

        #titleInput {
            background: #111;
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px;
            border-radius: 4px;
            flex-grow: 1;
        }

        .btn-small {
            font-size: 12px;
            padding: 5px 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-small:hover { background: #444; }

        /* --- HEADER --- */
        .header { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; flex-shrink: 0; }
        .search-container { position: relative; flex-grow: 1; }

        input[type="text"], select {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 30px 8px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .clear-search {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: none;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            border-radius: 50%;
        }
        .clear-search:hover { background: #333; color: #fff; }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
            flex-shrink: 0;
        }
        .btn svg { width: 18px; height: 18px; fill: currentColor; }
        .btn:hover { background: #2a2a2a; }

        #btnSave { color: var(--text-muted); }
        #btnSave.dirty {
            background-color: rgba(255, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        #btnConfig.active { background-color: var(--warn); color: #121212; border-color: var(--warn); }

        /* --- LISTA --- */
        .grid-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 60px;
            padding-right: 5px;
        }

        .category-section { margin-bottom: 15px; }
        .category-header {
            font-size: 13px; color: var(--accent); text-transform: uppercase; font-weight: bold;
            padding: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
        }

        .category-list { display: flex; flex-direction: column; gap: 6px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 8px 12px; display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text); cursor: pointer; position: relative;
            outline: none;
        }
        .card:hover { background: #252525; border-color: #555; }
        .card:focus { border-color: var(--accent); background: #252525; }

        .card img { width: 20px; height: 20px; border-radius: 3px; object-fit: contain; }
        .card span { font-size: 14px; flex-grow: 1; pointer-events: none; }

        /* ACCIONES */
        .actions-group { display: none; gap: 4px; }
        .edit-mode .actions-group { display: flex; }

        .icon-btn {
            background: transparent; border: none; cursor: pointer; color: var(--text-muted);
            padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: #333; color: #fff; }
        .icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .icon-btn.delete:hover { color: var(--danger); background: rgba(255, 68, 68, 0.1); }
        .icon-btn.move:hover { color: var(--accent); background: rgba(0, 122, 204, 0.1); }

        /* MODALES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            width: 85%; max-width: 320px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal h3 { margin-top: 0; color: #fff; margin-bottom: 10px; font-size: 16px; }
        .modal p { color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--text-muted); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-text { padding: 8px 15px; background: #333; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: var(--accent); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-text:hover { filter: brightness(1.2); }

    </style>
</head>
<body class="edit-mode">

    <div class="title-container">
        <h1 id="mainTitle">Centro de Mando IA</h1>

        <div class="config-controls">
            <input type="text" id="titleInput" value="Centro de Mando IA" placeholder="Título...">
            <input type="file" id="faviconFile" accept=".svg, .png, .jpg, .ico" style="display: none;">
            <button class="btn-small" id="btnChangeFavicon" title="Subir imagen (SVG/PNG)">Cambiar Icono</button>
        </div>
    </div>

    <div class="header">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
            <span class="clear-search" id="clearSearch" title="Limpiar">✕</span>
        </div>
        <button class="btn" id="btnSave" title="Guardar cambios">
            <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"></path></svg>
        </button>
        <button class="btn active" id="btnConfig" title="Configurar">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.04.17 0 .36.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.04-.22 0-.41-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"></path></svg>
        </button>
        <button class="btn" id="btnAdd" title="Añadir">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
        </button>
    </div>

    <div class="grid-container" id="mainContainer"></div>

    <div class="modal-overlay" id="modalConfirm" style="display: none;">
        <div class="modal">
            <h3 id="confirmTitle">Eliminar Enlace</h3>
            <p id="confirmMessage">¿Estás seguro de que quieres eliminar "DuckDuckGo AI"?</p>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeConfirm()">Cancelar</button>
                <button class="btn-text btn-danger" id="btnConfirmAction">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalAlert" style="display: none;">
        <div class="modal">
            <h3 id="alertTitle" style="color: var(--warn);">Atención</h3>
            <p id="alertMessage">Mensaje de alerta</p>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeAlert()">Entendido</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalItem" style="display: none;">
        <div class="modal">
            <h3 id="modalTitle">Editar Enlace</h3>
            <input type="hidden" id="editIndex" value="2">
            <input type="hidden" id="editCatIndex" value="1">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="itemName">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="itemUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="itemCategory"><option value="0">IAGENTES</option><option value="1">HERRAMIENTAS</option><option value="2">REFORACEN</option><option value="3">Utilidades</option></select>
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="btnCancelItem">Cancelar</button>
                <button class="btn-text btn-primary" id="btnSaveItem">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalCat" style="display: none;">
        <div class="modal">
            <h3>Nueva Categoría</h3>
            <input type="hidden" id="editCatId" value="2">
            <div class="form-group">
                <label>Nombre de Categoría</label>
                <input type="text" id="catName">
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="btnCancelCat">Cancelar</button>
                <button class="btn-text btn-primary" id="btnSaveCat">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalType" style="display: none;">
        <div class="modal" style="text-align: center;">
            <h3>¿Qué deseas añadir?</h3>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn-text" onclick="openCatModal()">Categoría</button>
                <button class="btn-text btn-primary" onclick="openItemModal()">Enlace IA</button>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn-text" style="background: transparent; color: #888;" onclick="closeAllModals()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATOS INICIALES ---
        /*DATA_START*/
        let appData = {
    "title": "Centro de Mando IA",
    "bookmarks": [
        {
            "id": "chat",
            "title": "IAGENTES",
            "items": [
                {
                    "name": "Catalogador",
                    "url": "https://notebooklm.google.com/notebook/20cb8724-ce47-4dd2-84a3-95f4854818a2?authuser=1"
                },
                {
                    "name": "Legislación y manuales",
                    "url": "https://notebooklm.google.com/notebook/31b86db9-b05b-42a8-bfa5-0dbadecf0b28?authuser=1"
                },
                {
                    "name": "NOTEBOOK Twitter X CFIE",
                    "url": "https://notebooklm.google.com/notebook/b19b9a2f-9d0f-4474-aa2e-5d934f81c547?authuser=1"
                },
                {
                    "name": "Actas y cargos",
                    "url": "https://notebooklm.google.com/notebook/d6f542a8-6014-4523-8475-adebb06caf3d?authuser=1"
                }
            ]
        },
        {
            "id": "dev",
            "title": "HERRAMIENTAS",
            "items": [
                {
                    "name": "Calculadora",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS/CALCULADORA/calculadora.html"
                },
                {
                    "name": "Look Scanned",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS//LOOK_SCANNED/Look_Scanned_ONLINE.html"
                },
                {
                    "name": "Documento LOCAL a Markdown: PDF, Word, HTML",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS/TO_MD/pdf-word-html_a_markdown.html"
                },
                {
                    "name": "Twitter X Posts",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS/TWITTER_X/twitter_x.html"
                }
                {
                    "name": "CSV Master Editor",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS/CSV_MASTER_EDITOR/CSV_Master_Editor_(ONLINE).html"
                }
            ]
        },
        {
            "id": "creative",
            "title": "REFORACEN",
            "items": [
                {
                    "name": "Carga Masiva",
                    "url": "https://daviddoc.github.io/Daviddoc_DASHBOARD/TOOLS/CARGA_MASIVA/carga_masiva.html"
                }
            ]
        },
        {
            "id": "util",
            "title": "Utilidades",
            "items": []
        }
    ]
};
        /*DATA_END*/

        let bookmarks = appData.bookmarks;
        let isConfigMode = false;
        let isDirty = false;

        const mainContainer = document.getElementById('mainContainer');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const btnSave = document.getElementById('btnSave');
        const btnConfig = document.getElementById('btnConfig');
        const titleLabel = document.getElementById('mainTitle');
        const titleInput = document.getElementById('titleInput');

        // Favicon Logic
        const faviconFile = document.getElementById('faviconFile');
        const btnChangeFavicon = document.getElementById('btnChangeFavicon');

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            titleLabel.innerText = appData.title || "Centro de Mando IA";
            titleInput.value = appData.title || "Centro de Mando IA";
            searchInput.focus();
            render();
        };

        // --- NAVEGACIÓN TAB ---
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Tab' && !e.shiftKey) {
                e.preventDefault();
                const firstCard = document.querySelector('.card');
                if (firstCard) firstCard.focus();
            }
        });

        // --- BUSCADOR ---
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            clearSearchBtn.style.display = val ? 'block' : 'none';
            render(val);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            render();
            searchInput.focus();
        });

        // --- RENDERIZADO ---
        function getFavicon(bm) {
            if (bm.customIcon) return bm.customIcon;
            return `https://s2.googleusercontent.com/s2/favicons?domain=${bm.url}&sz=64`;
        }

        const icons = {
            edit: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
            delete: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
            up: '<svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>',
            down: '<svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>'
        };

        function render(filter = "") {
            mainContainer.innerHTML = "";
            const filterLower = filter.toLowerCase();

            bookmarks.forEach((cat, catIndex) => {
                const filteredItems = cat.items.filter(item => item.name.toLowerCase().includes(filterLower));
                if (filter && filteredItems.length === 0) return;

                const catSection = document.createElement('div');
                catSection.className = 'category-section';

                // Botones de orden
                let moveButtons = '';
                if (bookmarks.length > 1) {
                    const upBtn = catIndex > 0
                        ? `<button class="icon-btn move" title="Subir" onclick="moveCategory(${catIndex}, -1)">${icons.up}</button>` : '';
                    const downBtn = catIndex < bookmarks.length - 1
                        ? `<button class="icon-btn move" title="Bajar" onclick="moveCategory(${catIndex}, 1)">${icons.down}</button>` : '';
                    moveButtons = upBtn + downBtn;
                }

                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <span>${cat.title}</span>
                    <div class="actions-group">
                        ${moveButtons}
                        <button class="icon-btn" title="Editar Categoría" onclick="editCategory(${catIndex})">${icons.edit}</button>
                        <button class="icon-btn delete" title="Borrar Categoría" onclick="deleteCategory(${catIndex})">${icons.delete}</button>
                    </div>
                `;
                catSection.appendChild(header);

                const list = document.createElement('div');
                list.className = 'category-list';

                const itemsToShow = filter ? filteredItems : cat.items;

                itemsToShow.forEach((bm, itemIndex) => {
                    const realIndex = cat.items.indexOf(bm);
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.tabIndex = 0;

                    if (!isConfigMode) {
                        card.href = bm.url;
                        card.target = "_self";
                    } else {
                        card.removeAttribute('href');
                        card.style.cursor = "default";
                    }

                    card.innerHTML = `
                        <img src="${getFavicon(bm)}" onerror="this.src='https://via.placeholder.com/20'">
                        <span>${bm.name}</span>
                        <div class="actions-group">
                            <button class="icon-btn" title="Editar" onclick="editItem(${catIndex}, ${realIndex}, event)">${icons.edit}</button>
                            <button class="icon-btn delete" title="Borrar" onclick="deleteItem(${catIndex}, ${realIndex}, event)">${icons.delete}</button>
                        </div>
                    `;

                    list.appendChild(card);
                });

                catSection.appendChild(list);
                mainContainer.appendChild(catSection);
            });
        }

        // --- CONFIRMATION & ALERT LOGIC ---
        const modalConfirm = document.getElementById('modalConfirm');
        const modalAlert = document.getElementById('modalAlert');
        let confirmCallback = null;

        function showConfirm(title, message, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            confirmCallback = callback;
            modalConfirm.style.display = 'flex';
        }

        function closeConfirm() {
            modalConfirm.style.display = 'none';
            confirmCallback = null;
        }

        document.getElementById('btnConfirmAction').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        };

        function showAlert(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            modalAlert.style.display = 'flex';
        }

        function closeAlert() {
            modalAlert.style.display = 'none';
        }


        // --- MODO CONFIGURACIÓN Y FAVICON ---
        btnConfig.addEventListener('click', () => {
            isConfigMode = !isConfigMode;
            if (isConfigMode) {
                btnConfig.classList.add('active');
                document.body.classList.add('edit-mode');
            } else {
                btnConfig.classList.remove('active');
                document.body.classList.remove('edit-mode');
                appData.title = titleInput.value;
                titleLabel.innerText = titleInput.value;
                markAsDirty();
            }
            render(searchInput.value);
        });

        // Lógica cambio de Favicon
        btnChangeFavicon.addEventListener('click', () => {
            faviconFile.click();
        });

        faviconFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const base64 = evt.target.result;
                document.getElementById('dynamicFavicon').href = base64;
                markAsDirty();
                showAlert("Éxito", "Icono actualizado. Pulsa el botón de Guardar para hacerlo permanente.");
            };
            reader.readAsDataURL(file);
        });

        // --- REORGANIZAR CATEGORÍAS ---
        function moveCategory(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < bookmarks.length) {
                const temp = bookmarks[index];
                bookmarks[index] = bookmarks[newIndex];
                bookmarks[newIndex] = temp;
                markAsDirty();
                render(searchInput.value);
            }
        }

        // --- CRUD LOGIC ---
        const modalType = document.getElementById('modalType');
        const modalItem = document.getElementById('modalItem');
        const modalCat = document.getElementById('modalCat');

        document.getElementById('btnAdd').onclick = () => modalType.style.display = 'flex';
        function closeAllModals() {
            modalType.style.display = 'none';
            modalItem.style.display = 'none';
            modalCat.style.display = 'none';
            closeConfirm();
            closeAlert();
        }

        function openItemModal(catIdx = null, itemIdx = null) {
            closeAllModals();
            const isEdit = (catIdx !== null && itemIdx !== null);
            document.getElementById('modalTitle').innerText = isEdit ? 'Editar Enlace' : 'Añadir Enlace';
            document.getElementById('editCatIndex').value = catIdx !== null ? catIdx : '';
            document.getElementById('editIndex').value = itemIdx !== null ? itemIdx : '';

            const select = document.getElementById('itemCategory');
            select.innerHTML = '';
            bookmarks.forEach((cat, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = cat.title;
                select.appendChild(opt);
            });

            if (isEdit) {
                const item = bookmarks[catIdx].items[itemIdx];
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemUrl').value = item.url;
                select.value = catIdx;
            } else {
                document.getElementById('itemName').value = '';
                document.getElementById('itemUrl').value = '';
                select.disabled = false;
            }
            modalItem.style.display = 'flex';
            document.getElementById('itemName').focus();
        }

        function editItem(catIdx, itemIdx, e) {
            e.stopPropagation(); e.preventDefault();
            openItemModal(catIdx, itemIdx);
        }

        function deleteItem(catIdx, itemIdx, e) {
            e.stopPropagation(); e.preventDefault();
            showConfirm(
                'Eliminar Enlace',
                `¿Estás seguro de que quieres eliminar "${bookmarks[catIdx].items[itemIdx].name}"?`,
                () => {
                    bookmarks[catIdx].items.splice(itemIdx, 1);
                    markAsDirty();
                    render(searchInput.value);
                }
            );
        }

        document.getElementById('btnSaveItem').onclick = () => {
            const name = document.getElementById('itemName').value;
            let url = document.getElementById('itemUrl').value;
            const catIdx = parseInt(document.getElementById('itemCategory').value);
            const itemIdx = document.getElementById('editIndex').value;
            const oldCatIdx = document.getElementById('editCatIndex').value;

            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                if (itemIdx !== '') {
                    if (oldCatIdx != catIdx) {
                        bookmarks[oldCatIdx].items.splice(itemIdx, 1);
                        bookmarks[catIdx].items.push({ name, url });
                    } else {
                        bookmarks[catIdx].items[itemIdx] = { name, url };
                    }
                } else {
                    bookmarks[catIdx].items.push({ name, url });
                }
                markAsDirty();
                closeAllModals();
                render(searchInput.value);
            }
        };
        document.getElementById('btnCancelItem').onclick = closeAllModals;

        function openCatModal(idx = null) {
            closeAllModals();
            const isEdit = idx !== null;
            document.getElementById('editCatId').value = isEdit ? idx : '';
            document.getElementById('catName').value = isEdit ? bookmarks[idx].title : '';
            modalCat.style.display = 'flex';
            document.getElementById('catName').focus();
        }
        function editCategory(idx) { openCatModal(idx); }

        function deleteCategory(idx) {
            if (bookmarks[idx].items.length > 0) {
                showAlert("No se puede borrar", "La categoría debe estar vacía para poder eliminarla.");
                return;
            }
            showConfirm(
                'Eliminar Categoría',
                `¿Eliminar permanentemente la categoría "${bookmarks[idx].title}"?`,
                () => {
                    bookmarks.splice(idx, 1);
                    markAsDirty();
                    render(searchInput.value);
                }
            );
        }

        document.getElementById('btnSaveCat').onclick = () => {
            const name = document.getElementById('catName').value;
            const idx = document.getElementById('editCatId').value;
            if (name) {
                if (idx !== '') {
                    bookmarks[idx].title = name;
                } else {
                    bookmarks.push({ id: "cat" + Date.now(), title: name, items: [] });
                }
                markAsDirty();
                closeAllModals();
                render(searchInput.value);
            }
        };
        document.getElementById('btnCancelCat').onclick = closeAllModals;

        // --- SISTEMA DE GUARDADO OPTIMIZADO ---
        function markAsDirty() {
            if (!isDirty) {
                isDirty = true;
                btnSave.classList.add('dirty');
                document.title = "⚠️ Cambios sin guardar";
            }
            appData.bookmarks = bookmarks;
        }

        btnSave.addEventListener('click', () => {
            if (!isDirty) {
                showAlert("Información", "No hay cambios para guardar.");
                return;
            }

            // 1. Limpieza de estado visual
            isDirty = false;
            btnSave.classList.remove('dirty');
            document.title = appData.title;

            // 2. Actualizar datos en memoria
            appData.title = document.getElementById('mainTitle').innerText;
            appData.bookmarks = bookmarks;

            // 3. LIMPIEZA CRÍTICA DEL DOM PARA REDUCIR PESO
            mainContainer.innerHTML = "";

            // 4. Capturar HTML limpio
            const htmlContent = document.documentElement.outerHTML;

            // 5. Restaurar vista inmediatamente
            render(searchInput.value);

            // 6. Inyectar datos JSON actualizados
            const newDataString = JSON.stringify(appData, null, 4);
            const regex = /(\/\*DATA_START\*\/)([\s\S]*?)(\/\*DATA_END\*\/)/;
            const newScriptContent = `$1\n        let appData = ${newDataString};\n        $3`;

            const newHtml = htmlContent.replace(regex, newScriptContent);

            // 7. Generar descarga
            const blob = new Blob([newHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'panel_ia_final.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            if(isConfigMode) btnConfig.click();
        });
    </script>


</body></html>
