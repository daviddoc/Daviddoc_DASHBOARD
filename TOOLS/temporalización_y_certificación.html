<!DOCTYPE html>
<html lang="es" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Certificación Markdown Pro</title>
    
    <!-- Fuente DejaVu Sans Mono (CDN) -->
    <link href="https://fonts.cdnfonts.com/css/dejavu-sans-mono" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0b0f19',
              }
            },
            fontFamily: {
              // Priorizamos DejaVu Sans Mono
              mono: ['"DejaVu Sans Mono"', '"Bitstream Vera Sans Mono"', 'Menlo', 'Courier New', 'monospace'],
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <style>
      html, body, #root { height: 100%; overflow: hidden; background-color: #0b0f19; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .preview-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
      .preview-scroll::-webkit-scrollbar-track { background: #0d1117; }
      .preview-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
      .preview-scroll::-webkit-scrollbar-thumb:hover { background: #484f58; }

      input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body class="text-gray-100 font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-presets="react,typescript">
      const { useState, useEffect, useCallback } = React;

      // --- ICONS ---
      const Icon = ({ children, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
      );
      const Trash = () => <Icon className="w-4 h-4"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></Icon>;
      const Plus = () => <Icon className="w-4 h-4"><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
      const Copy = () => <Icon className="w-4 h-4"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></Icon>;
      const TableIcon = () => <Icon className="w-5 h-5"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></Icon>;
      const Eraser = () => <Icon className="w-4 h-4"><path d="m2.5 12.5 5 5 2.5-2.5 3.5 3.5 6-6-2.5-2.5-3.5 3.5-5-5-6 6Z"/></Icon>;
      const CalendarIcon = () => <Icon className="w-4 h-4"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>;

      // --- CONFIGURACIÓN ---
      const CHAR_OVERLINE = '\u203E';
      const CHAR_BLOCK = '\u2588';
      const BLOCK_COUNT = 6; // VUELVE A 6 CARACTERES
      const BLOCK_STRING = CHAR_BLOCK.repeat(BLOCK_COUNT);
      const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

      const generateTimeOptions = () => {
        const times = [];
        for (let h = 8; h <= 22; h++) {
          const hh = h.toString().padStart(2, '0');
          times.push(`${hh}:00`, `${hh}:30`);
        }
        return times;
      };
      const TIME_OPTIONS = generateTimeOptions();

      // --- FECHAS ---
      const parseDateParts = (inputStr) => {
          if (!inputStr) return null;
          const clean = inputStr.trim().toLowerCase();
          
          if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) {
             const [y, m, d] = clean.split('-');
             return { d: parseInt(d), m: parseInt(m)-1, y: y };
          }
          if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(clean)) {
             const [d, m, y] = clean.split('/');
             const fullY = y.length === 2 ? '20'+y : y;
             return { d: parseInt(d), m: parseInt(m)-1, y: fullY };
          }
          const textMatch = clean.match(/^(\d{1,2})\s+([a-z]{3})\s+(\d{2})$/);
          if (textMatch) {
              const mIdx = MESES_CORTOS.indexOf(textMatch[2]);
              if (mIdx !== -1) {
                  return { d: parseInt(textMatch[1]), m: mIdx, y: '20'+textMatch[3] };
              }
          }
          return null;
      };

      const formatDateForHeader = (inputStr) => {
          const p = parseDateParts(inputStr);
          if (!p) return inputStr;
          const day = p.d.toString().padStart(2, '0');
          const month = MESES_CORTOS[p.m];
          return `${day} ${month}`;
      };

      const formatDateForTemporalizacion = (inputStr) => {
          const p = parseDateParts(inputStr);
          if (!p) return inputStr;
          const day = p.d.toString().padStart(2, '0');
          const month = (p.m + 1).toString().padStart(2, '0');
          return `${p.y}/${month}/${day}`;
      };

      const formatForInput = (dObj) => {
          return `${dObj.getDate()} ${MESES_CORTOS[dObj.getMonth()]} ${dObj.getFullYear().toString().slice(-2)}`;
      };

      // --- CÁLCULOS ---
      const calculateDurationMinutes = (start, end) => {
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        let diff = (eh * 60 + em) - (sh * 60 + sm);
        if (diff < 0) diff += 24 * 60;
        return diff;
      };

      const minutesToHmm = (m) => {
        const h = Math.floor(m / 60);
        const mins = Math.round(m % 60);
        return `${h}:${mins.toString().padStart(2, '0')}`;
      };

      const formatHorasDisplay = (hm) => {
         const [h, m] = hm.split(':');
         return m === '00' ? `${parseInt(h)} h` : `${parseInt(h)}:${m} h`;
      };

      const padRight = (str, len) => {
          const s = str || '';
          return s + ' '.repeat(Math.max(0, len - s.length));
      };

      // --- COMPONENTES ---
      const Button = ({ onClick, children, variant = 'primary', className = '', ...props }) => {
        const base = "flex items-center justify-center px-3 py-2 rounded-lg text-sm font-medium transition-all active:scale-95";
        const styles = {
          primary: "bg-blue-600 text-white hover:bg-blue-500 shadow-lg shadow-blue-900/20",
          secondary: "bg-gray-800 text-gray-300 hover:bg-gray-700 border border-gray-700",
          ghost: "text-gray-400 hover:text-white hover:bg-gray-800",
          danger: "bg-red-900/30 text-red-200 hover:bg-red-900/50 border border-red-900/50"
        };
        return <button onClick={onClick} className={`${base} ${styles[variant]} ${className}`} {...props}>{children}</button>;
      };

      const Card = ({ title, icon, children, className = '' }) => (
        <div className={`bg-[#161b22] border border-gray-800 rounded-xl overflow-hidden shadow-xl flex flex-col shrink-0 ${className}`}>
          <div className="px-4 py-3 border-b border-gray-800/50 bg-[#1c2128] flex justify-between items-center shrink-0">
            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
              {icon} {title}
            </h3>
          </div>
          <div className="p-4">
            {children}
          </div>
        </div>
      );

      const SmartDateInput = ({ value, onChange, placeholder }) => {
         const handleDatePick = (e) => {
            if (!e.target.value) return;
            const [y, m, d] = e.target.value.split('-');
            const dateObj = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
            onChange(formatForInput(dateObj));
         };

         return (
            <div className="relative group w-full">
               <input 
                  type="text" 
                  value={value}
                  onChange={(e) => onChange(e.target.value)}
                  placeholder={placeholder || "7 oct 24"}
                  className="w-full bg-[#161b22] border border-gray-700 rounded px-2 py-1.5 pr-8 text-sm text-gray-200 outline-none focus:border-blue-500 transition-colors"
               />
               <div className="absolute right-0 top-0 bottom-0 w-8 flex items-center justify-center text-gray-500 hover:text-blue-400 cursor-pointer">
                  <CalendarIcon />
                  <input 
                     type="date" 
                     onChange={handleDatePick}
                     className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                     tabIndex="-1"
                  />
               </div>
            </div>
         );
      };

      // --- APP PRINCIPAL ---
      const App = () => {
        const [view, setView] = useState('input');
        const [excelInput, setExcelInput] = useState('');
        const [codigo, setCodigo] = useState('');
        const [modulos, setModulos] = useState({ app: false, appH: 2, col: false, colH: 2 });
        
        const getInitialDate = () => {
           const d = new Date();
           return formatForInput(d);
        };

        const [sessions, setSessions] = useState([
          { id: 1, date: getInitialDate(), start: '16:00', end: '19:00' }
        ]);

        const [output, setOutput] = useState('');
        const [copyFeedback, setCopyFeedback] = useState(false);

        const addSession = () => {
          const lastSession = sessions[sessions.length - 1];
          const newSession = {
            id: Date.now(),
            date: lastSession ? lastSession.date : getInitialDate(),
            start: lastSession ? lastSession.start : '16:00',
            end: lastSession ? lastSession.end : '19:00'
          };
          setSessions([...sessions, newSession]);
        };

        const updateSession = (id, field, value) => {
          setSessions(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
        };

        const removeSession = (id) => {
          if (sessions.length > 1) {
            setSessions(prev => prev.filter(s => s.id !== id));
          }
        };

        const clearAll = () => {
           setExcelInput('');
           setCodigo('');
           setModulos({ app: false, appH: 2, col: false, colH: 2 });
           setSessions([{ id: Date.now(), date: getInitialDate(), start: '16:00', end: '19:00' }]);
        };

        const generate = useCallback(() => {
          const rawData = excelInput.trim();
          if (!rawData) {
            setOutput('');
            return;
          }

          // 1. Parse Excel
          const rows = rawData.split('\n').filter(r => r.trim()).map(r => r.split('\t').map(c => c.trim()));
          const maxCols = Math.max(...rows.map(r => r.length));
          const normalizedRows = rows.map(r => {
             while(r.length < maxCols) r.push('');
             return r;
          });
          
          const headers = normalizedRows[0];
          const body = normalizedRows.slice(1);
          const surnameIdx = headers.findIndex(h => h.toUpperCase().includes('APELLIDO'));
          const sortedBody = surnameIdx >= 0 
             ? [...body].sort((a,b) => (a[surnameIdx]||'').localeCompare(b[surnameIdx]||'', 'es', {sensitivity:'base'}))
             : body;
          
          const apellidosList = surnameIdx >= 0 ? sortedBody.map(r => r[surnameIdx]) : [];

          // Helper: Tabla Principal
          const buildTable = (dataRows) => {
             const colWidths = new Array(dataRows[0].length).fill(0);
             dataRows.forEach(r => r.forEach((c, i) => colWidths[i] = Math.max(colWidths[i], c.length, 3)));
             return dataRows.map((r, rIdx) => {
                const line = '| ' + r.map((c, i) => padRight(c, colWidths[i])).join(' | ') + ' |';
                if (rIdx === 0) return line + '\n| ' + colWidths.map(w => '-'.repeat(w)).join(' | ') + ' |';
                return line;
             }).join('\n');
          };

          const mainTableMd = buildTable([headers, ...sortedBody]);

          // 2. Tabla de Asistencia
          let attMd = '';
          let statsMd = '';

          if (apellidosList.length > 0 && sessions.length > 0) {
             const totalMinsSessions = sessions.reduce((acc, s) => acc + calculateDurationMinutes(s.start, s.end), 0);
             let totalMinsCert = totalMinsSessions + (modulos.app ? modulos.appH * 60 : 0) + (modulos.col ? modulos.colH * 60 : 0);
             
             const stats = {
                total: minutesToHmm(totalMinsCert),
                pres: minutesToHmm(totalMinsSessions),
                inscritos: apellidosList.length
             };

             // CONSTRUCCIÓN DE FILAS
             const row1 = ['', codigo, '', '', 
                ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []), 
                ...sessions.map(s => formatDateForHeader(s.date))
             ];
             const row2 = ['', '', '', '',
                 ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []),
                 ...sessions.map(s => s.start)
             ];
             const row3 = ['', '', 'CERT', minutesToHmm(totalMinsSessions * 0.85),
                ...(modulos.app ? ['APLI'] : []), ...(modulos.col ? ['COL'] : []),
                ...sessions.map(s => s.end)
             ];
             const row4 = ['Nº', 'APELLIDOS', stats.total, stats.pres,
                ...(modulos.app ? [modulos.appH.toString()] : []), ...(modulos.col ? [modulos.colH.toString()] : []),
                ...sessions.map(s => minutesToHmm(calculateDurationMinutes(s.start, s.end)))
             ];
             const studentRows = apellidosList.map((name, i) => [
                (i+1).toString(), name, '', '',
                ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []),
                ...sessions.map(() => BLOCK_STRING)
             ]);

             // Agrupamos TODOS los datos
             const fullAttData = [row1, row2, row3, row4, ...studentRows];
             
             // CÁLCULO DE ANCHOS
             const attWidths = new Array(fullAttData[0].length).fill(0);
             fullAttData.forEach(r => {
                 r.forEach((c, i) => {
                     const cellLen = (c || '').length;
                     if (cellLen > attWidths[i]) attWidths[i] = cellLen;
                 });
             });
             for(let i=0; i<attWidths.length; i++) attWidths[i] = Math.max(attWidths[i], 3);
             
             // RENDERIZADO CON EXCEPCIÓN PARA BLOQUES
             attMd = fullAttData.map((r, i) => {
                const line = '| ' + r.map((c, idx) => {
                    const content = c || '';
                    if (content === BLOCK_STRING) {
                        return content; // Return sin padding
                    }
                    return padRight(content, attWidths[idx]);
                }).join(' | ') + ' |';
                
                if (i === 3) return line + '\n| ' + attWidths.map(w => CHAR_OVERLINE.repeat(w)).join(' | ') + ' |';
                return line;
             }).join('\n');

             statsMd = `### MÓDULOS:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
               `- HORAS: ${formatHorasDisplay(stats.total)}\n` +
               ` - Presencial__ ➤ ${formatHorasDisplay(stats.pres)}\n` +
               (modulos.app ? ` - Aplicación__ ➤ ${modulos.appH} h\n` : '') +
               (modulos.col ? ` - Colaboración ➤ ${modulos.colH} h\n` : '') +
               `\n### TEMPORALIZACIÓN:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
               // SE AÑADE DOBLE ESPACIO ANTES DE 'SESIÓN'
               sessions.map((s, i) => `${CHAR_BLOCK} ${formatDateForTemporalizacion(s.date)} ${s.start}-${s.end} ${codigo}  SESIÓN ${i+1} / ${sessions.length}`).join('\n') +
               `\n\n### PARTICIPACIÓN / CERTIFICACIÓN:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n` + 
               `${mainTableMd}\n\n${attMd}\n\n` +
               `- Inscritos_ ➤ ${stats.inscritos.toString().padStart(2, ' ')}\n- Certifican ➤ \n- Porcentaje ➤ `;
          } else {
             statsMd = `### PARTICIPACIÓN / CERTIFICACIÓN:\n\n${mainTableMd}`;
          }
          setOutput(statsMd);
        }, [excelInput, codigo, modulos, sessions]);

        useEffect(() => { generate(); }, [generate]);

        const copyToClipboard = () => {
          if (!output) return;
          navigator.clipboard.writeText(output);
          setCopyFeedback(true);
          setTimeout(() => setCopyFeedback(false), 2000);
        };

        return (
          <div className="flex flex-col h-full max-w-[1920px] mx-auto">
            <header className="h-14 bg-[#161b22] border-b border-gray-800 flex items-center justify-between px-4 shrink-0 z-20 shadow-sm">
              <div className="flex items-center gap-2">
                <div className="bg-blue-600/20 p-1.5 rounded-lg border border-blue-500/30">
                  <TableIcon className="w-4 h-4 text-blue-400" />
                </div>
                <h1 className="font-bold text-gray-200 tracking-tight text-sm sm:text-base">
                  Certificación <span className="text-blue-400">Pro</span>
                </h1>
              </div>
              <div className="flex sm:hidden bg-gray-900 rounded-lg p-1 border border-gray-800">
                 <button onClick={() => setView('input')} className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${view === 'input' ? 'bg-blue-600 text-white shadow' : 'text-gray-400'}`}>Datos</button>
                 <button onClick={() => setView('preview')} className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${view === 'preview' ? 'bg-blue-600 text-white shadow' : 'text-gray-400'}`}>Vista Previa</button>
              </div>
              <div className="hidden sm:flex gap-2">
                 <Button variant="ghost" onClick={clearAll} className="!text-xs h-8 text-gray-400 hover:text-red-400">
                    <Eraser /> <span className="ml-2">Limpiar</span>
                 </Button>
              </div>
            </header>
            <main className="flex-1 overflow-hidden relative flex flex-col sm:flex-row bg-[#0b0f19]">
              <div className={`flex-1 flex flex-col gap-4 p-4 overflow-y-auto no-scrollbar ${view === 'preview' ? 'hidden sm:flex' : 'flex'} sm:max-w-[420px] lg:max-w-[480px] border-r border-gray-800/50`}>
                <Card title="Datos Excel" icon={<TableIcon className="w-4 h-4 text-blue-400"/>}>
                  <textarea
                    value={excelInput}
                    onChange={(e) => setExcelInput(e.target.value)}
                    placeholder="Pega aquí las celdas de Excel..."
                    className="w-full h-24 bg-[#0d1117] border border-gray-700/50 rounded-lg p-3 text-xs font-mono text-gray-300 placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50 outline-none resize-none transition-all no-scrollbar"
                  />
                  <div className="mt-3">
                     <label className="text-xs font-semibold text-gray-500 uppercase mb-1 block">Código Actividad</label>
                     <input type="text" value={codigo} onChange={(e) => setCodigo(e.target.value)} placeholder="Ej: +esguev +(S)" className="w-full bg-[#0d1117] border border-gray-700/50 rounded-lg px-3 py-2 text-sm text-gray-200 focus:border-blue-500 outline-none placeholder-gray-700" />
                  </div>
                </Card>
                <Card title="Módulos Extra" icon={<Plus className="w-4 h-4 text-green-400"/>}>
                  <div className="space-y-3">
                     {['app', 'col'].map((type) => (
                       <div key={type} className="flex items-center justify-between p-2 rounded-lg bg-[#0d1117] border border-gray-800/50 hover:border-gray-700 transition-colors">
                          <div className="flex items-center gap-3">
                             <input type="checkbox" checked={modulos[type]} onChange={(e) => setModulos(m => ({...m, [type]: e.target.checked}))} className="w-4 h-4 rounded border-gray-600 bg-gray-800 text-blue-600 focus:ring-offset-0 focus:ring-0 cursor-pointer" />
                             <span className="text-sm font-medium text-gray-300 capitalize cursor-pointer" onClick={() => setModulos(m => ({...m, [type]: !modulos[type]}))}>
                                {type === 'app' ? 'Aplicación' : 'Colaboración'}
                             </span>
                          </div>
                          <div className="flex items-center gap-2">
                             <span className="text-xs text-gray-500 uppercase">Horas</span>
                             <input type="number" value={modulos[`${type}H`]} disabled={!modulos[type]} onChange={(e) => setModulos(m => ({...m, [`${type}H`]: Number(e.target.value)}))} className="w-12 bg-gray-900 border border-gray-700 rounded text-center text-sm py-1 disabled:opacity-30 outline-none focus:border-blue-500" />
                          </div>
                       </div>
                     ))}
                  </div>
                </Card>
                <div className="bg-[#161b22] border border-gray-800 rounded-xl shadow-xl flex flex-col shrink-0">
                   <div className="px-4 py-3 border-b border-gray-800/50 bg-[#1c2128] flex justify-between items-center shrink-0">
                      <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">Sesiones ({sessions.length})</h3>
                      <Button variant="secondary" onClick={addSession} className="!py-1 !px-2 !text-xs !h-7 bg-blue-600/10 text-blue-400 border-blue-900/30 hover:bg-blue-600 hover:text-white transition-all"><Plus className="w-3 h-3 mr-1" /> Añadir</Button>
                   </div>
                   <div className="p-3 space-y-2">
                      {sessions.map((session, index) => (
                         <div key={session.id} className="bg-[#0d1117] p-3 rounded-lg border border-gray-800/50 group animate-fade-in relative hover:border-gray-700 transition-colors">
                            <div className="flex items-center justify-between mb-2">
                               <span className="text-[10px] font-mono text-gray-500 bg-gray-800/50 px-1.5 rounded">Sesión {index + 1}</span>
                               <button onClick={() => removeSession(session.id)} disabled={sessions.length === 1} className="text-gray-600 hover:text-red-400 disabled:opacity-0 transition-colors p-1"><Trash /></button>
                            </div>
                            <div className="grid grid-cols-12 gap-2">
                               <div className="col-span-12 sm:col-span-6">
                                  <SmartDateInput value={session.date} onChange={(val) => updateSession(session.id, 'date', val)} />
                               </div>
                               <div className="col-span-6 sm:col-span-3">
                                  <select value={session.start} onChange={(e) => updateSession(session.id, 'start', e.target.value)} className="w-full bg-[#161b22] border border-gray-700 rounded px-1 py-1.5 text-sm text-center text-blue-300 outline-none focus:border-blue-500 appearance-none">
                                     {TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                                  </select>
                               </div>
                               <div className="col-span-6 sm:col-span-3">
                                  <select value={session.end} onChange={(e) => updateSession(session.id, 'end', e.target.value)} className="w-full bg-[#161b22] border border-gray-700 rounded px-1 py-1.5 text-sm text-center text-blue-300 outline-none focus:border-blue-500 appearance-none">
                                     {TIME_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                                  </select>
                               </div>
                            </div>
                         </div>
                      ))}
                   </div>
                </div>
                <div className="h-4 sm:h-0"></div>
              </div>
              <div className={`flex-1 flex flex-col h-full bg-[#0d1117] sm:border-l border-gray-800 relative ${view === 'input' ? 'hidden sm:flex' : 'flex'}`}>
                <div className="absolute top-4 right-4 z-30">
                   <Button variant="primary" onClick={copyToClipboard} className={`shadow-xl transition-all ${copyFeedback ? 'bg-green-600 hover:bg-green-600 ring-2 ring-green-500/50' : ''}`}>
                      {copyFeedback ? '¡Copiado!' : <><Copy className="mr-2"/> Copiar MD</>}
                   </Button>
                </div>
                <div className="flex-1 overflow-auto preview-scroll relative w-full h-full">
                   {output ? (
                      <div className="min-w-max p-4 sm:p-8 pb-20">
                        <pre className="font-mono text-xs sm:text-sm text-gray-300 whitespace-pre leading-relaxed select-text p-4 rounded-lg hover:bg-white/5 transition-colors cursor-text border border-transparent hover:border-gray-800/50">
                           {output}
                        </pre>
                      </div>
                   ) : (
                      <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-600 gap-4 opacity-50">
                         <TableIcon className="w-16 h-16 stroke-1"/>
                         <p className="text-sm">Pega datos para visualizar...</p>
                      </div>
                   )}
                </div>
              </div>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
