    <style>
        .no-select { user-select: none; -webkit-user-select: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .selection-overlay {
            position: absolute;
            border: 2px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.15);
            pointer-events: none;
            z-index: 5;
            transition: top 0.05s, height 0.05s, left 0.05s, width 0.05s;
            box-sizing: border-box;
        }

        .selection-handle {
            position: absolute;
            bottom: -5px; right: -5px; width: 12px; height: 12px;
            background-color: #3b82f6; border: 2px solid white; border-radius: 50%;
            z-index: 6; pointer-events: auto; touch-action: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        .selection-handle::after { content: ''; position: absolute; top: -15px; left: -15px; right: -15px; bottom: -15px; }

        .header-resizer-touch {
            position: absolute; right: -15px; top: 0; bottom: 0; width: 30px; z-index: 30; cursor: col-resize;
            touch-action: none;
        }

        .ignore-pointer-events { pointer-events: none !important; }
        .fade-in { animation: fadeIn 0.1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .toast-enter { animation: toastSlideUp 0.3s ease-out forwards; }
        @keyframes toastSlideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<body class="bg-slate-900 text-slate-200 overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        const ROW_HEIGHT = 36;
        const HEADER_HEIGHT = 36;
        const ROW_HEADER_WIDTH = 40;
        const MAX_HISTORY = 50;
        const MAX_AUTO_WIDTH = 400;
        const MIN_AUTO_WIDTH = 60; // Nuevo mínimo más compacto

        const Icon = ({ d, className }) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={d}/></svg>;

        const CSVLogo = () => (
            <svg viewBox="0 0 40 40" width="32" height="32" fill="none" className="shrink-0">
                <rect width="40" height="40" rx="8" fill="#2563EB" />
                <text x="50%" y="50%" dominantBaseline="central" textAnchor="middle" fill="white" fontFamily="system-ui, sans-serif" fontWeight="800" fontSize="16" letterSpacing="1">CSV</text>
            </svg>
        );

        const MarkdownIcon = ({className}) => (
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
               <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
               <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
               <path d="M8 8h8" />
               <path d="M8 12h8" />
            </svg>
        );

        const ICONS = {
            copy: "M8 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8",
            cut: "M6 3L18 21 M18 3L6 21 M8 12a2 2 0 1 1-4 0 M16 12a2 2 0 1 1 4 0",
            paste: "M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2",
            trash: "M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
            arrowLeft: "M19 12H5 M12 19l-7-7 7-7",
            arrowRight: "M5 12h14 M12 5l7 7-7 7",
            moveLeft: "M14 12H6 M9 15l-3-3 3-3 M20 12h-2",
            moveRight: "M10 12h8 M15 9l3 3-3 3 M4 12h2",
            sortAZ: "M15 10l-5 5-5-5 M15 14v-8 M4 6h10 M4 10h7 M4 14h4",
            sortZA: "M15 14l-5-5-5 5 M15 10v8 M4 18h10 M4 14h7 M4 10h4",
            filter: "M22 3H2l8 9.46V19l4 2v-8.54L22 3z",
            search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
            insertLeft: "M12 5v14 M5 12h14",
            insertUp: "M5 12h14 M12 5v14",
            moveUp: "M12 14V6 M9 9l3-3 3 3 M12 20v-2",
            moveDown: "M12 10v8 M9 15l3 3 3-3 M12 4v2",
            x: "M18 6L6 18M6 6l12 12",
            upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12",
            download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3",
            undo: "M3 7v6h6 M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13",
            redo: "M21 7v6h-6 M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7",
            sheet: "M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M8 13h2 M8 17h2",
            new: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 18v-6M9 15h6"
        };

        const getColLabel = (i) => {
            let label = '';
            let n = i;
            while (n >= 0) {
                label = String.fromCharCode(65 + (n % 26)) + label;
                n = Math.floor(n / 26) - 1;
            }
            return label;
        };

        const getTextWidth = (text, font = "14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif") => {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = font;
            const metrics = context.measureText(text || '');
            return metrics.width;
        };

        function App() {
            const [data, setData] = useState(Array.from({length: 3}, () => Array(3).fill('')));
            const [hasHeaders, setHasHeaders] = useState(false);
            const [colWidths, setColWidths] = useState([MIN_AUTO_WIDTH, MIN_AUTO_WIDTH, MIN_AUTO_WIDTH]);

            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);

            const [sel, setSel] = useState({ r1: 0, c1: 0, r2: 0, c2: 0 });
            const anchor = useRef({ r: 0, c: 0 });
            const focus = useRef({ r: 0, c: 0 });

            const [editing, setEditing] = useState(null);
            const [filters, setFilters] = useState({});

            const [handleMenu, setHandleMenu] = useState(null);
            const [headerMenu, setHeaderMenu] = useState(null);
            const [rowMenu, setRowMenu] = useState(null);
            const [toast, setToast] = useState(null);

            const lastPointerType = useRef(null);
            const containerRef = useRef(null);
            const autoScrollRaf = useRef(null);
            const longPressTimer = useRef(null);
            const fileInputRef = useRef(null);
            const toastTimeout = useRef(null);

            const showToast = (msg) => {
                setToast(msg);
                if(toastTimeout.current) clearTimeout(toastTimeout.current);
                toastTimeout.current = setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if (history.length === 0) {
                    setHistory([{ data: JSON.parse(JSON.stringify(data)), colWidths: [...colWidths], hasHeaders }]);
                    setHistoryIndex(0);
                }
            }, []);

            const updateState = (newData, newCols, newHeaders) => {
                const newHistory = history.slice(0, historyIndex + 1);
                const newState = {
                    data: newData || data,
                    colWidths: newCols || colWidths,
                    hasHeaders: newHeaders !== undefined ? newHeaders : hasHeaders
                };
                newHistory.push(JSON.parse(JSON.stringify(newState)));
                if (newHistory.length > MAX_HISTORY) newHistory.shift();
                setHistory(newHistory);
                setHistoryIndex(newHistory.length - 1);
                if (newData) setData(newData);
                if (newCols) setColWidths(newCols);
                if (newHeaders !== undefined) setHasHeaders(newHeaders);
            };

            const handleUndo = () => {
                if (historyIndex > 0) {
                    const prevIndex = historyIndex - 1;
                    const prevState = history[prevIndex];
                    setData(prevState.data); setColWidths(prevState.colWidths); setHasHeaders(prevState.hasHeaders);
                    setHistoryIndex(prevIndex); setEditing(null);
                }
            };

            const handleRedo = () => {
                if (historyIndex < history.length - 1) {
                    const nextIndex = historyIndex + 1;
                    const nextState = history[nextIndex];
                    setData(nextState.data); setColWidths(nextState.colWidths); setHasHeaders(nextState.hasHeaders);
                    setHistoryIndex(nextIndex); setEditing(null);
                }
            };

            const handleNewTable = () => {
                const newData = Array.from({length: 3}, () => Array(3).fill(''));
                const newCols = [MIN_AUTO_WIDTH, MIN_AUTO_WIDTH, MIN_AUTO_WIDTH];
                updateState(newData, newCols, false);
                setSel({ r1: 0, c1: 0, r2: 0, c2: 0 });
                setFilters({});
                showToast("Nueva tabla creada");
            };

            const visibleRows = useMemo(() => {
                return data.map((row, i) => ({ row, i }))
                    .filter(item => {
                        if (hasHeaders && item.i === 0) return false;
                        for (const [c, txt] of Object.entries(filters)) {
                            const val = item.row[c];
                            const strVal = (val === null || val === undefined) ? '' : String(val);
                            if (txt && !strVal.toLowerCase().includes(txt.toLowerCase())) return false;
                        }
                        return true;
                    });
            }, [data, hasHeaders, filters]);

            const handleExport = () => {
                const csv = data.map(r => r.join(',')).join('\n');
                const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url; link.download = 'export.csv'; link.click();
                showToast("Archivo exportado correctamente");
            };
            const handleImportClick = () => { if (fileInputRef.current) fileInputRef.current.click(); };

            const handleFileChange = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const rows = text.split(/\r\n|\n/).map(row => row.split(','));
                    if (rows.length) {
                        const maxCols = Math.max(...rows.map(r => r.length));

                        // --- Auto-resize IMPROVED (Min 60px) ---
                        const newWidths = new Array(maxCols).fill(MIN_AUTO_WIDTH);
                        const widthMap = {};
                        rows.forEach(row => {
                            row.forEach((val, cIdx) => {
                                // Reduced padding from 32 to 24 for tighter fit
                                const w = Math.ceil(getTextWidth(val)) + 24;
                                if (!widthMap[cIdx] || w > widthMap[cIdx]) widthMap[cIdx] = w;
                            });
                        });
                        for (let c = 0; c < maxCols; c++) {
                            if (widthMap[c]) {
                                // Clamp: Min 60px, Max 400px
                                newWidths[c] = Math.min(Math.max(MIN_AUTO_WIDTH, widthMap[c]), MAX_AUTO_WIDTH);
                            }
                        }

                        updateState(rows, newWidths);
                        setSel({ r1: 0, c1: 0, r2: 0, c2: 0 });
                        anchor.current = { r: 0, c: 0 };
                        focus.current = { r: 0, c: 0 };
                        showToast("Archivo importado correctamente");
                    }
                };
                reader.readAsText(file); e.target.value = '';
            };

            const execCopy = (text) => {
                const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
                try { document.execCommand('copy'); return true; } catch (err) { return false; } finally { document.body.removeChild(t); }
            };

            const handleCopyMarkdown = () => {
                const mdHeaders = data[0] || [];
                const rowsToExport = visibleRows.filter(item => item.i !== 0).map(item => item.row);
                const widths = mdHeaders.map((h, i) => {
                    let max = (String(h || '')).length;
                    rowsToExport.forEach(row => { const cell = String(row[i] || ''); if (cell.length > max) max = cell.length; });
                    return Math.max(3, max);
                });
                const pad = (str, w) => (String(str || '')).padEnd(w, ' ');
                let md = '';
                md += '| ' + mdHeaders.map((h, i) => pad(h, widths[i])).join(' | ') + ' |\n';
                md += '|-' + widths.map(w => '-'.repeat(w)).join('-|-') + '-|\n';
                rowsToExport.forEach(row => { md += '| ' + mdHeaders.map((_, i) => pad(row[i], widths[i])).join(' | ') + ' |\n'; });
                if (execCopy(md)) showToast("Tabla Markdown copiada"); else showToast("Error al copiar Markdown");

                    <div ref={containerRef} className="flex-1 overflow-auto relative touch-pan-x touch-pan-y" style={{overscrollBehavior:'none'}}>
                        <div className="selection-overlay" style={overlayStyle}><div className="selection-handle" onPointerDown={(e) => handlePointerDown(e, 'handle')}></div></div>
                        {handleMenu && ( <div className="fixed inset-0 z-[60]" onClick={() => setHandleMenu(null)}> <div className="fixed bg-slate-800 border border-slate-600 rounded-lg shadow-2xl z-[70] py-1 fade-in" style={{ left: handleMenu.x, top: handleMenu.y, minWidth: '140px' }} onPointerDown={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}> <button onClick={(e) => handleMenuAction2(e, 'copy')} className="w-full text-left px-4 py-3 hover:bg-slate-700 flex items-center gap-3 border-b border-slate-700 text-slate-200"><Icon d={ICONS.copy}/> Copiar</button> <button onClick={(e) => handleMenuAction2(e, 'cut')} className="w-full text-left px-4 py-3 hover:bg-slate-700 flex items-center gap-3 border-b border-slate-700 text-slate-200"><Icon d={ICONS.cut}/> Cortar</button> <button onClick={(e) => handleMenuAction2(e, 'paste')} className="w-full text-left px-4 py-3 hover:bg-slate-700 flex items-center gap-3 border-b border-slate-700 text-slate-200"><Icon d={ICONS.paste}/> Pegar</button> <button onClick={(e) => handleMenuAction2(e, 'clear')} className="w-full text-left px-4 py-3 hover:bg-slate-700 flex items-center gap-3 text-red-400"><Icon d={ICONS.trash}/> Borrar</button> </div> </div> )}
                        {headerMenu && ( <div className="fixed inset-0 z-[80]" onClick={() => setHeaderMenu(null)} onContextMenu={(e)=>e.preventDefault()}> <div className="fixed bg-slate-800 border border-slate-600 rounded-lg shadow-2xl z-[90] py-1 fade-in text-slate-200 text-xs flex flex-col" style={{ left: headerMenu.x, top: headerMenu.y, minWidth: '180px' }} onPointerDown={(e) => e.stopPropagation()} onMouseDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()} > <button onClick={() => insertCol(headerMenu.colIdx, 0)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.insertLeft} className="rotate-180"/> Insertar Izquierda</button> <button onClick={() => insertCol(headerMenu.colIdx, 1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.insertLeft}/> Insertar Derecha</button> <div className="h-px bg-slate-700 my-1 mx-2"></div> <button onClick={() => moveCol(headerMenu.colIdx, -1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.moveLeft}/> Mover Izquierda</button> <button onClick={() => moveCol(headerMenu.colIdx, 1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.moveRight}/> Mover Derecha</button> <div className="h-px bg-slate-700 my-1 mx-2"></div> <button onClick={() => deleteCol(headerMenu.colIdx)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start text-red-400"><Icon d={ICONS.trash}/> Eliminar</button> <div className="h-px bg-slate-700 my-1 mx-2"></div> <button onClick={() => sortCol(headerMenu.colIdx, true)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.sortAZ}/> Ordenar A-Z</button> <button onClick={() => sortCol(headerMenu.colIdx, false)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.sortZA}/> Ordenar Z-A</button> <div className="p-2 border-t border-slate-700 bg-slate-900/50 mt-1"> <div className="flex items-center gap-2 bg-slate-800 border border-slate-600 rounded px-2 py-1 relative"> <Icon d={ICONS.search} className="text-slate-500 shrink-0"/> <input type="text" placeholder="Filtrar..." className="bg-transparent border-none outline-none text-xs w-full text-slate-200 placeholder-slate-500 pr-5" value={filters[headerMenu.colIdx] || ''} onChange={(e) => setFilters(p => ({...p, [headerMenu.colIdx]: e.target.value}))} onKeyDown={(e) => { if(e.key === 'Enter') setHeaderMenu(null); }} /> {filters[headerMenu.colIdx] && <button onClick={() => setFilters(p => ({...p, [headerMenu.colIdx]: ''}))} className="absolute right-2 text-slate-500 hover:text-slate-300"><Icon d={ICONS.x} className="w-3 h-3"/></button>} </div> </div> </div> </div> )}
                        {rowMenu && ( <div className="fixed inset-0 z-[80]" onClick={() => setRowMenu(null)} onContextMenu={(e)=>e.preventDefault()}> <div className="fixed bg-slate-800 border border-slate-600 rounded-lg shadow-2xl z-[90] py-1 fade-in text-slate-200 text-xs flex flex-col" style={{ left: rowMenu.x, top: rowMenu.y, minWidth: '160px' }} onPointerDown={(e) => e.stopPropagation()} > <button onClick={() => insertRow(rowMenu.rowIdx, 0)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.insertUp}/> Insertar Arriba</button> <button onClick={() => insertRow(rowMenu.rowIdx, 1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.insertUp} className="rotate-180"/> Insertar Abajo</button> <div className="h-px bg-slate-700 my-1 mx-2"></div> <button onClick={() => moveRow(rowMenu.rowIdx, -1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.moveUp}/> Mover Arriba</button> <button onClick={() => moveRow(rowMenu.rowIdx, 1)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start"><Icon d={ICONS.moveDown}/> Mover Abajo</button> <div className="h-px bg-slate-700 my-1 mx-2"></div> <button onClick={() => deleteRow(rowMenu.rowIdx)} className="w-full px-4 py-2 hover:bg-slate-700 flex items-center gap-3 justify-start text-red-400"><Icon d={ICONS.trash}/> Eliminar</button> </div> </div> )}
                        {/* TABLE WIDTH FIX */}
                        <table className="border-collapse table-fixed" style={{ width: totalTableWidth }}>
                            <thead>
                                <tr style={{ height: HEADER_HEIGHT }}>
                                    <th className="sticky left-0 top-0 z-20 bg-slate-800 border-r border-b border-slate-600 cursor-pointer hover:bg-slate-700 active:bg-slate-600" style={{ width: ROW_HEADER_WIDTH, minWidth: ROW_HEADER_WIDTH }} onClick={selectAll}>
                                        <div className="w-full h-full flex items-center justify-center"><div className="w-0 h-0 border-l-[8px] border-t-[8px] border-l-transparent border-t-slate-500 rotate-45 translate-y-1"></div></div>
                                    </th>
                                    {colWidths.map((w, c) => {
                                        const isColSelected = sel.c1 <= c && sel.c2 >= c && sel.r1 === (hasHeaders?1:0) && sel.r2 === data.length - 1;
                                        return (
                                            <th key={c} className={`sticky top-0 z-10 border-r border-b border-slate-600 text-sm font-normal relative select-none transition-colors ${isColSelected ? 'bg-slate-700 text-white shadow-inner' : 'bg-slate-800 text-slate-400'} ${isColSelected ? 'th-selected' : ''}`} style={{ width: w }} onPointerDown={(e) => handleHeaderDown(e, c)} onContextMenu={(e) => { e.preventDefault(); triggerHeaderMenu(c, e.clientX, e.clientY); }}>
                                                <div className="w-full h-full flex items-center justify-center cursor-pointer">{(hasHeaders && data[0]) ? data[0][c] : getColLabel(c)}{filters[c] && <Icon d={ICONS.filter} className="ml-1 text-blue-500"/>}</div>
                                                <div className="header-resizer-touch" onPointerDown={(e) => { e.stopPropagation(); e.target.setPointerCapture(e.pointerId); const startX = e.clientX; const startW = w; const onMove = (ev) => { manageAutoScroll(ev.clientX, ev.clientY); handleHeaderResizeEnd(c, Math.max(40, startW + ev.clientX - startX)); }; const onUp = (ev) => { e.target.releasePointerCapture(ev.pointerId); e.target.removeEventListener('pointermove', onMove); e.target.removeEventListener('pointerup', onUp); if(autoScrollRaf.current) cancelAnimationFrame(autoScrollRaf.current); }; e.target.addEventListener('pointermove', onMove); e.target.addEventListener('pointerup', onUp); }}></div>
                                                <div className={`absolute right-0 top-0 bottom-0 w-[2px] cursor-col-resize pointer-events-none transition-opacity duration-200 ${isColSelected ? 'bg-blue-500 opacity-100' : 'bg-transparent opacity-0 hover:opacity-100'}`}></div>
                                            </th>
                                        )
                                    })}
                                </tr>
                            </thead>
                            <tbody>
                                {visibleRows.map(({ row, i: r }) => (
                                    <tr key={r} style={{ height: ROW_HEIGHT }}>
                                        <td className="sticky left-0 z-10 bg-slate-800 border-r border-b border-slate-600 text-center text-xs text-slate-500 cursor-pointer hover:bg-slate-700 transition-colors" style={{ width: ROW_HEADER_WIDTH, minWidth: ROW_HEADER_WIDTH }} onPointerDown={(e) => handleRowDown(e, r)} onContextMenu={(e) => { e.preventDefault(); triggerRowMenu(r, e.clientX, e.clientY); }}>{r + 1}</td>
                                        {row.map((cell, c) => {
                                            const isEdit = editing && editing.r === r && editing.c === c;
                                            return (
                                                <td key={c} data-r={r} data-c={c} className="border-r border-b border-slate-700 px-2 text-slate-300 relative" onPointerDown={(e) => handlePointerDown(e, 'cell', r, c)} onClick={() => handleCellClick(r, c)} onContextMenu={(e) => handleCellContextMenu(e, r, c)}>
                                                    {isEdit ? (<input autoFocus className="absolute inset-0 w-full h-full bg-slate-700 text-white px-2 outline-none border-2 border-blue-500 z-50" value={editing.val} onChange={e => setEditing({...editing, val: e.target.value})} onBlur={saveEdit} onKeyDown={e => { /* handled by global */ }} />) : (<div className="truncate w-full h-full flex items-center pointer-events-none">{cell}</div>)}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="h-48"></div>
                    </div>

                    {toast && (
                        <div className="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg border border-slate-600 z-[100] flex items-center gap-2 text-sm font-medium toast-enter">
                            <span>{toast}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
