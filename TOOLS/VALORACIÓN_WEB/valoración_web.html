<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoración Web - REFORACEN</title>
    <style>
        /* =========================================
           DISEÑO UI/UX "SINGLE BODY" (Midnight Theme)
           ========================================= */
        :root {
            --bg-body: #0d1117;       /* Fondo principal */
            --bg-card: #161b22;       /* Fondo de tarjetas */
            --border: #30363d;        /* Color de bordes */
            --primary: #238636;       /* Verde Éxito */
            --primary-hover: #2ea043;
            --accent: #234ED4;        /* Azul Corporativo */
            --text-main: #e6edf3;     /* Texto blanco */
            --text-muted: #8b949e;    /* Texto gris */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CABECERA (HEADER) --- */
        header {
            height: 70px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 250px 1fr 250px; /* Izq | Centro | Der */
            align-items: center;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Zona Izquierda: Logo y Título */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-text {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        /* Zona Central: Botón de Acción Principal */
        .header-center {
            display: flex;
            justify-content: center;
        }
        
        #btnProcesar {
            background-color: var(--primary);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
            pointer-events: none; /* Desactivado por defecto */
        }
        #btnProcesar.ready {
            opacity: 1;
            pointer-events: all;
            box-shadow: 0 0 15px rgba(46, 160, 67, 0.4);
        }
        #btnProcesar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Zona Derecha: Herramientas */
        .header-tools {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-tool {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-tool:hover {
            background-color: rgba(255,255,255,0.05);
            color: #fff;
            border-color: #8b949e;
        }
        .btn-tool svg {
            width: 14px;
            height: 14px;
        }

        /* --- CUERPO PRINCIPAL (SINGLE BODY) --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            gap: 20px;
        }

        /* Dropzone (Zona de carga) */
        .dropzone {
            width: 100%;
            border: 2px dashed var(--border);
            border-radius: 12px;
            background-color: rgba(22, 27, 34, 0.5);
            padding: 40px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .dropzone:hover {
            border-color: #58a6ff;
            background-color: rgba(31, 111, 235, 0.05);
        }
        .dropzone.active {
            border-color: var(--accent);
            background-color: rgba(35, 78, 212, 0.1);
            transform: scale(0.99);
        }
        
        .dropzone h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #fff;
        }
        .dropzone p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .dropzone-icon {
            color: var(--text-muted);
            margin-bottom: 15px;
            opacity: 0.7;
        }

        /* Info Archivo Cargado */
        #fileInfo {
            display: none; /* Oculto inicialmente */
            background-color: rgba(35, 134, 54, 0.1);
            border: 1px solid rgba(35, 134, 54, 0.3);
            color: #7ee787;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        /* Área de Resultados */
        #outputArea {
            width: 100%;
            flex: 1;
            min-height: 200px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e6edf3;
            white-space: pre;
            overflow: auto;
            outline: none;
            display: none; /* Oculto hasta generar */
        }
        
        /* Mensajes de Estado */
        #statusMessage {
            display: none;
            padding: 12px;
            border-radius: 6px;
            background: rgba(218, 54, 51, 0.1);
            border: 1px solid rgba(218, 54, 51, 0.3);
            color: #f85149;
            font-size: 14px;
            width: 100%;
            text-align: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                height: auto;
                padding: 15px;
                gap: 15px;
            }
            .header-center { order: 3; width: 100%; }
            #btnProcesar { width: 100%; justify-content: center; }
            .header-tools { justify-content: space-between; width: 100%; }
            .dropzone { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <!-- IZQUIERDA: ICONO + TÍTULO -->
        <div class="brand">
            <!-- SVG Icono Personalizado -->
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#234ED4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#343485;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <!-- Fondo Cuadrado Redondeado -->
                <rect width="40" height="40" rx="10" fill="url(#grad1)" />
                <!-- Globo Terráqueo Simplificado (Líneas finas fondo) -->
                <circle cx="20" cy="20" r="12" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
                <path d="M20 8C20 8 26 12 26 20C26 28 20 32 20 32" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
                <path d="M20 8C20 8 14 12 14 20C14 28 20 32 20 32" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
                <line x1="8" y1="20" x2="32" y2="20" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
                <!-- Gran Check Blanco -->
                <path d="M12 20L17 25L28 14" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            
            <span class="brand-text">Valoración Web</span>
        </div>

        <!-- CENTRO: BOTÓN DE ACCIÓN -->
        <div class="header-center">
            <button id="btnProcesar" onclick="procesarPDF()">
                <span>Generar Informe</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- DERECHA: HERRAMIENTAS -->
        <div class="header-tools">
            <button class="btn-tool" onclick="copiar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copiar
            </button>
            <button class="btn-tool" onclick="limpiar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Limpiar
            </button>
        </div>
    </header>

    <main>
        <!-- INPUT DE ARCHIVO (Oculto) -->
        <input type="file" id="fileInput" accept="application/pdf" hidden onchange="handleFileSelect(this)">

        <!-- ZONA DRAG & DROP -->
        <div id="dropzone" class="dropzone" 
             onclick="document.getElementById('fileInput').click()" 
             ondragover="handleDragOver(event)" 
             ondragleave="handleDragLeave(event)" 
             ondrop="handleDrop(event)">
            
            <div class="dropzone-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <h3>Arrastra o sube la memoria</h3>
            <p>Selecciona el archivo PDF de la actividad descargada desde <strong>REFORACEN</strong></p>
        </div>

        <!-- INDICADOR DE ARCHIVO (Aparece al cargar) -->
        <div id="fileInfo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span id="fileName">archivo.pdf</span>
        </div>
        
        <!-- MENSAJES DE ERROR -->
        <div id="statusMessage"></div>

        <!-- RESULTADO -->
        <div id="outputArea" contenteditable="true" spellcheck="false"></div>
    </main>

    <!-- CARGA DE LIBRERÍAS LOCALES -->
    <script src="pdf.min.js"></script>

    <script>
        // CONFIGURACIÓN DEL WORKER
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
        }

        // --- LÓGICA DE INTERFAZ ---
        let currentFile = null;

        function handleDragOver(e) {
            e.preventDefault(); e.stopPropagation();
            document.getElementById('dropzone').classList.add('active');
        }

        function handleDragLeave(e) {
            e.preventDefault(); e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
        }

        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
            if (e.dataTransfer.files.length) validar(e.dataTransfer.files[0]);
        }

        function handleFileSelect(input) {
            if (input.files.length) validar(input.files[0]);
        }

        function validar(file) {
            const status = document.getElementById('statusMessage');
            status.style.display = 'none';

            if (file.type !== 'application/pdf') {
                status.innerText = "Error: El archivo debe ser un PDF válido.";
                status.style.display = 'block';
                return;
            }

            currentFile = file;
            
            // Actualizar UI
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileInfo').style.display = 'flex';
            document.getElementById('btnProcesar').classList.add('ready');
            
            // Ocultar Dropzone para limpiar la vista
            document.getElementById('dropzone').style.display = 'none';
        }

        function limpiar() {
            currentFile = null;
            document.getElementById('fileInput').value = "";
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('dropzone').style.display = 'flex';
            document.getElementById('outputArea').innerText = "";
            document.getElementById('outputArea').style.display = 'none';
            document.getElementById('btnProcesar').classList.remove('ready');
            document.getElementById('btnProcesar').innerHTML = `<span>Generar Informe</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
            document.getElementById('statusMessage').style.display = 'none';
        }

        function copiar() {
            const texto = document.getElementById('outputArea').innerText;
            if (texto) {
                navigator.clipboard.writeText(texto).then(() => {
                    // Feedback visual sutil en el botón
                    const btn = document.querySelector('.btn-tool'); // El primero es copiar
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<span>Copiado!</span>`;
                    setTimeout(() => btn.innerHTML = originalHTML, 1500);
                });
            }
        }

        // --- PROCESAMIENTO PDF ---
        const preguntas = [
            "Nota global de la actividad", "Adecuación de Instalaciones y espacios", "Adecuación de equipamiento y materiales",
            "Interés de los contenidos", "Utilidad para su aplicación al aula/trabajo", "Adecuación metodológica innovación",
            "Distribución de tiempos", "Organización gestión de la actividad", "Organización - gestión de la actividad",
            "Clima ambiente de realización", "Valoración global de los formadores", "Grado de cumplimiento de las expectativas",
            "Grado de aprovechamiento individual", "Desarrollo de competencias profesionales", "Compromiso de aplicación al aula/trabajo",
            "Satisfacción con la formación realizada"
        ];

        async function procesarPDF() {
            if (!currentFile) return;

            if (typeof pdfjsLib === 'undefined') {
                alert("Error: No se encuentra pdf.min.js en la carpeta.");
                return;
            }

            const btn = document.getElementById('btnProcesar');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span>Analizando...</span>`;
            
            try {
                const buffer = await currentFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
                
                let texto = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    texto += content.items.map(s => s.str).join(" ") + "\n\n";
                }

                const datos = parsear(texto);
                
                if (datos.items.length === 0) {
                    alert("No se encontraron datos de valoración en el apartado 5.4.");
                } else {
                    generarInforme(datos);
                }
            } catch (e) {
                console.error(e);
                alert("Error al leer el PDF: " + e.message);
            } finally {
                btn.innerHTML = originalHTML;
            }
        }

        function parsear(txt) {
            const clean = txt.replace(/\s+/g, ' ');
            const match = clean.match(/5\.4\.?-?\s*Valoración/i);
            if (!match) return { items: [], obs: "Sección 5.4 no encontrada." };

            const section = clean.substring(match.index);
            const items = [];
            const found = new Set();

            preguntas.forEach(p => {
                const regex = new RegExp(`${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')}.{0,50}?(\\d+[,.]\\d{2})`, 'i');
                const m = section.match(regex);
                if (m) {
                    const val = parseFloat(m[1].replace(',', '.'));
                    const name = p.replace(' - ', ' ').replace('  ', ' ');
                    if (!found.has(name)) { items.push({ p, val }); found.add(name); }
                }
            });

            let obs = "(No se han registrado observaciones)";
            const obsM = section.match(/Observaciones:/i);
            if (obsM) {
                let raw = section.substring(obsM.index + obsM[0].length);
                const end = raw.match(/(6\.-|Código:|Página \d|Junta de Castilla)/i);
                if (end) raw = raw.substring(0, end.index);
                const trim = raw.trim();
                if (trim.length > 3 && trim.toUpperCase() !== 'BOR') obs = trim;
            }
            return { items, obs };
        }

        function generarInforme(datos) {
            const sorted = datos.items.sort((a, b) => b.val - a.val);
            const max = Math.max(...sorted.map(d => d.val));
            const min = Math.min(...sorted.map(d => d.val));
            let graf = "";

            sorted.forEach(i => {
                let label = i.p.length > 44 ? i.p.substring(0, 44) : i.p;
                const char = i.val === max ? "█" : (i.val === min ? "░" : "▒");
                graf += `${label.padEnd(45, " ")} | ${char.repeat(Math.round(i.val * 2.25))} ${i.val.toFixed(2)}\n`;
            });

            const final = `## 🔴🔒✔️ VALORACIÓN WEB\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n${graf}\n\n## 🔴🔒⚠️ OBSERVACIONES VALORACIÓN\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n${datos.obs}`;
            
            const output = document.getElementById('outputArea');
            output.innerText = final;
            output.style.display = 'block';
        }
    </script>
</body>
</html>
