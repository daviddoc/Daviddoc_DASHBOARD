<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Certificación Markdown Pro</title>
    <!-- Favicon dinámico -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2392278F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%224%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><line x1=%2216%22 y1=%222%22 x2=%2216%22 y2=%226%22/><line x1=%228%22 y1=%222%22 x2=%228%22 y2=%226%22/><line x1=%223%22 y1=%2210%22 x2=%2221%22 y2=%2210%22/><path d=%22M9 16l2 2 4-4%22/></svg>'>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #161b22;
            --bg-input: #0d1117;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #2f81f7;
            --accent-hover: #58a6ff;
            --danger: #f85149;
            --success: #238636;
            --nav-height: 60px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Layout */
        header {
            height: 56px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            flex-shrink: 0;
            z-index: 50;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        /* --- DESKTOP LAYOUT --- */
        .panel-left {
            width: 450px;
            min-width: 450px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            z-index: 20;
            background-color: var(--bg-dark);
        }

        .panel-right {
            flex: 1;
            min-width: 0;
            background-color: var(--bg-input);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Mobile Nav */
        .mobile-nav {
            display: none;
            height: var(--nav-height);
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
        }
        
        .nav-item.active {
            color: var(--accent);
            background-color: rgba(47, 129, 247, 0.05);
        }
        .nav-item svg { margin-bottom: 4px; }

        /* Components */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            overflow: visible; 
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .card-header {
            padding: 0.75rem 1rem;
            background-color: #1c2128;
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Inputs */
        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--text-main);
            font-family: monospace;
            font-size: 0.8rem;
            resize: none;
            outline: none;
        }
        textarea:focus, input:focus, select:focus { border-color: var(--accent); }

        input[type="text"], input[type="number"], select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.875rem;
            width: 100%;
        }
        
        .full-width { width: 100%; }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 0.5rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: rgba(56, 139, 253, 0.1); color: var(--accent-hover); border: 1px solid rgba(56, 139, 253, 0.3); }
        .btn-secondary:hover { background-color: var(--accent); color: white; }
        .btn-ghost { color: var(--text-muted); background: transparent; }
        .btn-ghost:hover { color: #f0f6fc; background: rgba(177, 186, 196, 0.12); }

        /* Action Buttons (Icon only) */
        .btn-icon { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px; /* Tamaño fijo */
            height: 28px; /* Tamaño fijo */
            border-radius: 4px; 
            cursor: pointer; 
            color: var(--text-muted); 
            background: transparent; 
            border: 1px solid transparent; 
            padding: 0;
            flex-shrink: 0; /* IMPEDIR que se encojan */
        }
        .btn-icon svg { 
            width: 16px; 
            height: 16px; 
            display: block; 
            min-width: 16px; /* Asegurar visibilidad */
        }
        .btn-icon:hover { color: var(--text-main); background: rgba(177, 186, 196, 0.12); border-color: var(--border); }
        .btn-icon.delete:hover { color: var(--danger); background: rgba(248, 81, 73, 0.1); border-color: rgba(248, 81, 73, 0.2); }
        .btn-icon.add:hover { color: var(--success); background: rgba(35, 134, 54, 0.1); border-color: rgba(35, 134, 54, 0.2); }

        /* Session Item */
        .session-item {
            background-color: var(--bg-input);
            border: 1px solid rgba(48, 54, 61, 0.5);
            border-radius: 0.5rem;
            padding: 0.6rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: border-color 0.2s;
        }
        .session-item:focus-within { border-color: var(--accent); }
        
        .session-inputs {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr;
            gap: 0.5rem;
            flex: 1;
            min-width: 0; /* Prevents grid blowout */
        }

        .session-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0; /* Important: prevents shrinking */
            width: 40px;    /* FIX: Ancho fijo más generoso */
            min-width: 40px; /* FIX: Asegurar que nunca sea menos de 40px */
            border-left: 1px solid transparent; /* Espaciador visual */
        }

        /* Input Wrappers */
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .input-wrapper input[type="text"] {
            padding-right: 2.4rem; /* FIX: Más espacio para el botón */
            width: 100%;
        }

        /* Trigger Button */
        .trigger-btn {
            position: absolute;
            right: 0.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 0.3rem;
            z-index: 20; 
            transition: background 0.1s, color 0.1s;
            overflow: hidden; /* Importante para contener el input */
        }
        .trigger-btn:hover {
            background-color: rgba(177, 186, 196, 0.12);
            color: var(--text-main);
        }
        
        /* FIX DEFINITIVO CALENDARIO: Estilo específico para el picker interno */
        .date-trigger-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 50;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        /* Este es el truco para Chrome/Edge/Webkit */
        .date-trigger-input::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            cursor: pointer;
            opacity: 0; /* Hacemos transparente el icono nativo pero clickable */
        }

        /* Dropdowns */
        .time-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            background-color: #1c2128;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .time-dropdown.show { display: block; }
        .time-option {
            padding: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-main);
        }
        .time-option:hover { background-color: var(--accent); color: white; }
        
        /* Checkbox Row */
        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-input);
            border: 1px solid rgba(48, 54, 61, 0.5);
            padding: 0.5rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .preview-container {
            flex: 1;
            padding: 2rem;
            overflow: auto;
            position: relative;
        }
        #output-pre {
            font-family: 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-main);
            white-space: pre;
            background: transparent;
            border: none;
            margin: 0;
        }
        
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            color: var(--text-muted);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        @media (max-width: 768px) {
            .mobile-nav { display: flex; }
            main { flex-direction: column; width: 100%; }
            .panel-left, .panel-right { width: 100% !important; min-width: 100% !important; border: none; flex: 1; display: flex; }
            .mobile-hidden { display: none !important; }
            .preview-container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="background: rgba(47, 129, 247, 0.15); padding: 4px; border-radius: 6px; border: 1px solid rgba(47, 129, 247, 0.4);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                    <path d="M9 16l2 2 4-4"/>
                </svg>
            </div>
            <h1 style="font-size: 1rem; font-weight: 700; color: #f0f6fc; margin: 0;">
                Certificación <span style="color: var(--accent-hover)">Pro</span>
            </h1>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <button id="btn-copy" class="btn btn-primary" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                Copiar MD
            </button>
            <button id="btn-clear" class="btn btn-ghost">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 12.5 5 5 2.5-2.5 3.5 3.5 6-6-2.5-2.5-3.5 3.5-5-5-6 6Z"/></svg>
                Limpiar
            </button>
        </div>
    </header>

    <main id="main-container">
        <!-- Panel Izquierdo: Controles -->
        <div id="panel-left" class="panel-left">
            
            <!-- Excel Input -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
                        Datos Excel
                    </div>
                </div>
                <div class="card-body">
                    <textarea id="excel-input" placeholder="Pega aquí las celdas de Excel..."></textarea>
                    <div style="margin-top: 0.75rem;">
                        <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; display: block;">Código Actividad</label>
                        <input type="text" id="code-input" placeholder="Ej: +esguev +(S)" class="full-width">
                    </div>
                </div>
            </div>

            <!-- Modulos -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ea043" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        Módulos Extra
                    </div>
                </div>
                <div class="card-body">
                    <!-- App -->
                    <div class="checkbox-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-app"> Aplicación
                        </label>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span style="font-size: 0.75rem; color: var(--text-muted);">HORAS</span>
                            <input type="number" id="val-app" value="2" disabled style="width: 50px; text-align: center;">
                        </div>
                    </div>
                    <!-- Col -->
                    <div class="checkbox-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-col"> Colaboración
                        </label>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span style="font-size: 0.75rem; color: var(--text-muted);">HORAS</span>
                            <input type="number" id="val-col" value="2" disabled style="width: 50px; text-align: center;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sesiones -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Sesiones (<span id="session-count">1</span>)</div>
                </div>
                <div class="card-body" id="sessions-container" style="display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem;">
                    <!-- Sessions injected by JS -->
                </div>
            </div>
            
            <div style="height: 20px;"></div>
        </div>

        <!-- Panel Derecho: Vista Previa -->
        <div id="panel-right" class="panel-right mobile-hidden">
            <div class="preview-container">
                <div id="empty-state" class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
                    <p>Pega datos o rellena sesiones...</p>
                </div>
                <pre id="output-pre" style="display: none;"></pre>
            </div>
        </div>
    </main>
    
    <nav class="mobile-nav">
        <button class="nav-item active" id="nav-data">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>DATOS Y SESIONES</span>
        </button>
        <button class="nav-item" id="nav-result">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>RESULTADO</span>
        </button>
    </nav>

    <script>
        // --- CONSTANTS & HELPERS ---
        const CHAR_OVERLINE = '\u203E';
        const CHAR_BLOCK = '\u2588';
        const BLOCK_COUNT = 6;
        const BLOCK_STRING = CHAR_BLOCK.repeat(BLOCK_COUNT);
        const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

        const generateTimeOptions = () => {
            const times = [];
            for (let h = 8; h <= 22; h++) {
                const hh = h.toString().padStart(2, '0');
                times.push(`${hh}:00`, `${hh}:30`);
            }
            return times;
        };
        const TIME_OPTIONS = generateTimeOptions();

        // --- STATE MANAGEMENT ---
        let state = {
            excelInput: '',
            codigo: '',
            modulos: { app: false, appH: 2, col: false, colH: 2 },
            sessions: [] // { id, date, start, end }
        };

        // --- DATE UTILS ---
        const getInitialDate = () => {
            const d = new Date();
            return formatForInput(d);
        };

        const formatForInput = (dObj) => {
            return `${dObj.getDate()} ${MESES_CORTOS[dObj.getMonth()]} ${dObj.getFullYear().toString().slice(-2)}`;
        };

        const parseDateParts = (inputStr) => {
            if (!inputStr) return null;
            const clean = inputStr.trim().toLowerCase().replace(/\./g, '/').replace(/-/g, '/'); // Normalize . and - to /
            
            // Format ddmmyy or ddmmyyyy
            if (/^\d{6,8}$/.test(clean)) {
                const d = parseInt(clean.slice(0, 2));
                const m = parseInt(clean.slice(2, 4)) - 1;
                let yStr = clean.slice(4);
                const y = yStr.length === 2 ? '20' + yStr : yStr;
                return { d, m, y };
            }

            // Format dd/mm/yy
            if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(clean)) {
                const [d, m, y] = clean.split('/');
                const fullY = y.length === 2 ? '20'+y : y;
                return { d: parseInt(d), m: parseInt(m)-1, y: fullY };
            }

            // Format dd mmm yy
            const textMatch = clean.match(/^(\d{1,2})\s+([a-z]{3})\s+(\d{2,4})$/);
            if (textMatch) {
                const mIdx = MESES_CORTOS.indexOf(textMatch[2]);
                if (mIdx !== -1) {
                    const yStr = textMatch[3];
                    const fullY = yStr.length === 2 ? '20'+yStr : yStr;
                    return { d: parseInt(textMatch[1]), m: mIdx, y: fullY };
                }
            }
            return null;
        };

        // Date input helper wrapper
        const parseAndFormatDate = (val) => {
            const parts = parseDateParts(val);
            if (parts) {
                const dObj = new Date(parseInt(parts.y), parts.m, parts.d);
                return formatForInput(dObj);
            }
            return val;
        };

        const formatDateForHeader = (inputStr) => {
            const p = parseDateParts(inputStr);
            if (!p) return inputStr;
            const day = p.d.toString().padStart(2, '0');
            const month = MESES_CORTOS[p.m];
            return `${day} ${month}`;
        };

        const formatDateForTemporalizacion = (inputStr) => {
            const p = parseDateParts(inputStr);
            if (!p) return inputStr;
            const day = p.d.toString().padStart(2, '0');
            const month = (p.m + 1).toString().padStart(2, '0');
            return `${p.y}/${month}/${day}`;
        };

        // --- TIME UTILS ---
        const parseTimeInput = (val) => {
            if (!val) return val;
            const v = val.trim().replace(':', '');
            // 1315 -> 13:15
            if (/^\d{4}$/.test(v)) return `${v.slice(0,2)}:${v.slice(2)}`;
            // 13 -> 13:00, 9 -> 09:00
            if (/^\d{1,2}$/.test(v)) return `${v.padStart(2, '0')}:00`;
            // 1 -> 01:00 (covered above)
            // 930 -> 09:30
            if (/^\d{3}$/.test(v)) return `0${v.slice(0,1)}:${v.slice(1)}`;
            return val;
        }

        const calculateDurationMinutes = (start, end) => {
            if(!start || !end) return 0;
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            if (isNaN(sh) || isNaN(eh)) return 0;
            let diff = (eh * 60 + em) - (sh * 60 + sm);
            if (diff < 0) diff += 24 * 60;
            return diff;
        };

        const minutesToHmm = (m) => {
            const h = Math.floor(m / 60);
            const mins = Math.round(m % 60);
            return `${h}:${mins.toString().padStart(2, '0')}`;
        };

        const formatHorasDisplay = (hm) => {
            const [h, m] = hm.split(':');
            return m === '00' ? `${parseInt(h)} h` : `${parseInt(h)}:${m} h`;
        };

        const padRight = (str, len) => {
            const s = str || '';
            return s + ' '.repeat(Math.max(0, len - s.length));
        };

        // --- DOM MANIPULATION & RENDER LOGIC ---

        function init() {
            // Initial State
            state.sessions.push({ id: Date.now(), date: getInitialDate(), start: '16:00', end: '19:00' });
            
            // Listeners
            document.getElementById('excel-input').addEventListener('input', (e) => { state.excelInput = e.target.value; generate(); });
            document.getElementById('code-input').addEventListener('input', (e) => { state.codigo = e.target.value; generate(); });
            
            // Modules
            const chkApp = document.getElementById('chk-app');
            const valApp = document.getElementById('val-app');
            chkApp.addEventListener('change', (e) => { 
                state.modulos.app = e.target.checked; 
                valApp.disabled = !e.target.checked; 
                generate(); 
            });
            valApp.addEventListener('input', (e) => { state.modulos.appH = Number(e.target.value); generate(); });

            const chkCol = document.getElementById('chk-col');
            const valCol = document.getElementById('val-col');
            chkCol.addEventListener('change', (e) => { 
                state.modulos.col = e.target.checked; 
                valCol.disabled = !e.target.checked; 
                generate(); 
            });
            valCol.addEventListener('input', (e) => { state.modulos.colH = Number(e.target.value); generate(); });

            // Buttons
            document.getElementById('btn-clear').addEventListener('click', clearAll);
            document.getElementById('btn-copy').addEventListener('click', copyToClipboard);

            // Close dropdowns on outside click
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.input-wrapper')) {
                    document.querySelectorAll('.time-dropdown').forEach(el => el.classList.remove('show'));
                }
            });

            // Mobile Nav
            const navData = document.getElementById('nav-data');
            const navResult = document.getElementById('nav-result');
            const panelLeft = document.getElementById('panel-left');
            const panelRight = document.getElementById('panel-right');

            navData.addEventListener('click', () => {
                navData.classList.add('active');
                navResult.classList.remove('active');
                panelLeft.classList.remove('mobile-hidden');
                panelRight.classList.add('mobile-hidden');
            });

            navResult.addEventListener('click', () => {
                navResult.classList.add('active');
                navData.classList.remove('active');
                panelRight.classList.remove('mobile-hidden');
                panelLeft.classList.add('mobile-hidden');
            });

            renderSessions();
            generate();
        }

        function addSession(afterId = null) {
            const newId = Date.now() + Math.random(); 
            let newSession;
            
            if (afterId) {
                const idx = state.sessions.findIndex(s => s.id === afterId);
                const prev = state.sessions[idx];
                newSession = {
                    id: newId,
                    date: prev.date,
                    start: prev.start,
                    end: prev.end
                };
                state.sessions.splice(idx + 1, 0, newSession);
            } else {
                const last = state.sessions[state.sessions.length - 1];
                newSession = {
                    id: newId,
                    date: last ? last.date : getInitialDate(),
                    start: last ? last.start : '16:00',
                    end: last ? last.end : '19:00'
                };
                state.sessions.push(newSession);
            }
            
            renderSessions();
            generate();
            
            setTimeout(() => {
                const newRow = document.querySelector(`[data-id="${newId}"]`);
                if (newRow) {
                    const firstInput = newRow.querySelector('input');
                    if (firstInput) {
                        firstInput.focus();
                        firstInput.select();
                    }
                }
            }, 0);
        }

        function removeSession(id) {
            if (state.sessions.length > 1) {
                state.sessions = state.sessions.filter(s => s.id !== id);
            }
            renderSessions();
            generate();
        }

        function updateSession(id, field, value) {
            const s = state.sessions.find(x => x.id === id);
            if (s) {
                if (field === 'date') {
                    s.date = parseAndFormatDate(value);
                } else if (field === 'start' || field === 'end') {
                    s.start = parseTimeInput(s.start);
                    s.end = parseTimeInput(s.end);
                    s[field] = parseTimeInput(value);
                } else {
                    s[field] = value;
                }
                generate();
            }
        }

        function clearAll() {
            state.excelInput = '';
            state.codigo = '';
            state.modulos = { app: false, appH: 2, col: false, colH: 2 };
            state.sessions = [{ id: Date.now(), date: getInitialDate(), start: '16:00', end: '19:00' }];
            
            // Reset DOM
            document.getElementById('excel-input').value = '';
            document.getElementById('code-input').value = '';
            document.getElementById('chk-app').checked = false;
            document.getElementById('val-app').value = 2; document.getElementById('val-app').disabled = true;
            document.getElementById('chk-col').checked = false;
            document.getElementById('val-col').value = 2; document.getElementById('val-col').disabled = true;
            
            renderSessions();
            generate();
        }

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            container.innerHTML = '';
            document.getElementById('session-count').innerText = state.sessions.length;

            state.sessions.forEach((sess, idx) => {
                const el = document.createElement('div');
                el.className = 'session-item';
                el.dataset.id = sess.id;
                
                const isLastSession = idx === state.sessions.length - 1;

                // --- HTML Construction ---
                // FIX: Calendar Trigger now matches Time Trigger structure (Button wrapper)
                const dateHtml = `
                    <div class="input-wrapper">
                        <input type="text" class="sess-date" value="${sess.date}" placeholder="Fecha">
                        <div class="trigger-btn">
                            <input type="date" class="date-trigger-input" tabindex="-1">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        </div>
                    </div>`;

                const createTimeHtml = (field, val, isLastField) => `
                    <div class="input-wrapper">
                        <input type="text" class="sess-${field} ${isLastField && isLastSession ? 'last-input' : ''}" value="${val}" placeholder="00:00">
                        <div class="trigger-btn time-trigger" tabindex="-1">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <div class="time-dropdown no-scrollbar">
                            ${TIME_OPTIONS.map(t => `<div class="time-option" data-val="${t}">${t}</div>`).join('')}
                        </div>
                    </div>`;

                // Botón de eliminar CONDICIONAL
                const actionsHtml = `
                    <div class="session-actions">
                        <button class="btn-icon add" title="Insertar debajo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                        ${state.sessions.length > 1 ? `<button class="btn-icon delete" title="Eliminar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>` : ''}
                    </div>
                `;

                el.innerHTML = `
                    <div class="session-inputs">
                        ${dateHtml}
                        ${createTimeHtml('start', sess.start, false)}
                        ${createTimeHtml('end', sess.end, true)}
                    </div>
                    ${actionsHtml}
                `;

                // --- Event Listeners Attachment ---
                
                // 1. Date Logic
                const dateInput = el.querySelector('.sess-date');
                const dateTrigger = el.querySelector('.date-trigger-input');
                
                dateInput.onfocus = function() { this.select(); };
                dateInput.onchange = (e) => updateSession(sess.id, 'date', e.target.value);
                dateInput.onblur = (e) => { 
                    const formatted = parseAndFormatDate(e.target.value);
                    if(formatted !== e.target.value) {
                        e.target.value = formatted;
                        updateSession(sess.id, 'date', formatted);
                    }
                };

                dateTrigger.onchange = (e) => {
                    if (!e.target.value) return;
                    const [y, m, d] = e.target.value.split('-');
                    const dateObj = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
                    const fmt = formatForInput(dateObj);
                    dateInput.value = fmt;
                    updateSession(sess.id, 'date', fmt);
                };

                // 2. Time Logic
                ['start', 'end'].forEach(field => {
                    const wrapper = el.querySelector(`.sess-${field}`).closest('.input-wrapper');
                    const input = wrapper.querySelector('input');
                    const trigger = wrapper.querySelector('.time-trigger');
                    const dropdown = wrapper.querySelector('.time-dropdown');
                    
                    input.onfocus = function() { this.select(); };
                    input.onchange = (e) => updateSession(sess.id, field, e.target.value);
                    input.onblur = (e) => {
                         const formatted = parseTimeInput(e.target.value);
                         if(formatted !== e.target.value) {
                             e.target.value = formatted;
                             updateSession(sess.id, field, formatted);
                         }
                    };
                    
                    // Dropdown toggle with smart positioning
                    trigger.onclick = (e) => {
                        e.stopPropagation();
                        // Close others
                        document.querySelectorAll('.time-dropdown').forEach(d => {
                            if(d !== dropdown) d.classList.remove('show');
                        });
                        
                        // Calculate position
                        const rect = wrapper.getBoundingClientRect();
                        const spaceBelow = window.innerHeight - rect.bottom;
                        
                        if(spaceBelow < 220) { // If less than 220px below, open upwards
                            dropdown.style.top = 'auto';
                            dropdown.style.bottom = '100%';
                            dropdown.style.marginBottom = '4px';
                        } else {
                            dropdown.style.top = '100%';
                            dropdown.style.bottom = 'auto';
                            dropdown.style.marginBottom = '0';
                        }

                        dropdown.classList.toggle('show');
                    };

                    dropdown.querySelectorAll('.time-option').forEach(opt => {
                        opt.onclick = () => {
                            input.value = opt.dataset.val;
                            updateSession(sess.id, field, opt.dataset.val);
                            dropdown.classList.remove('show');
                        };
                    });
                });

                const endInput = el.querySelector('.sess-end');
                if (isLastSession) {
                    endInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Tab' && !e.shiftKey) {
                            e.preventDefault();
                            addSession();
                        }
                    });
                }

                const btnAdd = el.querySelector('.add');
                btnAdd.onclick = () => addSession(sess.id);

                const btnDel = el.querySelector('.delete');
                if (btnDel) btnDel.onclick = () => removeSession(sess.id);

                container.appendChild(el);
            });
        }

        function generate() {
            const outputPre = document.getElementById('output-pre');
            const emptyState = document.getElementById('empty-state');
            const rawData = state.excelInput.trim();

            const sessions = state.sessions;
            const modulos = state.modulos;
            let finalMd = '';
            
            // Check if user has entered data
            const hasExcel = rawData.length > 0;
            const hasSessions = sessions.length > 0;

            if (!hasExcel && !hasSessions) {
                outputPre.style.display = 'none';
                emptyState.style.display = 'flex';
                outputPre.textContent = '';
                return;
            }

            outputPre.style.display = 'block';
            emptyState.style.display = 'none';

            // --- Calc Common Stats ---
            const totalMinsSessions = sessions.reduce((acc, s) => acc + calculateDurationMinutes(s.start, s.end), 0);
            let totalMinsCert = totalMinsSessions + (modulos.app ? modulos.appH * 60 : 0) + (modulos.col ? modulos.colH * 60 : 0);
            const stats = {
                total: minutesToHmm(totalMinsCert),
                pres: minutesToHmm(totalMinsSessions)
            };

            // --- Building Blocks ---
            
            // Block: Modulos
            let modulesBlock = '';
            if (true) { // Always generate modules block if sessions exist (as per user example)
                modulesBlock = `### MÓDULOS:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
                `- HORAS: ${formatHorasDisplay(stats.total)}\n` +
                ` - Presencial__ ➤ ${formatHorasDisplay(stats.pres)}\n` +
                (modulos.app ? ` - Aplicación__ ➤ ${modulos.appH} h\n` : '') +
                (modulos.col ? ` - Colaboración ➤ ${modulos.colH} h\n` : '');
            }

            // Block: Temporalization
            const tempBlock = `\n### TEMPORALIZACIÓN:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
                sessions.map((s, i) => `${CHAR_BLOCK} ${formatDateForTemporalizacion(s.date)} ${s.start}-${s.end} ${state.codigo}  SESIÓN ${i+1} / ${sessions.length}`).join('\n');

            
            // CASE 1: Partial Generation (No Excel, only Sessions)
            if (!hasExcel) {
                finalMd = modulesBlock + '\n' + tempBlock;
            } 
            // CASE 2: Full Generation (Excel + Sessions)
            else {
                // Parse Excel
                const rows = rawData.split('\n').filter(r => r.trim()).map(r => r.split('\t').map(c => c.trim()));
                const maxCols = Math.max(...rows.map(r => r.length));
                const normalizedRows = rows.map(r => {
                    while(r.length < maxCols) r.push('');
                    return r;
                });
                const headers = normalizedRows[0] || [];
                const body = normalizedRows.slice(1);
                const surnameIdx = headers.findIndex(h => h.toUpperCase().includes('APELLIDO'));
                const sortedBody = surnameIdx >= 0 
                    ? [...body].sort((a,b) => (a[surnameIdx]||'').localeCompare(b[surnameIdx]||'', 'es', {sensitivity:'base'}))
                    : body;
                const apellidosList = surnameIdx >= 0 ? sortedBody.map(r => r[surnameIdx]) : [];
                
                // Build Tables
                const buildTable = (dataRows) => {
                    if(dataRows.length === 0) return '';
                    const colWidths = new Array(dataRows[0].length).fill(0);
                    dataRows.forEach(r => r.forEach((c, i) => colWidths[i] = Math.max(colWidths[i], c.length, 3)));
                    return dataRows.map((r, rIdx) => {
                        const line = '| ' + r.map((c, i) => padRight(c, colWidths[i])).join(' | ') + ' |';
                        if (rIdx === 0) return line + '\n| ' + colWidths.map(w => '-'.repeat(w)).join(' | ') + ' |';
                        return line;
                    }).join('\n');
                };
                const mainTableMd = buildTable([headers, ...sortedBody]);

                // Attendance Table
                let attMd = '';
                if (apellidosList.length > 0) {
                     const row1 = ['', state.codigo, '', '', ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []), ...sessions.map(s => formatDateForHeader(s.date))];
                     const row2 = ['', '', '', '', ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []), ...sessions.map(s => s.start)];
                     const row3 = ['', '', 'CERT', minutesToHmm(totalMinsSessions * 0.85), ...(modulos.app ? ['APLI'] : []), ...(modulos.col ? ['COL'] : []), ...sessions.map(s => s.end)];
                     const row4 = ['Nº', 'APELLIDOS', stats.total, stats.pres, ...(modulos.app ? [modulos.appH.toString()] : []), ...(modulos.col ? [modulos.colH.toString()] : []), ...sessions.map(s => minutesToHmm(calculateDurationMinutes(s.start, s.end)))];
                     const studentRows = apellidosList.map((name, i) => [(i+1).toString(), name, '', '', ...(modulos.app ? [''] : []), ...(modulos.col ? [''] : []), ...sessions.map(() => BLOCK_STRING)]);
                     
                     const fullAttData = [row1, row2, row3, row4, ...studentRows];
                     const attWidths = new Array(fullAttData[0].length).fill(0);
                     fullAttData.forEach(r => { r.forEach((c, i) => { const cellLen = (c || '').length; if (cellLen > attWidths[i]) attWidths[i] = cellLen; }); });
                     for(let i=0; i<attWidths.length; i++) attWidths[i] = Math.max(attWidths[i], 3);

                     attMd = fullAttData.map((r, i) => {
                        const line = '| ' + r.map((c, idx) => {
                            const content = c || '';
                            if (content === BLOCK_STRING) return content; 
                            return padRight(content, attWidths[idx]);
                        }).join(' | ') + ' |';
                        if (i === 3) return line + '\n| ' + attWidths.map(w => CHAR_OVERLINE.repeat(w)).join(' | ') + ' |';
                        return line;
                     }).join('\n');
                }

                // Assemble Full
                finalMd = modulesBlock + '\n' + tempBlock + 
                          `\n\n### PARTICIPACIÓN / CERTIFICACIÓN:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n` + 
                          `${mainTableMd}\n\n${attMd}\n\n` +
                          `- Inscritos_ ➤ ${apellidosList.length.toString().padStart(2, ' ')}\n- Certifican ➤ \n- Porcentaje ➤ `;
            }

            outputPre.textContent = finalMd;
        }

        function copyToClipboard() {
            const text = document.getElementById('output-pre').textContent;
            if (!text) return;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                 navigator.clipboard.writeText(text).then(showCopyFeedback).catch(err => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
             const textarea = document.createElement('textarea');
             textarea.value = text;
             document.body.appendChild(textarea);
             textarea.select();
             try {
                document.execCommand('copy');
                showCopyFeedback();
             } catch (err) {
                console.error('Fallback copy failed', err);
             }
             document.body.removeChild(textarea);
        }

        function showCopyFeedback() {
            const btn = document.getElementById('btn-copy');
            const originalHTML = btn.innerHTML;
            const originalBg = btn.style.backgroundColor;
            
            btn.innerHTML = '¡Copiado!';
            btn.style.backgroundColor = '#238636'; 
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.backgroundColor = originalBg;
            }, 2000);
        }

        // --- START ---
        init();

    </script>
</body>
