<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de DNI / NIE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%225%22 y=%2282%22 width=%2290%22 height=%2218%22 rx=%224%22 fill=%22%2392278f%22/><rect x=%2238%22 y=%2230%22 width=%2224%22 height=%2245%22 fill=%22%2392278f%22/><path d=%22M10 35 L50 0 L90 35 Z%22 fill=%22%2392278f%22/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-validate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #f5f5f5;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-card.valid .stat-number {
            color: #10b981;
        }

        .stat-card.invalid .stat-number {
            color: #ef4444;
        }

        .stat-card.total .stat-number {
            color: #667eea;
        }

        .dni-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .dni-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dni-item.valid {
            background: #d1fae5;
            border-left: 4px solid #10b981;
        }

        .dni-item.invalid {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
        }

        .dni-original {
            color: #666;
            font-size: 12px;
            font-style: italic;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.valid {
            background: #10b981;
            color: white;
        }

        .status-badge.invalid {
            background: #ef4444;
            color: white;
        }

        .export-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .export-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        #cleanList {
            min-height: 120px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            font-size: 13px;
        }

        .btn-download {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-download:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇪🇸 Validador de DNI/NIE para REFORACEN</h1>
            <p>Pega tu lista de DNIs o NIEs y comprobaré cada uno</p>
        </div>

        <div class="content">
            <div class="input-section">
                <label for="dniInput">Introduce los DNIs o NIEs copiados del documento de "Recogida de datos"(uno por línea):</label>
                <textarea id="dniInput" placeholder="Ejemplo:&#10;71119995Q&#10;Y1234567Z&#10;71119995 Q&#10;X-1234567-L"></textarea>
            </div>

            <div class="button-group">
                <button class="btn-validate" onclick="validateDNIs()">Validar DNIs/NIEs</button>
                <button class="btn-clear" onclick="clearAll()">Limpiar</button>
            </div>

            <div class="results" id="results">
                <div class="stats">
                    <div class="stat-card total">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card valid">
                        <div class="stat-number" id="validCount">0</div>
                        <div class="stat-label">Válidos</div>
                    </div>
                    <div class="stat-card invalid">
                        <div class="stat-number" id="invalidCount">0</div>
                        <div class="stat-label">Inválidos</div>
                    </div>
                </div>

                <div class="dni-list" id="dniList"></div>

                <div class="export-section">
                    <h3>📋 Listado preparado para CARGA MASIVA en REFORACEN (Formato CSV)</h3>
                    <p style="color: #666; font-size: 14px; margin-bottom: 10px;">Incluye DNIs / NIE válidos y los inválidos corregidos automáticamente</p>
                    <textarea id="cleanList" readonly></textarea>
                    <button class="btn-download" onclick="downloadCSV()">⬇️ Descargar CSV</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function cleanDNI(dni) {
            // Eliminar espacios y guiones
            let cleaned = dni.trim().toUpperCase().replace(/[\s-]/g, '');
            return cleaned;
        }

        function validateDNI(dni) {
            const cleaned = cleanDNI(dni);
            
            // DNI: 8 números y 1 letra
            const dniRegex = /^(\d{8})([A-Z])$/;
            // NIE: letra (X, Y, Z) + 7 números + 1 letra
            const nieRegex = /^([XYZ])(\d{7})([A-Z])$/;
            
            let match = cleaned.match(dniRegex);
            let numbers;
            let letter;
            
            if (match) {
                // Es un DNI
                numbers = match[1];
                letter = match[2];
            } else {
                // Intentar como NIE
                match = cleaned.match(nieRegex);
                if (!match) {
                    return false;
                }
                
                // Para NIE, convertir la primera letra a número
                const niePrefix = match[1];
                const nieNumbers = match[2];
                letter = match[3];
                
                const nieMap = { 'X': '0', 'Y': '1', 'Z': '2' };
                numbers = nieMap[niePrefix] + nieNumbers;
            }

            // Letras válidas en orden
            const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
            const expectedLetter = validLetters[parseInt(numbers) % 23];

            return letter === expectedLetter;
        }

        function correctDNI(dni) {
            const cleaned = cleanDNI(dni);
            
            // Intentar extraer como DNI
            let numbersMatch = cleaned.match(/(\d{8})/);
            
            if (numbersMatch) {
                const numbers = numbersMatch[1];
                const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
                const correctLetter = validLetters[parseInt(numbers) % 23];
                return numbers + correctLetter;
            }
            
            // Intentar extraer como NIE
            const nieMatch = cleaned.match(/([XYZ])(\d{7})/);
            
            if (nieMatch) {
                const niePrefix = nieMatch[1];
                const nieNumbers = nieMatch[2];
                
                const nieMap = { 'X': '0', 'Y': '1', 'Z': '2' };
                const numbers = nieMap[niePrefix] + nieNumbers;
                
                const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
                const correctLetter = validLetters[parseInt(numbers) % 23];
                
                return niePrefix + nieNumbers + correctLetter;
            }
            
            return null; // No se puede corregir
        }

        function validateDNIs() {
            const input = document.getElementById('dniInput').value;
            const lines = input.split('\n').filter(line => line.trim() !== '');

            if (lines.length === 0) {
                alert('Por favor, introduce al menos un DNI o NIE');
                return;
            }

            let validCount = 0;
            let invalidCount = 0;
            const results = [];

            lines.forEach(line => {
                const original = line.trim();
                const cleaned = cleanDNI(original);
                const isValid = validateDNI(original);
                const corrected = isValid ? cleaned : correctDNI(original);

                if (isValid) {
                    validCount++;
                } else {
                    invalidCount++;
                }

                results.push({
                    original,
                    cleaned,
                    isValid,
                    corrected
                });
            });

            displayResults(results, validCount, invalidCount);
        }

        function displayResults(results, validCount, invalidCount) {
            document.getElementById('totalCount').textContent = results.length;
            document.getElementById('validCount').textContent = validCount;
            document.getElementById('invalidCount').textContent = invalidCount;

            const listContainer = document.getElementById('dniList');
            listContainer.innerHTML = '';

            // Crear lista de DNIs limpios (solo válidos)
            const cleanDNIs = [];

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = `dni-item ${result.isValid ? 'valid' : 'invalid'}`;
                
                const dniInfo = document.createElement('div');
                
                if (result.isValid) {
                    dniInfo.innerHTML = `
                        <strong>${result.cleaned}</strong>
                        ${result.original !== result.cleaned ? `<div class="dni-original">Original: ${result.original}</div>` : ''}
                    `;
                } else {
                    dniInfo.innerHTML = `
                        <strong>${result.cleaned}</strong>
                        <div class="dni-original">Original: ${result.original}</div>
                        ${result.corrected ? `<div class="dni-original" style="color: #10b981; font-weight: 600;">Corregido: ${result.corrected}</div>` : '<div class="dni-original" style="color: #ef4444;">No se puede corregir</div>'}
                    `;
                }

                const badge = document.createElement('span');
                badge.className = `status-badge ${result.isValid ? 'valid' : 'invalid'}`;
                badge.textContent = result.isValid ? '✓ Válido' : '✗ Inválido';

                item.appendChild(dniInfo);
                item.appendChild(badge);
                listContainer.appendChild(item);

                // Agregar a la lista de DNIs limpios
                if (result.isValid) {
                    cleanDNIs.push(`${result.cleaned},,1`);
                } else if (result.corrected) {
                    cleanDNIs.push(`${result.corrected},,1`);
                }
            });

            // Mostrar lista limpia
            const cleanListTextarea = document.getElementById('cleanList');
            cleanListTextarea.value = cleanDNIs.join('\n');

            document.getElementById('results').classList.add('show');
        }

        function downloadCSV() {
            const cleanList = document.getElementById('cleanList').value;
            
            if (!cleanList.trim()) {
                alert('No hay DNIs/NIEs válidos para descargar');
                return;
            }

            const blob = new Blob([cleanList], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const filename = `Carga MASIVA - ${year}-${month}-${day}_${hours}.${minutes}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearAll() {
            document.getElementById('dniInput').value = '';
            document.getElementById('cleanList').value = '';
            document.getElementById('results').classList.remove('show');
        }
    </script>
</body>
</html>
