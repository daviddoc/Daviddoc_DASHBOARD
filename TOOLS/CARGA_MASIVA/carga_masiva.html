<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Validator Pro | Carga Masiva</title>
    <style>
        :root {
            /* Palette - Deep Dark & Clean */
            --bg: #000000;
            --surface: #16181c;
            --surface-hover: #1e2126;
            --border: #2f3336;
            
            --text-main: #e7e9ea;
            --text-dim: #71767b;
            
            /* Brand Colors */
            --brand: #1d9bf0;
            --success: #00ba7c;
            --danger: #f91880; /* Magenta vivo para errores */
            --warn: #ffd400;

            /* Dimensions */
            --header-h: 60px;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- 1. HEADER (Glassmorphism) --- */
        header {
            height: var(--header-h); padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border); 
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
        }
        .brand { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .brand span { background: linear-gradient(45deg, var(--brand), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* --- 2. LAYOUT PRINCIPAL --- */
        .main-container {
            margin-top: var(--header-h);
            flex: 1; 
            display: grid; 
            grid-template-columns: 1fr;
            overflow: hidden;
        }

        @media (min-width: 900px) {
            .main-container { grid-template-columns: 450px 1fr; }
        }

        /* --- 3. INPUT ZONE (Izquierda en Desktop) --- */
        .input-panel {
            background: var(--bg);
            display: flex; flex-direction: column;
            border-right: 1px solid var(--border);
            position: relative;
            transition: 0.3s;
        }

        .drop-zone {
            flex: 1; display: flex; flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .drop-zone.dragover { background: rgba(29, 155, 240, 0.1); }
        .drop-zone.dragover textarea { border-color: var(--brand); }

        textarea {
            flex: 1; width: 100%; 
            background: var(--surface); color: var(--text-main);
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 20px; font-family: 'SF Mono', 'Courier New', monospace; font-size: 15px; line-height: 1.6;
            resize: none; transition: 0.2s;
        }
        textarea:focus { border-color: var(--brand); border-style: solid; background: #000; }
        textarea::placeholder { color: var(--text-dim); }

        .input-actions {
            padding: 15px 20px;
            display: flex; gap: 10px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .btn {
            padding: 12px 20px; border-radius: 50px; 
            font-weight: 700; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--text-main); color: #000; flex: 2; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); flex: 1; }
        .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

        /* --- 4. RESULTS DASHBOARD (Derecha en Desktop) --- */
        .dashboard-panel {
            background: var(--bg);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Tabs de Filtro */
        .tabs-header {
            display: flex; gap: 5px; padding: 15px 20px 0;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 10;
        }
        .tab {
            padding: 10px 16px; 
            color: var(--text-dim); 
            font-weight: 600; font-size: 14px;
            position: relative; cursor: pointer;
            transition: 0.2s;
        }
        .tab:hover { background: rgba(255,255,255,0.05); border-radius: 8px 8px 0 0; color: var(--text-main); }
        .tab.active { color: var(--brand); }
        .tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: var(--brand); border-radius: 3px 3px 0 0;
        }
        .badge { 
            background: var(--border); color: var(--text-main); 
            padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; 
        }
        .tab.active .badge { background: var(--brand); color: white; }

        /* Lista de Resultados */
        .results-list {
            flex: 1; overflow-y: auto; padding-bottom: 100px; /* Espacio para FAB */
        }
        
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-dim); text-align: center; padding: 40px;
        }
        .empty-icon { font-size: 48px; margin-bottom: 20px; opacity: 0.5; }

        .result-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr auto;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }
        .result-item:hover { background: var(--surface); }

        .res-data { display: flex; flex-direction: column; gap: 4px; }
        .res-main { font-family: 'SF Mono', monospace; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .res-sub { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px;}

        .status-pill {
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .status-valid { background: rgba(0, 186, 124, 0.15); color: var(--success); }
        .status-invalid { background: rgba(249, 24, 128, 0.15); color: var(--danger); }
        
        /* Correcciones Automáticas resaltadas */
        .fix-highlight { color: var(--success); font-weight: bold; }

        /* --- 5. FLOATING ACTIONS (Móvil y Desktop) --- */
        .fab-container {
            position: absolute; bottom: 20px; right: 20px; left: 20px;
            display: flex; justify-content: flex-end; gap: 10px;
            pointer-events: none; /* Dejar pasar clics si no hay botones */
        }
        
        .btn-fab {
            pointer-events: auto;
            background: var(--brand); color: white;
            padding: 14px 24px; border-radius: 50px;
            font-weight: 700; box-shadow: 0 8px 20px rgba(29, 155, 240, 0.4);
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(100px); opacity: 0;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-fab.visible { transform: translateY(0); opacity: 1; }
        .btn-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(29, 155, 240, 0.5); }

        /* Stats Bar (Resumen visual) */
        .stats-bar {
            background: var(--surface);
            padding: 15px 20px;
            display: flex; gap: 20px; justify-content: center;
            border-bottom: 1px solid var(--border);
            display: none; /* Se muestra con JS */
        }
        .stat-item { text-align: center; }
        .stat-val { font-size: 20px; font-weight: 800; display: block; }
        .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        
        /* Toast Notification */
        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-main); color: #000;
            padding: 10px 20px; border-radius: 30px;
            font-weight: 600; font-size: 14px;
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile Adjustments */
        @media (max-width: 899px) {
            .input-panel.collapsed textarea { height: 100px; padding: 10px; opacity: 0.7; }
            .input-panel.collapsed .input-actions { display: none; }
            .tabs-header { position: sticky; top: 0; }
        }

    </style>
</head>
<body>

    <div id="toast" class="toast">Acción completada</div>

    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2">
                <defs><linearGradient id="grad" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0%" stop-color="#1d9bf0"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Validator Pro</span>
        </div>
        <div>
            </div>
    </header>

    <div class="main-container">
        
        <div class="input-panel" id="inputPanel">
            <div class="drop-zone" id="dropZone">
                <textarea id="dniInput" placeholder="Pega tu lista aquí...&#10;&#10;Soporta:&#10;• DNIs mezclados con texto&#10;• Archivos arrastrados (.txt/.csv)&#10;• Formatos sucios (con espacios, guiones)" spellcheck="false"></textarea>
            </div>
            <div class="input-actions">
                <button class="btn btn-ghost" onclick="clearAll()">🗑️ Limpiar</button>
                <button class="btn btn-primary" onclick="runValidation()">⚡ Validar Lista</button>
            </div>
        </div>

        <div class="dashboard-panel" id="resultsPanel">
            
            <div class="stats-bar" id="statsBar">
                <div class="stat-item">
                    <span class="stat-val" id="countTotal">0</span>
                    <span class="stat-lbl">Total</span>
                </div>
                <div class="stat-item" style="color: var(--success)">
                    <span class="stat-val" id="countValid">0</span>
                    <span class="stat-lbl">Válidos</span>
                </div>
                <div class="stat-item" style="color: var(--danger)">
                    <span class="stat-val" id="countInvalid">0</span>
                    <span class="stat-lbl">Errores</span>
                </div>
            </div>

            <div class="tabs-header hidden" id="tabsHeader">
                <div class="tab active" onclick="switchTab('all')">Todos <span class="badge" id="badgeAll">0</span></div>
                <div class="tab" onclick="switchTab('valid')">Válidos <span class="badge" id="badgeValid">0</span></div>
                <div class="tab" onclick="switchTab('invalid')">Errores <span class="badge" id="badgeInvalid">0</span></div>
            </div>

            <div class="results-list" id="resultsList">
                <div class="empty-state">
                    <div class="empty-icon">📂</div>
                    <h3>Esperando datos</h3>
                    <p>Pega texto, arrastra un archivo o escribe manualmente.</p>
                </div>
            </div>

            <div class="fab-container">
                <button id="btnDownload" class="btn btn-fab" onclick="downloadCSV()">
                    ⬇️ Descargar CSV
                </button>
            </div>

            <textarea id="cleanList" class="hidden"></textarea>
        </div>
    </div>

    <script>
        // --- LÓGICA CORE (NO TOCADA, SOLO OPTIMIZADA EN USO) ---
        function cleanDNI(dni) {
            return dni.trim().toUpperCase().replace(/[\s-]/g, '');
        }

        function validateDNI(dni) {
            const cleaned = cleanDNI(dni);
            const dniRegex = /^(\d{8})([A-Z])$/;
            const nieRegex = /^([XYZ])(\d{7})([A-Z])$/;
            let match = cleaned.match(dniRegex);
            let numbers, letter;
            
            if (match) {
                numbers = match[1];
                letter = match[2];
            } else {
                match = cleaned.match(nieRegex);
                if (!match) return false;
                const niePrefix = match[1];
                const nieNumbers = match[2];
                letter = match[3];
                const nieMap = { 'X': '0', 'Y': '1', 'Z': '2' };
                numbers = nieMap[niePrefix] + nieNumbers;
            }
            const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
            return letter === validLetters[parseInt(numbers) % 23];
        }

        function correctDNI(dni) {
            const cleaned = cleanDNI(dni);
            // Intentar DNI
            let numbersMatch = cleaned.match(/(\d{8})/);
            if (numbersMatch) {
                const numbers = numbersMatch[1];
                const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
                return numbers + validLetters[parseInt(numbers) % 23];
            }
            // Intentar NIE
            const nieMatch = cleaned.match(/([XYZ])(\d{7})/);
            if (nieMatch) {
                const niePrefix = nieMatch[1];
                const nieNumbers = nieMatch[2];
                const nieMap = { 'X': '0', 'Y': '1', 'Z': '2' };
                const numbers = nieMap[niePrefix] + nieNumbers;
                const validLetters = 'TRWAGMYFPDXBNJZSQVHLCKE';
                return niePrefix + nieNumbers + validLetters[parseInt(numbers) % 23];
            }
            return null;
        }

        // --- UX / UI LOGIC ---

        let currentResults = [];
        let currentTab = 'all';

        // 1. Detección Inteligente de Texto (Mejora de flujo)
        function extractPotentialIDs(text) {
            // Regex que busca patrones parecidos a DNI/NIE incluso dentro de texto sucio
            // Busca secuencias de 8 numeros o X/Y/Z seguido de numeros
            const broadRegex = /([XYZ]?\s*\d{7,8}\s*-?\s*[A-Z]?)/gi; 
            const matches = text.match(broadRegex);
            return matches ? matches : text.split('\n');
        }

        function runValidation() {
            const inputVal = document.getElementById('dniInput').value;
            if(!inputVal.trim()) { showToast("⚠️ El campo está vacío"); return; }

            // Usamos lógica de extracción más inteligente si hay mucho texto basura
            // Si parece una lista limpia, usamos split por linea. Si no, regex.
            let lines = inputVal.split('\n').filter(l => l.trim().length > 0);
            
            // Si las lineas son muy largas, asumimos que es texto mezclado y usamos regex extractor
            if(lines.some(l => l.length > 20)) {
               const extracted = extractPotentialIDs(inputVal);
               if(extracted) lines = extracted;
            }

            currentResults = [];
            let validCount = 0;
            let invalidCount = 0;
            let cleanCSVLines = [];

            lines.forEach(line => {
                const original = line.trim();
                // Limpieza básica para eliminar comas o puntos finales comunes en copy-paste
                const sanitized = original.replace(/[.,;:]$/, '');
                
                const cleaned = cleanDNI(sanitized);
                // Evitar procesar lineas vacías o muy cortas tras limpieza
                if(cleaned.length < 5) return;

                const isValid = validateDNI(sanitized);
                const corrected = isValid ? cleaned : correctDNI(sanitized);

                if (isValid) validCount++; else invalidCount++;

                // Lógica CSV original
                if (isValid) {
                    cleanCSVLines.push(`${cleaned},,1`);
                } else if (corrected) {
                    cleanCSVLines.push(`${corrected},,1`);
                }

                currentResults.push({ original: sanitized, cleaned, isValid, corrected });
            });

            // Actualizar UI
            document.getElementById('cleanList').value = cleanCSVLines.join('\n');
            updateStats(currentResults.length, validCount, invalidCount);
            renderResults();
            
            // UI Feedback
            document.getElementById('tabsHeader').classList.remove('hidden');
            document.getElementById('statsBar').style.display = 'flex';
            
            if(cleanCSVLines.length > 0) {
                document.getElementById('btnDownload').classList.add('visible');
            } else {
                document.getElementById('btnDownload').classList.remove('visible');
            }

            // En móvil, colapsar el input para ver resultados
            if(window.innerWidth < 900) {
                document.getElementById('inputPanel').classList.add('collapsed');
                // Scroll suave hacia resultados
                document.getElementById('resultsPanel').scrollIntoView({behavior: 'smooth'});
            }
            
            showToast(`✅ Procesados ${currentResults.length} registros`);
        }

        function renderResults() {
            const container = document.getElementById('resultsList');
            container.innerHTML = '';

            const filtered = currentResults.filter(r => {
                if(currentTab === 'all') return true;
                if(currentTab === 'valid') return r.isValid;
                if(currentTab === 'invalid') return !r.isValid;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>No hay resultados en esta pestaña</p></div>`;
                return;
            }

            filtered.forEach(r => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                let icon = r.isValid ? 'check_circle' : 'error';
                let statusClass = r.isValid ? 'status-valid' : 'status-invalid';
                let statusText = r.isValid ? 'Válido' : 'Inválido';

                // Lógica de visualización
                let subHtml = '';
                if(r.isValid) {
                    if(r.original !== r.cleaned) subHtml = `<span class="res-sub">Original: ${r.original}</span>`;
                } else {
                    if(r.corrected) {
                        subHtml = `<span class="res-sub">Corregido: <span class="fix-highlight">${r.corrected}</span></span>`;
                    } else {
                        subHtml = `<span class="res-sub">Original: ${r.original} (No reparable)</span>`;
                    }
                }

                item.innerHTML = `
                    <div class="res-data">
                        <span class="res-main">${r.cleaned || r.original}</span>
                        ${subHtml}
                    </div>
                    <div class="status-pill ${statusClass}">
                        ${r.isValid ? '✓' : '✗'} ${statusText}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => {
                if(t.innerText.toLowerCase().includes(tab === 'all' ? 'todos' : tab === 'valid' ? 'válidos' : 'errores')) 
                    t.classList.add('active');
            });
            renderResults();
        }

        function updateStats(total, valid, invalid) {
            document.getElementById('countTotal').innerText = total;
            document.getElementById('countValid').innerText = valid;
            document.getElementById('countInvalid').innerText = invalid;
            
            document.getElementById('badgeAll').innerText = total;
            document.getElementById('badgeValid').innerText = valid;
            document.getElementById('badgeInvalid').innerText = invalid;
        }

        function clearAll() {
            document.getElementById('dniInput').value = '';
            document.getElementById('cleanList').value = '';
            document.getElementById('resultsList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📂</div>
                    <h3>Esperando datos</h3>
                    <p>Pega texto, arrastra un archivo o escribe manualmente.</p>
                </div>`;
            document.getElementById('tabsHeader').classList.add('hidden');
            document.getElementById('statsBar').style.display = 'none';
            document.getElementById('btnDownload').classList.remove('visible');
            document.getElementById('inputPanel').classList.remove('collapsed');
            currentResults = [];
            showToast("Papelera vaciada");
        }

        // --- Drag and Drop ---
        const dropZone = document.getElementById('dropZone');
        const textarea = document.getElementById('dniInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if(files.length > 0) {
                const file = files[0];
                if(file.type.startsWith('text') || file.name.endsWith('.csv')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        textarea.value = e.target.result;
                        showToast("Archivo cargado con éxito");
                        runValidation(); // Auto-run
                    }
                    reader.readAsText(file);
                } else {
                    showToast("❌ Solo archivos de texto o CSV");
                }
            }
        }

        // --- Funciones originales conservadas ---
        function downloadCSV() {
            const cleanList = document.getElementById('cleanList').value;
            if (!cleanList.trim()) { showToast('⚠️ No hay datos válidos'); return; }

            const blob = new Blob([cleanList], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            const now = new Date();
            const filename = `Carga_MASIVA_${now.toISOString().slice(0,19).replace('T','_').replace(/:/g,'.')}.csv`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("📥 Descargando CSV...");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

    </script>
</body>
</html>
