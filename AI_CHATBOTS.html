<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IA Móvil</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #007acc;
            --danger: #ff4444;
            --warn: #ffbb33;
            --border: #333;
            --selected: #2c4c3b; /* Color para indicar selección */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none; /* Evita selección de texto al tocar mucho */
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            min-width: 150px;
        }

        input[type="text"] {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 30px 10px 10px;
            border-radius: 8px;
            outline: none;
            font-size: 16px; /* 16px evita zoom en iOS al escribir */
            box-sizing: border-box;
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            display: none;
        }

        /* BOTONES SUPERIORES */
        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .btn:hover { background: #2a2a2a; }
        .btn:active { transform: scale(0.95); }

        /* Botón Guardar (parpadea) */
        #btnSave {
            display: none;
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: pulse 2s infinite;
        }

        /* Botón Modo Organización (Amarillo cuando activo) */
        #btnEdit.active {
            background-color: var(--warn);
            color: #000;
            border-color: var(--warn);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        /* --- GRID --- */
        .grid-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.1s, background 0.2s;
            position: relative;
            /* Evita el comportamiento nativo de arrastrar imagen */
            -webkit-user-drag: none; 
        }

        /* Estilos para cuando estamos reorganizando */
        .edit-mode .card {
            border: 1px dashed #666;
        }

        /* Estilo para la tarjeta seleccionada para mover */
        .card.selected-swap {
            background-color: var(--selected);
            border: 2px solid #4caf50;
            transform: scale(0.95);
        }

        .card img {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            border-radius: 6px;
            pointer-events: none; /* Importante para toques */
        }

        .card span {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.2;
            pointer-events: none;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .modal {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal h3 { margin-top: 0; color: var(--text); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box;}
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-text { padding: 8px 15px; background: #333; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: var(--accent); }

        /* Instrucciones flotantes en modo edición */
        .edit-hint {
            display: none;
            font-size: 0.8rem;
            color: var(--warn);
            text-align: center;
            margin-bottom: 10px;
            background: rgba(255, 187, 51, 0.1);
            padding: 5px;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
            <span class="clear-search" id="clearSearch">✕</span>
        </div>
        
        <button class="btn" id="btnSave" title="Guardar y Descargar">💾</button>

        <button class="btn" id="btnEdit" title="Reorganizar">⇄</button>

        <button class="btn" id="btnAdd" title="Añadir">➕</button>
    </div>

    <div class="edit-hint" id="editHint">
        Modo Organización: Toca una tarjeta y luego otra para intercambiarlas.
    </div>

    <div class="grid-container">
        <div class="grid" id="bookmarksGrid"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Añadir IA</h3>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="newName">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="newUrl" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="btnCancel">Cancelar</button>
                <button class="btn-text btn-primary" id="btnConfirmAdd">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATOS INICIALES ---
        /*DATA_START*/
        let bookmarks = [
            { name: "Copilot", url: "https://copilot.microsoft.com/" },
            { name: "Gemini", url: "https://gemini.google.com/" },
            { name: "Claude", url: "https://claude.ai/" },
            { name: "ChatGPT", url: "https://chatgpt.com/" },
            // FIX: Icono manual para NotebookLM
            { name: "NotebookLM", url: "https://notebooklm.google.com/", customIcon: "https://www.gstatic.com/lamda/images/favicons/notebooklm_favicon_dark_192.png" },
            { name: "Perplexity", url: "https://www.perplexity.ai/" },
            { name: "LM Arena", url: "https://lmarena.ai/" },
            { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=Chat&ia=chat" },
            { name: "Qwen", url: "https://chat.qwenlm.ai/" },
            { name: "DeepSeek", url: "https://chat.deepseek.com/" },
            { name: "AI Studio", url: "https://aistudio.google.com/" },
            { name: "Firebase", url: "https://console.firebase.google.com/" },
            { name: "Canva", url: "https://www.canva.com/" },
            { name: "Teachable", url: "https://teachablemachine.withgoogle.com/" },
            { name: "Adobe Firefly", url: "https://firefly.adobe.com/" },
            { name: "Leonardo.ai", url: "https://leonardo.ai/" }
        ];
        /*DATA_END*/

        const grid = document.getElementById('bookmarksGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const btnSave = document.getElementById('btnSave');
        const btnAdd = document.getElementById('btnAdd');
        const btnEdit = document.getElementById('btnEdit');
        const editHint = document.getElementById('editHint');
        const modal = document.getElementById('modal');
        
        let isEditMode = false;
        let selectedIndex = null; // Para el intercambio

        // --- GENERADOR DE ICONOS ---
        function getFavicon(bm) {
            if (bm.customIcon) return bm.customIcon;
            return `https://s2.googleusercontent.com/s2/favicons?domain=${bm.url}&sz=64`;
        }

        // --- RENDERIZADO ---
        function render(filter = "") {
            grid.innerHTML = "";
            bookmarks.forEach((bm, index) => {
                if (bm.name.toLowerCase().includes(filter.toLowerCase())) {
                    // Usamos DIV en lugar de A para tener control total de click en JS
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.index = index;
                    card.dataset.url = bm.url;

                    if (index === selectedIndex && isEditMode) {
                        card.classList.add('selected-swap');
                    }

                    card.innerHTML = `
                        <img src="${getFavicon(bm)}" onerror="this.src='https://via.placeholder.com/32/444444/ffffff?text=AI'">
                        <span>${bm.name}</span>
                    `;
                    
                    // Gestor de clicks unificado
                    card.onclick = () => handleCardClick(index);
                    
                    grid.appendChild(card);
                }
            });
        }

        // --- LÓGICA PRINCIPAL ---
        
        // 1. Manejo de Click en Tarjeta
        function handleCardClick(index) {
            if (isEditMode) {
                // Lógica de Intercambio (Swap)
                if (selectedIndex === null) {
                    // Primera selección
                    selectedIndex = index;
                    render(searchInput.value); // Re-render para mostrar selección
                } else {
                    // Segunda selección: Intercambiar
                    if (selectedIndex !== index) {
                        swapItems(selectedIndex, index);
                    }
                    selectedIndex = null; // Reset
                    render(searchInput.value);
                }
            } else {
                // Navegación Normal
                const url = bookmarks[index].url;
                window.location.href = url;
            }
        }

        function swapItems(from, to) {
            const temp = bookmarks[from];
            bookmarks[from] = bookmarks[to];
            bookmarks[to] = temp;
            markAsDirty();
        }

        // 2. Toggle Modo Edición
        btnEdit.addEventListener('click', () => {
            isEditMode = !isEditMode;
            selectedIndex = null;
            
            if (isEditMode) {
                btnEdit.classList.add('active');
                document.body.classList.add('edit-mode');
                editHint.style.display = 'block';
            } else {
                btnEdit.classList.remove('active');
                document.body.classList.remove('edit-mode');
                editHint.style.display = 'none';
            }
            render(searchInput.value);
        });

        // 3. Búsqueda
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            clearSearchBtn.style.display = val ? 'block' : 'none';
            render(val);
        });

        document.getElementById('clearSearch').addEventListener('click', () => {
            searchInput.value = '';
            render();
            document.getElementById('clearSearch').style.display = 'none';
        });

        // 4. Añadir Marcador
        btnAdd.addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('btnCancel').addEventListener('click', () => modal.style.display = 'none');
        
        document.getElementById('btnConfirmAdd').addEventListener('click', () => {
            const name = document.getElementById('newName').value;
            let url = document.getElementById('newUrl').value;
            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                bookmarks.push({ name, url });
                render();
                modal.style.display = 'none';
                document.getElementById('newName').value = '';
                document.getElementById('newUrl').value = '';
                markAsDirty();
            }
        });

        // 5. Guardar Archivo
        function markAsDirty() {
            btnSave.style.display = 'flex';
            document.title = "Guardar cambios...";
        }

        btnSave.addEventListener('click', () => {
            const htmlContent = document.documentElement.outerHTML;
            const newDataString = JSON.stringify(bookmarks, null, 4);
            // Regex para reemplazar el bloque de datos con precisión
            const regex = /(\/\*DATA_START\*\/)([\s\S]*?)(\/\*DATA_END\*\/)/;
            const newScriptContent = `$1\n        let bookmarks = ${newDataString};\n        $3`;
            
            const newHtml = htmlContent.replace(regex, newScriptContent);
            const blob = new Blob([newHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'panel_ia_movil.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            btnSave.style.display = 'none';
            document.title = "Panel IA";
            
            // Desactiva modo edición al guardar
            if (isEditMode) btnEdit.click();
            alert("Archivo descargado. Reemplaza el antiguo.");
        });

        // Iniciar
        render();
    </script>
</body>
</html>
