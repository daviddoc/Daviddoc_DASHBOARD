<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando IA</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #007acc;
            --danger: #ff4444;
            --warn: #ffbb33;
            --border: #333;
            --selected: #2c4c3b;
            --focus-outline: #007acc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        /* --- TÍTULO --- */
        h1 {
            font-size: 14px;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            pointer-events: none;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
        }

        input[type="text"] {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 30px 10px 10px;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.3);
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            display: none;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.2s;
            outline: none; /* Quitamos outline por defecto para poner el nuestro */
        }

        .btn:focus {
            border-color: var(--accent);
        }

        .btn:hover { background: #2a2a2a; }

        #btnSave {
            display: none;
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: pulse 2s infinite;
        }

        #btnEdit.active {
            background-color: var(--warn);
            color: #000;
            border-color: var(--warn);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        /* --- LISTA --- */
        .grid-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.2s;
            cursor: pointer;
            position: relative;
            outline: none; /* Gestionamos el foco visualmente abajo */
        }

        /* Estilo visual del foco para navegación por teclado */
        .card:focus {
            border-color: var(--accent);
            background-color: #252525;
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .card:hover {
            background: #252525;
            border-color: #555;
        }

        .edit-mode .card {
            border: 1px dashed #666;
            cursor: move; 
        }

        .card.selected-swap {
            background-color: var(--selected);
            border: 1px solid #4caf50;
        }

        .card img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            pointer-events: none;
            object-fit: contain; /* Para que los iconos de google no se deformen */
        }

        .card span {
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            border: 1px solid var(--border);
        }
        .modal h3 { margin-top: 0; color: #fff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-text { padding: 8px 15px; background: #333; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: var(--accent); }

        .edit-hint {
            display: none;
            font-size: 0.8rem;
            color: var(--warn);
            text-align: center;
            margin-bottom: 10px;
            background: rgba(255, 187, 51, 0.1);
            padding: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Centro de Mando IA</h1>

    <div class="header">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
            <span class="clear-search" id="clearSearch">✕</span>
        </div>
        <button class="btn" id="btnSave" title="Guardar Cambios">💾</button>
        <button class="btn" id="btnEdit" title="Reorganizar">⇄</button>
        <button class="btn" id="btnAdd" title="Añadir">➕</button>
    </div>

    <div class="edit-hint" id="editHint">
        Modo Organización: Selecciona dos elementos para intercambiarlos.
    </div>

    <div class="grid-container">
        <div class="list" id="bookmarksList"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Añadir IA</h3>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="newName">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="newUrl" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="btn-text" id="btnCancel">Cancelar</button>
                <button class="btn-text btn-primary" id="btnConfirmAdd">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATOS ---
        /*DATA_START*/
        let bookmarks = [
            { name: "Copilot", url: "https://m365.cloud.microsoft/chat?auth=2&origindomain=Office" },
            { name: "Gemini", url: "https://gemini.google.com/" },
            { name: "Claude", url: "https://claude.ai/" },
            { name: "ChatGPT", url: "https://chatgpt.com/" },
            // ICONOS OFICIALES DE GSTATIC
            { name: "NotebookLM", url: "https://notebooklm.google.com/", customIcon: "https://www.gstatic.com/images/branding/product/2x/notebooklm_96dp.png" },
            { name: "Perplexity", url: "https://www.perplexity.ai/" },
            { name: "LM Arena", url: "https://lmarena.ai/" },
            { name: "DuckDuckGo AI", url: "https://duckduckgo.com/?q=Chat&ia=chat" },
            { name: "Qwen", url: "https://chat.qwenlm.ai/" },
            { name: "DeepSeek", url: "https://chat.deepseek.com/" },
            { name: "AI Studio", url: "https://aistudio.google.com/" },
            // ICONO OFICIAL FIREBASE
            { name: "Firebase", url: "https://console.firebase.google.com/", customIcon: "https://www.gstatic.com/images/branding/product/2x/firebase_96dp.png" },
            { name: "Canva", url: "https://www.canva.com/" },
            { name: "Teachable", url: "https://teachablemachine.withgoogle.com/" },
            { name: "Adobe Firefly", url: "https://firefly.adobe.com/" },
            { name: "Leonardo.ai", url: "https://leonardo.ai/" }
        ];
        /*DATA_END*/

        const listContainer = document.getElementById('bookmarksList');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const btnSave = document.getElementById('btnSave');
        const btnEdit = document.getElementById('btnEdit');
        const editHint = document.getElementById('editHint');
        
        let isEditMode = false;
        let selectedIndex = null;

        // --- INICIALIZACIÓN: FOCO EN BUSCADOR ---
        window.onload = () => {
            searchInput.focus();
            render();
        };

        function getFavicon(bm) {
            if (bm.customIcon) return bm.customIcon;
            return `https://s2.googleusercontent.com/s2/favicons?domain=${bm.url}&sz=64`;
        }

        function render(filter = "") {
            listContainer.innerHTML = "";
            
            bookmarks.forEach((bm, index) => {
                if (bm.name.toLowerCase().includes(filter.toLowerCase())) {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = bm.url;
                    // Tabindex 0 permite que el elemento reciba foco con TAB
                    card.tabIndex = 0; 

                    if (index === selectedIndex && isEditMode) {
                        card.classList.add('selected-swap');
                    }

                    card.innerHTML = `
                        <img src="${getFavicon(bm)}" onerror="this.src='https://via.placeholder.com/24'">
                        <span>${bm.name}</span>
                    `;

                    // Click handler
                    card.addEventListener('click', (e) => {
                        if (isEditMode) {
                            e.preventDefault(); 
                            handleSwapLogic(index);
                        }
                    });

                    listContainer.appendChild(card);
                }
            });
        }

        function handleSwapLogic(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
                render(searchInput.value);
            } else {
                if (selectedIndex !== index) {
                    const temp = bookmarks[selectedIndex];
                    bookmarks[selectedIndex] = bookmarks[index];
                    bookmarks[index] = temp;
                    markAsDirty();
                }
                selectedIndex = null;
                render(searchInput.value);
            }
        }

        // --- NAVEGACIÓN POR TECLADO ---
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            const cards = Array.from(document.querySelectorAll('.card'));
            
            // 1. Navegación con FLECHAS
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (active === searchInput) {
                    // Si estamos en el buscador, ir al primero
                    if (cards.length > 0) cards[0].focus();
                } else if (cards.includes(active)) {
                    // Si estamos en una carta, ir a la siguiente
                    const idx = cards.indexOf(active);
                    if (idx < cards.length - 1) cards[idx + 1].focus();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (cards.includes(active)) {
                    const idx = cards.indexOf(active);
                    if (idx > 0) {
                        cards[idx - 1].focus();
                    } else {
                        // Si es el primero, volver al buscador
                        searchInput.focus();
                    }
                }
            }
            // NOTA: ENTER y CTRL+ENTER funcionan nativamente en etiquetas <a>.
            // ENTER abre el enlace.
            // CTRL+ENTER abre en nueva pestaña.
            // No hace falta JS para eso, el navegador lo gestiona solo.
        });

        // --- BOTONES Y UI ---
        btnEdit.addEventListener('click', () => {
            isEditMode = !isEditMode;
            selectedIndex = null;
            if (isEditMode) {
                btnEdit.classList.add('active');
                document.body.classList.add('edit-mode');
                editHint.style.display = 'block';
            } else {
                btnEdit.classList.remove('active');
                document.body.classList.remove('edit-mode');
                editHint.style.display = 'none';
            }
            render(searchInput.value);
        });

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            clearSearchBtn.style.display = val ? 'block' : 'none';
            render(val);
        });
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            render();
            clearSearchBtn.style.display = 'none';
            searchInput.focus(); // Devolver foco al buscador al limpiar
        });

        const modal = document.getElementById('modal');
        document.getElementById('btnAdd').onclick = () => modal.style.display = 'flex';
        document.getElementById('btnCancel').onclick = () => modal.style.display = 'none';
        document.getElementById('btnConfirmAdd').onclick = () => {
            const name = document.getElementById('newName').value;
            let url = document.getElementById('newUrl').value;
            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                bookmarks.push({ name, url });
                render();
                modal.style.display = 'none';
                document.getElementById('newName').value = '';
                document.getElementById('newUrl').value = '';
                markAsDirty();
            }
        };

        function markAsDirty() {
            btnSave.style.display = 'flex';
            document.title = "Guardar cambios...";
        }

        btnSave.addEventListener('click', () => {
            const htmlContent = document.documentElement.outerHTML;
            const newDataString = JSON.stringify(bookmarks, null, 4);
            const regex = /(\/\*DATA_START\*\/)([\s\S]*?)(\/\*DATA_END\*\/)/;
            const newScriptContent = `$1\n        let bookmarks = ${newDataString};\n        $3`;
            
            const newHtml = htmlContent.replace(regex, newScriptContent);
            const blob = new Blob([newHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'panel_ia_master.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            btnSave.style.display = 'none';
            document.title = "Centro de Mando IA";
            if(isEditMode) btnEdit.click();
            alert("Archivo actualizado descargado.");
        });
    </script>
</body>
</html>
