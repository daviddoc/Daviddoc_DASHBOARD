  function parseCourseData() {
    const text = $('#cert-input-course').value;
    state.rawCourse = text;
    if (!text.trim()) { $('#cert-course-status').textContent = 'Pega los datos.'; return; }
    let extractedLabel = '';
    let extractedModules = [{ id: 'pres', name: 'PRESE', hours: 0, required: false, type: 'calculated' }];
    let extractedSessions = [];
    const moduleAliases = {
      presencial:   { name: 'PRESE', type: 'calculated', required: false },
      aplicacion:   { name: 'APL',   type: 'module',     required: true },
      colaboracion: { name: 'COL',   type: 'module',     required: true },
      entrega:      { name: 'ENT',   type: 'module',     required: true }
    };
    const moduleRegex = /[-•]\s*([A-Za-zÀ-ÿ]+)[_\s]+➤\s*(\d+)\s*h/gi;
    let mMatch, modCounter = 0;
    const _diacritics = new RegExp('[\\u0300-\\u036f]', 'g');
    while ((mMatch = moduleRegex.exec(text)) !== null) {
      const rn = mMatch[1].toLowerCase().normalize('NFD').replace(_diacritics, '').trim();
      const hrs = parseInt(mMatch[2]);
      const al = moduleAliases[rn];
      const uid = 'mod_' + Date.now() + '_' + (modCounter++) + '_' + rn;
      if (al) {
        if (al.type === 'calculated') extractedModules[0].hours = hrs;
        else extractedModules.push({ id: uid, name: al.name, hours: hrs, required: al.required });
      } else {
        extractedModules.push({ id: uid, name: rn.toUpperCase().substring(0, 5), hours: hrs, required: true });
      }
    }
    const sessionRegex = /(\d{4}[\/\-]\d{2}[\/\-]\d{2})\s+(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})\s*(.+?)(?:\s+SESI|$)/gim;
    let sMatch;
    const padHHMM = t => {
      const [h, m] = String(t).split(':');
      return `${(h || '00').padStart(2, '0')}:${(m || '00').padStart(2, '0')}`;
    };
    while ((sMatch = sessionRegex.exec(text)) !== null) {
      const dt = sMatch[1], st = padHHMM(sMatch[2]), en = padHHMM(sMatch[3]), lp = sMatch[4].trim();
      const iso = dt.replace(/\//g, '-');
      extractedSessions.push({
        id: 'sess_' + Date.now() + Math.random(),
        rawDate: iso,
        dateStr: Utils.formatCustomDate(iso),
        start: st, end: en
      });
      if (!extractedLabel && lp) extractedLabel = lp;
    }
    state.modules = extractedModules;
    state.sessions = extractedSessions;
    state.courseLabel = extractedLabel;
    $('#cert-course-label').value = extractedLabel;

    const newSessionIds = new Set(extractedSessions.map(s => s.id));
    Object.keys(state.attendance).forEach(nif => {
      Object.keys(state.attendance[nif]).forEach(sessId => {
        if (!newSessionIds.has(sessId)) delete state.attendance[nif][sessId];
      });
    });
    state.participants.forEach(p => {
      if (!state.attendance[p.nif]) state.attendance[p.nif] = {};
      extractedSessions.forEach(s => { state.attendance[p.nif][s.id] = true; });
    });

    $('#cert-extracted-info').style.display = 'block';
    const mc = extractedModules.length - 1, sc = extractedSessions.length;
    $('#cert-course-status').textContent = `Extraídos: ${mc} módulo(s), ${sc} sesion(es)`;
    renderModules(); renderSessions(); saveState();
  }

  function parseInput() {
    const text = state.rawInput;
    const lines = text.split('\n').filter(l => l.trim() !== '');
    state.participants = [];
    lines.forEach(line => {
      if (!/[a-zA-Z]/.test(line)) return;
      let cleanLine = line.trim();
      if (cleanLine.startsWith('|')) cleanLine = cleanLine.substring(1);
      if (cleanLine.endsWith('|')) cleanLine = cleanLine.substring(0, cleanLine.length - 1);
      let cols = [];
      const pipeCount = (cleanLine.match(/\|/g) || []).length;
      if (pipeCount >= 2) cols = cleanLine.split('|');
      else {
        cols = cleanLine.split('\t');
        if (cols.length < 2) cols = cleanLine.split('   ');
      }
      cols = cols.map(c => c.replace(/\|/g, '').trim());
      if (cols.length >= 2) {
        if (cols[0].toLowerCase().includes('nif') || cols[1].toLowerCase().includes('apellidos')) return;
        const p = {
          nif: cols[0] || '',
          surname: cols[1] || '',
          name: cols[2] || '',
          email: cols[4] || '',
          full: (cols[1] || '') + ', ' + (cols[2] || ''),
          sub: (cols[0] || '') + (cols[4] ? ', ' + cols[4] : '')
        };
        if (p.surname || p.name) {
          state.participants.push(p);
          if (!state.attendance[p.nif]) {
            state.attendance[p.nif] = {};
            state.sessions.forEach(s => state.attendance[p.nif][s.id] = true);
          }
          if (!state.moduleCompletion[p.nif]) state.moduleCompletion[p.nif] = {};
        }
      }
    });
    $('#cert-pax-count').textContent = `${state.participants.length} participantes detectados`;
    saveState();
  }

  // ── MODULES UI ──
  function renderModules() {
    const container = $('#cert-modules-list');
    if (!container) return;
    container.innerHTML = '';
    state.modules.forEach((mod, idx) => {
      if (mod.type === 'calculated') return;
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <input type="text" value="${Utils.esc(mod.name)}" data-idx="${idx}" data-field="name" style="width: 100px;" placeholder="Nombre">
        <input type="number" value="${mod.hours}" data-idx="${idx}" data-field="hours" style="width: 80px;" placeholder="Horas">
        <label style="display:flex; align-items:center; margin:0; gap:5px; cursor:pointer; text-transform:none; font-size:0.8rem;">
          <input type="checkbox" ${mod.required ? 'checked' : ''} data-idx="${idx}" data-field="required"> Activado
        </label>
        <button class="icon-btn remove" data-idx="${idx}" data-action="remove-module">
          <svg width="18" height="18"><use href="#icon-trash"></use></svg>
        </button>
      `;
      container.appendChild(div);
    });
    container.querySelectorAll('input[data-field]').forEach(input => {
      input.addEventListener('change', () => {
        const idx = +input.dataset.idx;
        const f = input.dataset.field;
        const val = f === 'required' ? input.checked : (f === 'hours' ? parseFloat(input.value) : input.value);
        state.modules[idx][f] = val;
        saveState();
      });
    });
    container.querySelectorAll('[data-action="remove-module"]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.modules.splice(+btn.dataset.idx, 1);
        renderModules(); saveState();
      });
    });
  }

  function addModule() {
    state.modules.push({ id: 'mod_' + Date.now(), name: 'NUEVO', hours: 2, required: true });
    renderModules(); saveState();
  }

  // ── SESSIONS UI ──
  function renderSessions() {
    const container = $('#cert-sessions-list');
    if (!container) return;
    container.innerHTML = '';
    state.sessions.forEach((sess, idx) => {
      const displayDate = Utils.formatCustomDate(sess.rawDate);
      const isLast = idx === state.sessions.length - 1;
      const div = document.createElement('div');
      div.className = 'list-item session-row';
      div.style.gap = '10px';
      div.innerHTML = `
        <span style="font-weight:bold; color:var(--text-muted)">#${idx + 1}</span>
        <div class="input-icon-wrapper" style="flex:1;">
          <input type="text" value="${Utils.esc(displayDate)}" data-idx="${idx}" data-action="parse-date">
          <input type="date" data-idx="${idx}" data-role="date-picker" value="${sess.rawDate}" style="position:absolute; visibility:hidden; width:0; height:0;">
          <div class="input-icon" data-idx="${idx}" data-action="trigger-date">
            <svg width="16" height="16"><use href="#icon-calendar"></use></svg>
          </div>
        </div>
        <div class="input-icon-wrapper" style="flex:1;">
          <input type="text" value="${Utils.esc(sess.start)}" data-idx="${idx}" data-action="parse-time-start">
          <input type="time" data-idx="${idx}" data-role="time-picker-start" value="${sess.start}" style="position:absolute; visibility:hidden; width:0; height:0;">
          <div class="input-icon" data-idx="${idx}" data-action="trigger-time-start">
            <svg width="16" height="16"><use href="#icon-clock"></use></svg>
          </div>
        </div>
        <div class="input-icon-wrapper" style="flex:1;">
          <input type="text" value="${Utils.esc(sess.end)}" data-idx="${idx}" data-action="parse-time-end" ${isLast ? 'data-tab-new="1"' : ''}>
          <input type="time" data-idx="${idx}" data-role="time-picker-end" value="${sess.end}" style="position:absolute; visibility:hidden; width:0; height:0;">
          <div class="input-icon" data-idx="${idx}" data-action="trigger-time-end">
            <svg width="16" height="16"><use href="#icon-clock"></use></svg>
          </div>
        </div>
        <button class="icon-btn add" data-idx="${idx}" data-action="add-session-after" title="Insertar sesión">
          <svg width="18" height="18"><use href="#icon-plus"></use></svg>
        </button>
        <button class="icon-btn remove" data-idx="${idx}" data-action="remove-session" title="Eliminar sesión">
          <svg width="18" height="18"><use href="#icon-trash"></use></svg>
        </button>
      `;
      container.appendChild(div);
    });

    container.querySelectorAll('input[data-action]').forEach(input => {
      input.addEventListener('focus', () => input.select());
      input.addEventListener('change', () => {
        const idx = +input.dataset.idx;
        const action = input.dataset.action;
        if (action === 'parse-date') parseDateInput(idx, input.value);
        else if (action === 'parse-time-start') parseTimeField(idx, 'start', input.value);
        else if (action === 'parse-time-end') parseTimeField(idx, 'end', input.value);
      });
      if (input.dataset.tabNew === '1') {
        input.addEventListener('keydown', e => {
          if (e.key === 'Tab' && !e.shiftKey) {
            e.preventDefault();
            const idx = +input.dataset.idx;
            parseTimeField(idx, 'end', input.value);
            addSession();
            setTimeout(() => {
              const lastInputs = container.querySelectorAll('.session-row:last-child input[type="text"]');
              if (lastInputs.length > 0) lastInputs[0].focus();
            }, 50);
          }
        });
      }
    });

    container.querySelectorAll('input[type="date"][data-role], input[type="time"][data-role]').forEach(input => {
      input.addEventListener('change', () => {
        const idx = +input.dataset.idx;
        const role = input.dataset.role;
        if (role === 'date-picker') {
          updateSession(idx, 'rawDate', input.value);
          updateSessionInputs(idx);
        }
        else if (role === 'time-picker-start') parseTimeField(idx, 'start', input.value);
        else if (role === 'time-picker-end') parseTimeField(idx, 'end', input.value);
      });
    });

    container.querySelectorAll('[data-action="trigger-date"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const picker = container.querySelector(`input[data-role="date-picker"][data-idx="${btn.dataset.idx}"]`);
        if (picker?.showPicker) picker.showPicker(); else picker?.click();
      });
    });
    container.querySelectorAll('[data-action^="trigger-time"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const which = btn.dataset.action === 'trigger-time-start' ? 'start' : 'end';
        const picker = container.querySelector(`input[data-role="time-picker-${which}"][data-idx="${btn.dataset.idx}"]`);
        if (picker?.showPicker) picker.showPicker(); else picker?.click();
      });
    });
    container.querySelectorAll('[data-action="add-session-after"]').forEach(btn => {
      btn.addEventListener('click', () => addSessionAfter(+btn.dataset.idx));
    });
    container.querySelectorAll('[data-action="remove-session"]').forEach(btn => {
      btn.addEventListener('click', () => removeSession(+btn.dataset.idx));
    });
  }

  function addSession(isFirst = false) {
    const now = new Date();
    let defaultDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    let defaultStart = '16:00', defaultEnd = '18:00';
    if (!isFirst && state.sessions.length > 0) {
      const prev = state.sessions[state.sessions.length - 1];
      defaultStart = prev.start; defaultEnd = prev.end; defaultDate = prev.rawDate;
    }
    createSession(defaultDate, defaultStart, defaultEnd);
  }

  function addSessionAfter(idx) {
    const cur = state.sessions[idx];
    createSession(cur.rawDate, cur.start, cur.end, idx + 1);
  }

  function createSession(date, start, end, insertAt = -1) {
    const newSess = {
      id: 'sess_' + Date.now() + Math.random(),
      rawDate: date, dateStr: Utils.formatCustomDate(date),
      start, end
    };
    if (insertAt === -1) state.sessions.push(newSess);
    else state.sessions.splice(insertAt, 0, newSess);
    state.participants.forEach(p => {
      if (!state.attendance[p.nif]) state.attendance[p.nif] = {};
      state.attendance[p.nif][newSess.id] = true;
    });
    renderSessions(); saveState();
  }

  function parseDateInput(idx, val) {
    const currentYear = new Date().getFullYear();
    let parsed = null;
    val = String(val).toLowerCase().trim();
    const mIdx = Utils.MESES_CORTOS.findIndex(m => val.includes(m));
    if (mIdx !== -1) {
      const dayMatch = val.match(/\d+/);
      if (dayMatch) parsed = new Date(currentYear, mIdx, parseInt(dayMatch[0]));
    } else {
      const parts = val.split(/[\/\-]/);
      if (parts.length >= 2) parsed = new Date(currentYear, parseInt(parts[1]) - 1, parseInt(parts[0]));
    }
    if (parsed && !isNaN(parsed)) {
      parsed.setHours(12, 0, 0, 0);
      const iso = parsed.toISOString().split('T')[0];
      updateSession(idx, 'rawDate', iso);
      updateSessionInputs(idx);
    } else {
      updateSessionInputs(idx);
    }
  }

  function parseTimeField(idx, field, val) {
    val = String(val).trim().replace(':', '');
    let formatted = null;
    if (/^\d{1,2}$/.test(val)) formatted = val.padStart(2, '0') + ':00';
    else if (/^\d{3}$/.test(val)) formatted = '0' + val[0] + ':' + val.substring(1);
    else if (/^\d{4}$/.test(val)) formatted = val.substring(0, 2) + ':' + val.substring(2);
    if (!formatted) { updateSessionInputs(idx); return; }
    updateSession(idx, field, formatted);
    updateSessionInputs(idx);
  }

  // Refresca los valores de los inputs de UNA fila de sesión, sin reconstruir el DOM.
  // Esto preserva el foco para que el Tab funcione tras editar.
  function updateSessionInputs(idx) {
    const sess = state.sessions[idx];
    if (!sess) return;
    const list = $('#cert-sessions-list');
    if (!list) return;
    const dateText = list.querySelector(`input[data-action="parse-date"][data-idx="${idx}"]`);
    if (dateText) dateText.value = Utils.formatCustomDate(sess.rawDate);
    const datePicker = list.querySelector(`input[data-role="date-picker"][data-idx="${idx}"]`);
    if (datePicker) datePicker.value = sess.rawDate;
    const startText = list.querySelector(`input[data-action="parse-time-start"][data-idx="${idx}"]`);
    if (startText) startText.value = sess.start;
    const startPicker = list.querySelector(`input[data-role="time-picker-start"][data-idx="${idx}"]`);
    if (startPicker) startPicker.value = sess.start;
    const endText = list.querySelector(`input[data-action="parse-time-end"][data-idx="${idx}"]`);
    if (endText) endText.value = sess.end;
    const endPicker = list.querySelector(`input[data-role="time-picker-end"][data-idx="${idx}"]`);
    if (endPicker) endPicker.value = sess.end;
  }

  function removeSession(idx) {
    state.sessions.splice(idx, 1);
    renderSessions(); saveState();
  }

  function updateSession(idx, field, value) {
    state.sessions[idx][field] = value;
    if (field === 'rawDate') state.sessions[idx].dateStr = Utils.formatCustomDate(value);
    saveState();
  }

  // ── CHECKLIST ──
  function renderChecklist() {
    const thead = $('#cert-checklist-header');
    const tbody = $('#cert-checklist-body');
    if (!thead || !tbody) return;

    let totalSessionMinutes = 0;
    state.sessions.forEach(s => totalSessionMinutes += Utils.durationMin(s.start, s.end));
    const minPresencialMinutes = Math.floor(totalSessionMinutes * 0.85);

    $('#cert-total-session-hours').textContent = Utils.formatHM(totalSessionMinutes) + ' h';
    $('#cert-min-presencial-hours').textContent = Utils.formatHM(minPresencialMinutes) + ' h';

    const activeModules = state.modules.filter(m => m.type !== 'calculated' && m.required);

    // Contar participantes con SI en CERTIFICA
    const numCertifica = state.participants.filter(p => {
      let userMinutes = 0;
      state.sessions.forEach(s => {
        if (state.attendance[p.nif]?.[s.id]) userMinutes += Utils.durationMin(s.start, s.end);
      });
      let passed = userMinutes >= minPresencialMinutes;
      activeModules.forEach(m => { if (!state.moduleCompletion[p.nif]?.[m.id]) passed = false; });
      return passed;
    }).length;

    // Contar checkboxes de aprobación marcados
    const numApproved = state.participants.filter(p => state.rowApproval[p.nif]).length;

    // Determinar clase CSS para el indicador de ordenamiento
    const sortClass = state.sortDirection === 'asc' ? 'sort-asc' : state.sortDirection === 'desc' ? 'sort-desc' : '';

    // Construir encabezados con data-col-key para identificar columnas
    let headerHTML = `
      <th data-col-key="approval" class="tac th-toggle ${state.hiddenCols['approval'] ? 'col-hidden' : ''}" data-toggle="approval" title="Marcar/desmarcar todos">
        ✓<br><small style="font-weight:400;">(${numApproved})</small>
      </th>
      <th data-col-key="participant" class="sortable ${sortClass} ${state.hiddenCols['participant'] ? 'col-hidden' : ''}" data-sort-participants>Participante<br><small style="font-weight:400;">(${state.participants.length})</small></th>
      <th data-col-key="certifica" class="tac ${state.hiddenCols['certifica'] ? 'col-hidden' : ''}">CERTIFICA<br><small style="font-weight:400;">(${numCertifica})</small></th>
      <th data-col-key="horas" class="tac ${state.hiddenCols['horas'] ? 'col-hidden' : ''}">Horas</th>
    `;
    activeModules.forEach(m => {
      const numChecked = state.participants.filter(p => state.moduleCompletion[p.nif]?.[m.id]).length;
      const allChecked = state.participants.length > 0 && numChecked === state.participants.length;
      const icon = allChecked ? '☑' : '☐';
      const iconColor = allChecked ? 'var(--accent)' : 'var(--text-muted)';
      const colKey = 'module_' + m.id;
      headerHTML += `<th data-col-key="${colKey}" class="module-header th-toggle ${state.hiddenCols[colKey] ? 'col-hidden' : ''}" data-toggle="module" data-id="${Utils.esc(m.id)}" title="Marcar/desmarcar todos">
        ${Utils.esc(m.name)}<br><small>${m.hours}h</small><br><small style="font-weight:400;">(${numChecked})</small>
        <div class="toggle-all-indicator" style="color:${iconColor}">${icon} Todo</div>
      </th>`;
    });
    state.sessions.forEach((s, idx) => {
      const numChecked = state.participants.filter(p => state.attendance[p.nif]?.[s.id]).length;
      const allChecked = state.participants.length > 0 && numChecked === state.participants.length;
      const icon = allChecked ? '☑' : '☐';
      const iconColor = allChecked ? 'var(--accent)' : 'var(--text-muted)';
      const colKey = 'session_' + s.id;
      headerHTML += `<th data-col-key="${colKey}" class="th-toggle ${state.hiddenCols[colKey] ? 'col-hidden' : ''}" data-toggle="session" data-id="${Utils.esc(s.id)}" title="Marcar/desmarcar todos">
        ${Utils.esc(Utils.formatCustomDate(s.rawDate))}<br><small>${Utils.formatHM(Utils.durationMin(s.start, s.end))}</small><br><small style="font-weight:400;">(${numChecked})</small>
        <div class="toggle-all-indicator" style="color:${iconColor}">${icon} Todo</div>
      </th>`;
    });
    thead.innerHTML = headerHTML;

    // Ordenar participantes si es necesario
    let sortedParticipants = [...state.participants];
    if (state.sortDirection) {
      sortedParticipants.sort((a, b) => {
        let nameA, nameB;

        if (state.nameOrder === 'surname-first') {
          // Ordenar por apellido primero
          nameA = `${a.surname} ${a.name}`.toLowerCase().trim();
          nameB = `${b.surname} ${b.name}`.toLowerCase().trim();
        } else {
          // Ordenar por nombre primero
          nameA = `${a.name} ${a.surname}`.toLowerCase().trim();
          nameB = `${b.name} ${b.surname}`.toLowerCase().trim();
        }

        if (state.sortDirection === 'asc') {
          return nameA.localeCompare(nameB, 'es', { sensitivity: 'base' });
        } else {
          return nameB.localeCompare(nameA, 'es', { sensitivity: 'base' });
        }
      });
    }

    tbody.innerHTML = '';
    sortedParticipants.forEach(p => {
      const tr = document.createElement('tr');
      tr.dataset.nif = p.nif;

      // Aplicar clase si está aprobado
      if (state.rowApproval[p.nif]) {
        tr.classList.add('row-approved');
      }

      let userMinutes = 0;
      state.sessions.forEach(s => {
        if (state.attendance[p.nif]?.[s.id]) userMinutes += Utils.durationMin(s.start, s.end);
      });
      let passed = userMinutes >= minPresencialMinutes;
      activeModules.forEach(m => { if (!state.moduleCompletion[p.nif]?.[m.id]) passed = false; });
      const statusHtml = passed ? `<span class="status-pass">SI</span>` : `<span class="status-fail">=NO=</span>`;

      // Formatear nombre según el orden configurado
      let displayName = p.full;
      if (state.nameOrder === 'name-first') {
        // Cambiar de "Apellidos, Nombre" a "Nombre Apellidos"
        if (p.surname && p.name) {
          displayName = `${p.name} ${p.surname}`;
        }
      }

      const isApproved = state.rowApproval[p.nif] || false;
      let rowHTML = `
        <td data-col-key="approval" class="tac ${state.hiddenCols['approval'] ? 'col-hidden' : ''}">
          <input type="checkbox" ${isApproved ? 'checked' : ''} data-nif="${Utils.esc(p.nif)}" data-action="toggle-approval" style="cursor:pointer; width:18px; height:18px;">
        </td>
        <td data-col-key="participant" class="${state.hiddenCols['participant'] ? 'col-hidden' : ''}" tabindex="0" data-action="name-cell" data-nif="${Utils.esc(p.nif)}" style="cursor:pointer;">
          <div style="font-weight:bold; color: white;">${Utils.esc(displayName)}</div>
          <div style="font-size:0.75em; color:var(--text-muted)">${Utils.esc(p.sub)}</div>
        </td>
        <td data-col-key="certifica" class="tac ${state.hiddenCols['certifica'] ? 'col-hidden' : ''}">${statusHtml}</td>
        <td data-col-key="horas" class="tac mono ${state.hiddenCols['horas'] ? 'col-hidden' : ''}">${Utils.formatHM(userMinutes)}</td>
      `;
      activeModules.forEach(m => {
        const checked = state.moduleCompletion[p.nif]?.[m.id] || false;
        const colKey = 'module_' + m.id;
        rowHTML += `<td data-col-key="${colKey}" class="module-cell ${state.hiddenCols[colKey] ? 'col-hidden' : ''}">
          <div class="grid-check ${checked ? 'check-active' : 'check-inactive'}" tabindex="0"
            data-type="module" data-nif="${Utils.esc(p.nif)}" data-id="${Utils.esc(m.id)}">▒▒▒</div>
        </td>`;
      });
      state.sessions.forEach(s => {
        const checked = state.attendance[p.nif]?.[s.id] || false;
        const colKey = 'session_' + s.id;
        rowHTML += `<td data-col-key="${colKey}" class="${state.hiddenCols[colKey] ? 'col-hidden' : ''}">
          <div class="grid-check ${checked ? 'check-active' : 'check-inactive'}" tabindex="0"
            data-type="session" data-nif="${Utils.esc(p.nif)}" data-id="${Utils.esc(s.id)}">██████</div>
        </td>`;
      });
      tr.innerHTML = rowHTML;
      tbody.appendChild(tr);
    });

    // Bind toggle-all
    thead.querySelectorAll('[data-toggle]').forEach(th => {
      th.addEventListener('click', () => {
        if (th.dataset.toggle === 'module') toggleAllModule(th.dataset.id);
        else if (th.dataset.toggle === 'session') toggleAllSession(th.dataset.id);
        else if (th.dataset.toggle === 'approval') toggleAllApproval();
      });
    });
    // Bind sort participantes
    const sortHeader = thead.querySelector('[data-sort-participants]');
    if (sortHeader) {
      sortHeader.addEventListener('click', toggleSortParticipants);
    }
    // Bind cell clicks
    tbody.querySelectorAll('.grid-check').forEach(el => {
      el.addEventListener('click', () => toggleGridCheck(el));
    });
    // Bind approval checkboxes
    tbody.querySelectorAll('input[data-action="toggle-approval"]').forEach(chk => {
      chk.addEventListener('change', e => {
        const nif = e.target.dataset.nif;
        state.rowApproval[nif] = e.target.checked;
        const row = tbody.querySelector(`tr[data-nif="${nif}"]`);
        if (row) {
          if (e.target.checked) row.classList.add('row-approved');
          else row.classList.remove('row-approved');
        }
        saveState();
        renderChecklist(); // Re-renderizar para actualizar el contador
      });
    });
    // Bind name cells para navegación
    tbody.querySelectorAll('td[data-action="name-cell"]').forEach(cell => {
      cell.addEventListener('click', () => activateNameCell(cell.dataset.nif));
      cell.addEventListener('focus', () => activateNameCell(cell.dataset.nif));
    });

    // Renderizar menú de visibilidad de columnas
    renderColumnVisibilityMenu();
  }

  function toggleAllApproval() {
    const allChecked = state.participants.every(p => state.rowApproval[p.nif]);
    const newVal = !allChecked;
    state.participants.forEach(p => { state.rowApproval[p.nif] = newVal; });
    renderChecklist(); saveState();
  }

  function activateNameCell(nif) {
    // Remover clase activa de todas las filas
    $('#cert-checklist-body').querySelectorAll('tr').forEach(tr => tr.classList.remove('row-name-active'));
    // Agregar a la fila actual
    const row = $('#cert-checklist-body').querySelector(`tr[data-nif="${nif}"]`);
    if (row) row.classList.add('row-name-active');
  }

  function navigateNameCells(direction) {
    const tbody = $('#cert-checklist-body');
    const activeRow = tbody.querySelector('tr.row-name-active');
    if (!activeRow) {
      // Si no hay ninguna activa, activar la primera
      const firstCell = tbody.querySelector('td[data-action="name-cell"]');
      if (firstCell) {
        activateNameCell(firstCell.dataset.nif);
        firstCell.focus();
      }
      return;
    }
    const allRows = Array.from(tbody.querySelectorAll('tr'));
    const currentIdx = allRows.indexOf(activeRow);
    let targetIdx = currentIdx + direction;
    if (targetIdx < 0 || targetIdx >= allRows.length) return;
    const targetRow = allRows[targetIdx];
    const targetCell = targetRow.querySelector('td[data-action="name-cell"]');
    if (targetCell) {
      activateNameCell(targetCell.dataset.nif);
      targetCell.focus();
      targetCell.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function renderColumnVisibilityMenu() {
    const menu = $('#cert-col-visibility-menu');
    if (!menu) return;

    // Construir lista de columnas
    const columns = [
      { key: 'approval', label: '✓ Aprobación' },
      { key: 'participant', label: 'Participante' },
      { key: 'certifica', label: 'CERTIFICA' },
      { key: 'horas', label: 'Horas' }
    ];
    const activeModules = state.modules.filter(m => m.type !== 'calculated' && m.required);
    activeModules.forEach(m => {
      columns.push({ key: 'module_' + m.id, label: m.name + ' (módulo)' });
    });
    state.sessions.forEach((s, idx) => {
      columns.push({ key: 'session_' + s.id, label: `Sesión ${idx + 1}` });
    });

    menu.innerHTML = columns.map(col => {
      const checked = !state.hiddenCols[col.key];
      return `<label class="col-vis-item">
        <input type="checkbox" ${checked ? 'checked' : ''} data-col-key="${col.key}">
        <span>${Utils.esc(col.label)}</span>
      </label>`;
    }).join('');

    menu.querySelectorAll('input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', e => {
        const key = e.target.dataset.colKey;
        state.hiddenCols[key] = !e.target.checked;
        applyColumnVisibility();
        saveState();
      });
    });
  }

  function applyColumnVisibility() {
    const table = $('#cert-checklist-table');
    if (!table) return;
    // Aplicar clases a encabezados y celdas
    Object.keys(state.hiddenCols).forEach(key => {
      const isHidden = state.hiddenCols[key];
      table.querySelectorAll(`[data-col-key="${key}"]`).forEach(el => {
        if (isHidden) el.classList.add('col-hidden');
        else el.classList.remove('col-hidden');
      });
    });
  }

  function toggleGridCheck(el) {
    const type = el.dataset.type, nif = el.dataset.nif, id = el.dataset.id;
    let val;
    if (type === 'module') {
      val = !state.moduleCompletion[nif]?.[id];
      if (!state.moduleCompletion[nif]) state.moduleCompletion[nif] = {};
      state.moduleCompletion[nif][id] = val;
    } else {
      val = !state.attendance[nif]?.[id];
      if (!state.attendance[nif]) state.attendance[nif] = {};
      state.attendance[nif][id] = val;
    }
    renderChecklist(); saveState();
    const newEl = $(`.grid-check[data-nif="${nif}"][data-id="${id}"]`);
    if (newEl) newEl.focus();
  }

  function handleGridNav(e) {
    // Navegación en celdas de nombre
    if (e.target.dataset?.action === 'name-cell') {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        navigateNameCells(1);
        return;
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        navigateNameCells(-1);
        return;
      } else if (e.key === ' ') {
        e.preventDefault();
        // Toggle checkbox de aprobación de la fila activa
        const nif = e.target.dataset.nif;
        const checkbox = $('#cert-checklist-body').querySelector(`input[data-action="toggle-approval"][data-nif="${nif}"]`);
        if (checkbox) {
          checkbox.checked = !checkbox.checked;
          state.rowApproval[nif] = checkbox.checked;
          const row = checkbox.closest('tr');
          if (row) {
            if (checkbox.checked) row.classList.add('row-approved');
            else row.classList.remove('row-approved');
          }
          saveState();
          renderChecklist();
          // Restaurar el foco en la celda del nombre
          setTimeout(() => {
            const nameCell = $('#cert-checklist-body').querySelector(`td[data-action="name-cell"][data-nif="${nif}"]`);
            if (nameCell) {
              nameCell.focus();
              activateNameCell(nif);
            }
          }, 0);
        }
        return;
      }
    }

    // Navegación en grid-check (sesiones y módulos)
    if (!e.target.classList?.contains('grid-check')) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); toggleGridCheck(e.target); return;
    }
    const current = e.target;
    const td = current.parentElement, tr = td.parentElement;
    const colIdx = Array.from(tr.children).indexOf(td);
    const rowIdx = Array.from(tr.parentElement.children).indexOf(tr);
    let nextEl = null;
    if (e.key === 'ArrowRight') nextEl = tr.children[colIdx + 1]?.querySelector('.grid-check');
    else if (e.key === 'ArrowLeft') nextEl = tr.children[colIdx - 1]?.querySelector('.grid-check');
    else if (e.key === 'ArrowDown') nextEl = tr.parentElement.children[rowIdx + 1]?.children[colIdx]?.querySelector('.grid-check');
    else if (e.key === 'ArrowUp') nextEl = tr.parentElement.children[rowIdx - 1]?.children[colIdx]?.querySelector('.grid-check');
    if (nextEl) { e.preventDefault(); nextEl.focus(); }
  }

  function toggleAllModule(modId) {
    const allChecked = state.participants.every(p => state.moduleCompletion[p.nif]?.[modId]);
    const newVal = !allChecked;
    state.participants.forEach(p => {
      if (!state.moduleCompletion[p.nif]) state.moduleCompletion[p.nif] = {};
      state.moduleCompletion[p.nif][modId] = newVal;
    });
    renderChecklist(); saveState();
  }
  function toggleAllSession(sessId) {
    const allChecked = state.participants.every(p => state.attendance[p.nif]?.[sessId]);
    const newVal = !allChecked;
    state.participants.forEach(p => {
      if (!state.attendance[p.nif]) state.attendance[p.nif] = {};
      state.attendance[p.nif][sessId] = newVal;
    });
    renderChecklist(); saveState();
  }

  function toggleSortParticipants() {
    // Ciclo: null -> asc -> desc -> null
    if (state.sortDirection === null) {
      state.sortDirection = 'asc';
    } else if (state.sortDirection === 'asc') {
      state.sortDirection = 'desc';
    } else {
      state.sortDirection = null;
    }
    renderChecklist();
    saveState();
  }

  function toggleNameOrder() {
    state.nameOrder = state.nameOrder === 'surname-first' ? 'name-first' : 'surname-first';
    updateNameOrderLabel();
    renderChecklist();
    saveState();
  }

  function updateNameOrderLabel() {
    const label = $('#cert-name-order-label');
    if (label) {
      label.textContent = state.nameOrder === 'surname-first' ? 'Apellidos, Nombre' : 'Nombre Apellidos';
    }
  }

  // ── EXPORT (Markdown idéntico al original) ──
  function generateMarkdown() {
    const label = $('#cert-course-label')?.value || state.courseLabel || '';
    const totalSessionMinutes = state.sessions.reduce((acc, s) => acc + Utils.durationMin(s.start, s.end), 0);
    const minPresencial = Math.floor(totalSessionMinutes * 0.85);
    const activeModules = state.modules.filter(m => m.type !== 'calculated' && m.required);
    const totalModuleHours = activeModules.reduce((acc, m) => acc + m.hours * 60, 0);
    const totalPossibleMinutes = totalSessionMinutes + totalModuleHours;
    const minPresencialFormatted = Utils.formatHM(minPresencial);

    const matrix = [];
    let r1 = ['|', '', label, '', ''];
    activeModules.forEach(() => r1.push(''));
    state.sessions.forEach(s => r1.push(Utils.formatCustomDate(s.rawDate)));
    matrix.push(r1);

    let r2 = ['|', '---', '', '', ''];
    activeModules.forEach(() => r2.push('---'));
    state.sessions.forEach(() => r2.push('------'));
    matrix.push(r2);

    let r3 = ['|', '', '', '', ''];
    activeModules.forEach(() => r3.push(''));
    state.sessions.forEach(s => r3.push(s.start));
    matrix.push(r3);

    let r4 = ['|', '', '', 'CERTI', 'PRESE'];
    activeModules.forEach(m => r4.push(m.name));
    state.sessions.forEach(s => r4.push(s.end));
    matrix.push(r4);

    let r5 = ['|', 'Nº', 'APELLIDOS', Utils.formatHM(totalPossibleMinutes), minPresencialFormatted];
    activeModules.forEach(m => r5.push(m.hours.toString()));
    state.sessions.forEach(s => r5.push(Utils.formatHM(Utils.durationMin(s.start, s.end))));
    matrix.push(r5);

    let dataRows = [];
    let numCertify = 0;
    let passedParticipants = [];
    let failedParticipants = [];

    state.participants.forEach((p, idx) => {
      let row = ['|', (idx + 1).toString(), p.full];
      let userMinutes = 0;
      state.sessions.forEach(s => {
        if (state.attendance[p.nif]?.[s.id]) userMinutes += Utils.durationMin(s.start, s.end);
      });
      let passed = userMinutes >= minPresencial;
      activeModules.forEach(m => { if (!state.moduleCompletion[p.nif]?.[m.id]) passed = false; });
      if (passed) { numCertify++; passedParticipants.push(p.full); }
      else {
        const reason = (userMinutes < minPresencial) ? "No finaliza la actividad" : "No entrega los trabajos obligatorios";
        failedParticipants.push({ name: p.full, reason });
      }
      row.push(passed ? '' : '=NO=');
      let hStr = Utils.formatHM(userMinutes);
      if (userMinutes < minPresencial) hStr = `=${hStr}=`;
      row.push(hStr);
      activeModules.forEach(m => row.push(state.moduleCompletion[p.nif]?.[m.id] ? '▒▒▒' : ''));
      state.sessions.forEach(s => row.push(state.attendance[p.nif]?.[s.id] ? '██████' : ''));
      dataRows.push(row);
    });

    const allRows = [...matrix, ...dataRows];
    const colWidths = new Array(allRows[0].length).fill(0);
    allRows.forEach((row, rIdx) => {
      row.forEach((cell, i) => {
        if (i === 0) return;
        let len = (cell || '').length;
        if (i === 3 || i === 4) { if (len < 7) len = 7; }
        if (rIdx !== 1) len += 2;
        if (len > colWidths[i]) colWidths[i] = len;
      });
    });

    let rOver = ['|'];
    for (let i = 1; i < colWidths.length; i++) {
      const w = colWidths[i] || 3;
      rOver.push('━'.repeat(w) + '|');
    }
    matrix.splice(5, 0, rOver);

    let rSep2 = ['|'];
    for (let i = 1; i < colWidths.length; i++) {
      const w = colWidths[i] || 3;
      rSep2.push('━'.repeat(w) + '|');
    }
    let rCount = ['|', '', 'PARTICIPANTES / SESIÓN', '', ''];
    activeModules.forEach(() => rCount.push(''));
    state.sessions.forEach(s => {
      const cnt = state.participants.filter(p => state.attendance[p.nif]?.[s.id]).length;
      rCount.push(cnt.toString());
    });

    let md = '';
    const finalRows = [...matrix, ...dataRows, rSep2, rCount];
    const pad = (s, w) => { s = s || ''; const d = w - s.length; return d <= 0 ? s : s + ' '.repeat(d); };
    const center = (s, w) => { s = s || ''; const d = w - s.length; if (d <= 0) return s; const l = Math.floor(d / 2); return ' '.repeat(l) + s + ' '.repeat(d - l); };

    finalRows.forEach((row, rowIdx) => {
      let rowStr = row[0];
      for (let i = 1; i < row.length; i++) {
        let cell = row[i] || '';
        let w = colWidths[i];
        let isSep = (rowIdx === 1);
        let isSep2 = (cell.startsWith('━'));
        if (isSep) rowStr += '-'.repeat(w) + '|';
        else if (isSep2) rowStr += '━'.repeat(w) + '|';
        else {
          let content = cell ? (' ' + cell + ' ') : '';
          if (content.length === 0) rowStr += ' '.repeat(w) + '|';
          else if (i === 1 || i === 2) rowStr += pad(content, w) + '|';
          else rowStr += center(content, w) + '|';
        }
      }
      md += rowStr + '\n';
    });

    const inscritos = state.participants.length;
    const percentVal = inscritos > 0 ? ((numCertify / inscritos) * 100).toFixed(2).replace('.', ',') : '0,00';
    const vals = [inscritos.toString(), numCertify.toString(), percentVal + '%'];
    const maxValLen = Math.max(...vals.map(v => v.length));
    md += `\n- Inscritos_ ➤ ${inscritos.toString().padStart(maxValLen, ' ')}`;
    md += `\n- Certifican ➤ ${numCertify.toString().padStart(maxValLen, ' ')}`;
    md += `\n- Porcentaje ➤ ${(percentVal + '%').padStart(maxValLen, ' ')}`;

    const nameWidth = colWidths[2] || 30;
    if (passedParticipants.length > 0) {
      md += '\n\n\n#### CERTIFICAN\n';
      passedParticipants.forEach(name => { md += `- ${name}\n`; });
    }
    if (failedParticipants.length > 0) {
      md += '\n#### =NO CERTIFICAN=\n\n';
      failedParticipants.forEach(f => {
        let nameStr = ' ' + f.name;
        md += '|' + nameStr.padEnd(nameWidth - 1) + ' | ' + f.reason + '\n';
      });
    }

    // Agregar tabla del Apartado 7 de la memoria
    md += '\n\n\n#### Apartado 7 de la memoria\n\n';
    const memTable = [];
    memTable.push(['REVISAR', 'Nº', 'DNI', 'APELLIDOS', 'NOMBRE', 'APL', 'HORAS']);
    memTable.push(['---', '---', '---', '---', '---', '---', '---']);

    state.participants.forEach((p, idx) => {
      let userMinutes = 0;
      state.sessions.forEach(s => {
        if (state.attendance[p.nif]?.[s.id]) userMinutes += Utils.durationMin(s.start, s.end);
      });

      // Determinar si certifica (mismo criterio que en la tabla principal)
      let passed = userMinutes >= minPresencial;
      activeModules.forEach(m => { if (!state.moduleCompletion[p.nif]?.[m.id]) passed = false; });

      // Columna REVISAR: "->" si NO certifica, vacío si SÍ certifica
      const revisar = passed ? '' : '->';

      // Determinar si entrega módulos (APL)
      let entregaApl = 'NO';
      activeModules.forEach(m => {
        if (state.moduleCompletion[p.nif]?.[m.id]) entregaApl = 'SÍ';
      });

      const horasStr = Utils.formatHM(userMinutes);

      memTable.push([
        revisar,
        (idx + 1).toString(),
        p.nif || '',
        p.surname || '',
        p.name || '',
        entregaApl,
        horasStr
      ]);
    });

    // Formatear tabla
    const colWidthsMem = memTable[0].map((_, colIdx) => {
      return Math.max(...memTable.map(row => (row[colIdx] || '').length));
    });

    md += memTable.map((row, rIdx) => {
      if (rIdx === 1) {
        return '| ' + row.map((cell, i) => '-'.repeat(colWidthsMem[i])).join(' | ') + ' |';
      }
      return '| ' + row.map((cell, i) => {
        const c = cell || '';
        return c.padEnd(colWidthsMem[i], ' ');
      }).join(' | ') + ' |';
    }).join('\n');

    $('#cert-markdown-result').textContent = md;
    return md;
  }

  function copyMarkdown() {
    const md = generateMarkdown();
    if (!md.trim()) { UI.toast('No hay contenido para copiar', 'warn'); return; }
    Utils.copyText(md).then(() => UI.toast('Copiado al portapapeles')).catch(() => {
      const el = $('#cert-markdown-result');
      const sel = window.getSelection(), range = document.createRange();
      range.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(range);
      UI.toast('Texto seleccionado — pulsa Ctrl+C', 'info');
    });
  }

  function exportState() {
    if (!state.participants.length && !state.sessions.length) {
      UI.toast('No hay datos para exportar', 'warn');
      return;
    }
    const exportData = {
      version: 1,
      exportDate: new Date().toISOString(),
      module: 'certificador',
      data: state
    };
    const json = JSON.stringify(exportData, null, 2);
    const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
    const filename = `certificador-estado-${timestamp}.json`;
    Utils.download(json, filename, 'application/json;charset=utf-8;');
    UI.toast('Estado exportado correctamente');
  }

  function importState() {
    const fileInput = $('#cert-file-import');
    if (!fileInput) return;

    fileInput.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const imported = JSON.parse(evt.target.result);

          // Validar estructura
          if (!imported.data || !imported.module || imported.module !== 'certificador') {
            UI.toast('Archivo no válido para este módulo', 'error');
            return;
          }

          const importedState = imported.data;

          // Validar que tiene la estructura mínima
          if (!isValidState(importedState)) {
            UI.toast('El archivo no contiene un estado válido', 'error');
            return;
          }

          // Asegurar campos nuevos
          if (!importedState.rowApproval) importedState.rowApproval = {};
          if (!importedState.hiddenCols) importedState.hiddenCols = {};
          if (importedState.sortDirection === undefined) importedState.sortDirection = null;
          if (!importedState.nameOrder) importedState.nameOrder = 'surname-first';

          // Reemplazar estado
          state = importedState;
          saveState();

          // Re-renderizar todo
          mount(_root);

          UI.toast(`Estado importado: ${state.participants.length} participantes, ${state.sessions.length} sesiones`);
        } catch (err) {
          console.error('Error al importar:', err);
          UI.toast('Error al leer el archivo: ' + err.message, 'error');
        } finally {
          fileInput.value = ''; // Reset input
        }
      };
      reader.readAsText(file);
    };

    fileInput.click();
  }

  function reset() {
    const btn = $('#cert-btn-reset'), label = $('#cert-btn-reset-label');
    if (!btn.classList.contains('pending')) {
      btn.classList.add('pending');
      label.textContent = '¿Confirmar?';
      _resetTimer = setTimeout(() => {
        btn.classList.remove('pending');
        label.textContent = 'Limpiar';
      }, 3000);
    } else {
      clearTimeout(_resetTimer);
      Store.clearNamespace(NS);
      state = {
        participants: [],
        modules: [{ id: 'pres', name: 'PRESE', hours: 0, required: false, type: 'calculated' }],
        sessions: [], attendance: {}, moduleCompletion: {},
        rawInput: '', rawCourse: '', courseLabel: '',
        nameOrder: 'surname-first',
        sortDirection: null,
        rowApproval: {},
        hiddenCols: {}
      };
      mount(_root); // Re-render
      UI.toast('Datos del Certificador limpiados', 'info');
    }
  }

  // ── Compartir / Importar ──
  function sharePart() {
    if (!state.participants.length) return UI.toast('No hay participantes que compartir', 'warn');
    Shared.publish('participants', state.participants.map(p => ({
      nif: p.nif, surname: p.surname, name: p.name, email: p.email
    })), ID);
    UI.toast(`${state.participants.length} participantes compartidos`);
  }
  function shareSessions() {
    if (!state.sessions.length) return UI.toast('No hay sesiones que compartir', 'warn');
    Shared.publish('sessions', state.sessions.map(s => ({
      rawDate: s.rawDate, start: s.start, end: s.end
    })), ID);
    UI.toast(`${state.sessions.length} sesiones compartidas`);
  }
  function shareLabel() {
    const lbl = $('#cert-course-label')?.value?.trim();
    if (!lbl) return UI.toast('No hay etiqueta que compartir', 'warn');
    Shared.publish('courseLabel', lbl, ID);
    UI.toast('Etiqueta compartida');
  }

  function importShared(kind) {
    const entry = Shared.get(kind);
    if (!entry || !entry.data) { UI.toast('No hay datos compartidos para importar', 'warn'); return; }
    if (kind === 'participants') {
      state.participants = entry.data.map(p => ({
        nif: p.nif || '', surname: p.surname || '', name: p.name || '',
        email: p.email || '',
        full: (p.surname || '') + ', ' + (p.name || ''),
        sub: (p.nif || '') + (p.email ? ', ' + p.email : '')
      }));
      state.participants.forEach(p => {
        if (!state.attendance[p.nif]) state.attendance[p.nif] = {};
        state.sessions.forEach(s => { if (state.attendance[p.nif][s.id] == null) state.attendance[p.nif][s.id] = true; });
        if (!state.moduleCompletion[p.nif]) state.moduleCompletion[p.nif] = {};
      });
      $('#cert-pax-count').textContent = `${state.participants.length} participantes detectados`;
      saveState(); UI.toast(`${state.participants.length} participantes importados`);
    } else if (kind === 'sessions') {
      state.sessions = entry.data.map(s => ({
        id: 'sess_' + Date.now() + Math.random(),
        rawDate: s.rawDate, dateStr: Utils.formatCustomDate(s.rawDate),
        start: s.start, end: s.end
      }));
      state.participants.forEach(p => {
        state.attendance[p.nif] = state.attendance[p.nif] || {};
        state.sessions.forEach(s => { state.attendance[p.nif][s.id] = true; });
      });
      $('#cert-extracted-info').style.display = 'block';
      renderSessions(); saveState();
      UI.toast(`${state.sessions.length} sesiones importadas`);
    } else if (kind === 'courseLabel') {
      state.courseLabel = entry.data;
      $('#cert-course-label').value = entry.data;
      $('#cert-extracted-info').style.display = 'block';
      saveState(); UI.toast('Etiqueta importada');
    }
  }

  // ── Lifecycle ──
  function mount(container) {
    _root = container;
    container.innerHTML = TEMPLATE;
    loadState();

    $('#cert-input-data').value = state.rawInput || '';
    $('#cert-input-course').value = state.rawCourse || '';
    $('#cert-course-label').value = state.courseLabel || '';
    if (state.modules.length > 1 || state.sessions.length > 0) {
      $('#cert-extracted-info').style.display = 'block';
    }
    if (state.sessions.length === 0) addSession(true);

    $('#cert-pax-count').textContent = `${state.participants.length} participantes detectados`;
    renderModules(); renderSessions();

    // Actualizar label del orden de nombre
    updateNameOrderLabel();

    // Listeners
    $$('.subtab-btn').forEach(b => b.addEventListener('click', () => switchSub(b.dataset.sub)));
    $('#cert-input-data').addEventListener('input', e => { state.rawInput = e.target.value; parseInput(); });
    $('#cert-input-course').addEventListener('input', e => { state.rawCourse = e.target.value; });
    $('#cert-input-course').addEventListener('paste', () => setTimeout(parseCourseData, 100));
    $('#cert-course-label').addEventListener('input', e => { state.courseLabel = e.target.value; saveState(); });
    $('#cert-add-module').addEventListener('click', addModule);
    $('#cert-add-session').addEventListener('click', () => addSession());
    $('#cert-btn-copy').addEventListener('click', copyMarkdown);
    $('#cert-btn-export-state').addEventListener('click', exportState);
    $('#cert-btn-import-state').addEventListener('click', importState);
    $('#cert-btn-reset').addEventListener('click', reset);
    $('#cert-share-participants').addEventListener('click', sharePart);
    $('#cert-share-sessions').addEventListener('click', shareSessions);
    $('#cert-share-label').addEventListener('click', shareLabel);
    $$('[data-import-shared]').forEach(b => b.addEventListener('click', () => importShared(b.dataset.importShared)));

    $('#cert-checklist-table').addEventListener('keydown', handleGridNav);
    $('#cert-toggle-name-order').addEventListener('click', toggleNameOrder);

    // Toggle columnas menu
    $('#cert-toggle-cols').addEventListener('click', e => {
      e.stopPropagation();
      const menu = $('#cert-col-visibility-menu');
      menu.classList.toggle('open');
    });
    // Cerrar menú al hacer clic fuera
    document.addEventListener('click', e => {
      const menu = $('#cert-col-visibility-menu');
      const btn = $('#cert-toggle-cols');
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('open');
      }
    });

    switchSub(_activeSubtab);
  }

  function unmount() {
    saveState();
    _root = null;
  }

  return {
    id: ID,
    label: 'Certificador',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>',
    mount, unmount,
  };
})();

// ═══════════════════════════════════════════════════════════
// MÓDULO 4: PARTICIPANTES Y TEMPORALIZACIÓN
// ═══════════════════════════════════════════════════════════
const moduleTempo = (() => {
  const ID = 'tempo';
  const NS = 'tempo';
  const CHAR_BLOCK = '-';

  let state = {
    excelInput: '',
    actaInput: '',
    codigo: '',
    modulos: {
      app: false, appName: 'Aplicación',   appH: 2, appDate: '',
      col: false, colName: 'Colaboración', colH: 2, colDate: '',
      ent: false, entName: 'Entornos',     entH: 2, entDate: ''
    },
    sessions: []
  };

  let _root = null;

  function setupModuleHandlers(key) {
    const chk = $(`#tempo-chk-${key}`);
    const name = $(`#tempo-name-${key}`);
    const val = $(`#tempo-val-${key}`);
    const dateRow = $(`#tempo-date-row-${key}`);
    const dateInput = $(`#tempo-date-${key}`);
    const dateTrigger = $(`#tempo-trigger-${key}`);

    chk.addEventListener('change', e => {
      state.modulos[key] = e.target.checked;
      name.disabled = !e.target.checked;
      val.disabled = !e.target.checked;
      dateRow.style.display = e.target.checked ? '' : 'none';
      if (!e.target.checked) {
        state.modulos[`${key}Date`] = '';
        dateInput.value = '';
      }
      saveState(); generate();
    });
    name.addEventListener('input', e => { state.modulos[`${key}Name`] = e.target.value; saveState(); generate(); });
    val.addEventListener('input', e => { state.modulos[`${key}H`] = Number(e.target.value); saveState(); generate(); });
    dateInput.addEventListener('focus', function () { this.select(); });
    dateInput.addEventListener('change', e => { state.modulos[`${key}Date`] = e.target.value; saveState(); generate(); });
    dateInput.addEventListener('blur', e => {
      const formatted = Utils.parseAndFormatDate(e.target.value);
      if (formatted !== e.target.value) {
        e.target.value = formatted;
        state.modulos[`${key}Date`] = formatted;
        saveState(); generate();

    });
    dateTrigger.addEventListener('change', e => {

      if (dateTrigger.showPicker) dateTrigger.showPicker(); else dateTrigger.click();

        input.addEventListener('blur', e => {

          if (f !== e.target.value) { e.target.value = f; updateSession(sess.id, field, f); }

        const trig = wrap.querySelector('[data-act="open-time"]');

          TIME_OPTIONS.forEach(t => {

      const endInput = el.querySelector('.t-end');
      if (isLast) {
        endInput.addEventListener('keydown', e => {

  }

  function parseActaToSessions(text) {
    if (!text || !text.trim()) return [];
    const tokenRe = /(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})|(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})|(\d{1,2}:\d{2})/g;
    const tokens = [];
    let m;
    while ((m = tokenRe.exec(text)) !== null) {
      if (m[1]) tokens.push({ type: 'date', value: m[1] });
      else if (m[2]) tokens.push({ type: 'date', value: m[2] });
      else if (m[3]) tokens.push({ type: 'time', value: m[3] });
    }
    const out = [];
    let i = 0;
    while (i < tokens.length) {
      if (tokens[i].type !== 'date') { i++; continue; }
      const dateTok = tokens[i].value;
      let start = '16:00', end = '19:00';
      let consumed = 1;
      if (tokens[i + 1] && tokens[i + 1].type === 'time') {
        start = tokens[i + 1].value;
        consumed = 2;
        if (tokens[i + 2] && tokens[i + 2].type === 'time') {
          end = tokens[i + 2].value;
          consumed = 3;
        }
      }
      out.push({
        id: Date.now() + Math.random() + out.length,
        date: Utils.parseAndFormatDate(dateTok),
        start: Utils.parseTimeInput(start),
        end: Utils.parseTimeInput(end)
      });
      i += consumed;
    }
    return out;
  }

  function applyActaInput(text) {
    state.actaInput = text;
    const status = $('#tempo-acta-status');
    const parsed = parseActaToSessions(text);
    if (parsed.length) {
      state.sessions = parsed;
      renderSessions();
      if (status) status.textContent = `Extraídas: ${parsed.length} sesion(es)`;
    } else {
      if (status) status.textContent = text.trim() ? 'No se han detectado sesiones.' : '';
    }
    saveState(); generate();
  }

  function addSession(afterId = null) {
    const newId = Date.now() + Math.random();
    let newSess;
    if (afterId) {
      const idx = state.sessions.findIndex(s => s.id === afterId);
      const prev = state.sessions[idx];
      newSess = { id: newId, date: prev.date, start: prev.start, end: prev.end };
      state.sessions.splice(idx + 1, 0, newSess);
    } else {
      const last = state.sessions[state.sessions.length - 1];
      newSess = {
        id: newId,
        date: last ? last.date : getInitialDate(),
        start: last ? last.start : '16:00',
        end: last ? last.end : '19:00'
      };
      state.sessions.push(newSess);
    }
    renderSessions(); saveState(); generate();
    setTimeout(() => {
      const newRow = _root.querySelector(`[data-id="${newId}"]`);
      newRow?.querySelector('input')?.focus();
    }, 0);
  }

  function removeSession(id) {
    if (state.sessions.length <= 1) return;
    state.sessions = state.sessions.filter(s => s.id !== id);
    renderSessions(); saveState(); generate();
  }

  function updateSession(id, field, value) {
    const s = state.sessions.find(x => x.id === id);
    if (!s) return;
    if (field === 'date') s.date = Utils.parseAndFormatDate(value);
    else if (field === 'start' || field === 'end') {
      s.start = Utils.parseTimeInput(s.start);
      s.end = Utils.parseTimeInput(s.end);
      s[field] = Utils.parseTimeInput(value);
    } else s[field] = value;
    saveState(); generate();
  }

  function generate() {
    const out1 = $('#tempo-output-pre');
    const out2 = $('#tempo-output-result');
    const rawData = state.excelInput.trim();
    const sessions = state.sessions;
    const modulos = state.modulos;

    const totalMinsSessions = sessions.reduce((acc, s) => acc + Utils.durationMin(s.start, s.end), 0);
    const totalMinsCert = totalMinsSessions
      + (modulos.app ? modulos.appH * 60 : 0)
      + (modulos.col ? modulos.colH * 60 : 0)
      + (modulos.ent ? modulos.entH * 60 : 0);

    const stats = {
      total: Utils.minutesToHmm(totalMinsCert),
      pres:  Utils.minutesToHmm(totalMinsSessions)
    };

    let modulesBlock = `### MÓDULOS:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
      `- HORAS: ${Utils.formatHorasDisplay(stats.total)}\n` +
      ` - Presencial__ ➤ ${Utils.formatHorasDisplay(stats.pres)}\n` +
      (modulos.app ? ` - ${modulos.appName.padEnd(12, '_')} ➤ ${modulos.appH} h\n` : '') +
      (modulos.col ? ` - ${modulos.colName.padEnd(12, '_')} ➤ ${modulos.colH} h\n` : '') +
      (modulos.ent ? ` - ${modulos.entName.padEnd(12, '_')} ➤ ${modulos.entH} h\n` : '');

    const blockLines = sessions.map((s, i) =>
      `${CHAR_BLOCK} ${Utils.formatDateForTemporalizacion(s.date)} ${s.start}-${s.end} ${state.codigo}  SESIÓN ${i + 1} / ${sessions.length}`
    ).join('\n');

    const baseCode = state.codigo.trim();
    const createModuleLine = (name, date) => {
      let dateStr = '????/??/??';
      if (date) dateStr = Utils.formatDateForTemporalizacion(date);
      return `${CHAR_BLOCK} ${dateStr} ___________ ${baseCode}  LÍMITE ENTREGA MÓDULO ${name.toUpperCase()}`;
    };

    let moduleLines = '';
    if (modulos.app) moduleLines += '\n' + createModuleLine(modulos.appName, modulos.appDate);
    if (modulos.col) moduleLines += '\n' + createModuleLine(modulos.colName, modulos.colDate);
    if (modulos.ent) moduleLines += '\n' + createModuleLine(modulos.entName, modulos.entDate);

    const naturalSessions = `Sesiones presenciales:\n` + sessions.map(s =>
      Utils.formatNaturalDate(s.date, s.start, s.end)
    ).join('\n');

    let naturalModules = '';
    const appendNat = (name, date) => { if (date) naturalModules += `\nFecha límite módulo de ${name.toLowerCase()}:\n${Utils.formatNaturalDateOnly(date)}`; };
    if (modulos.app) appendNat(modulos.appName, modulos.appDate);
    if (modulos.col) appendNat(modulos.colName, modulos.colDate);
    if (modulos.ent) appendNat(modulos.entName, modulos.entDate);

    const tempBlock = `\n### TEMPORALIZACIÓN:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
      blockLines + moduleLines + '\n\n' + naturalSessions + (naturalModules ? '\n' + naturalModules : '');

    let mainTableMd = '';
    if (rawData.length) {
      const rows = rawData.split('\n').filter(r => r.trim()).map(r => r.split('\t').map(c => c.trim()));
      const maxCols = Math.max(...rows.map(r => r.length));
      const normRows = rows.map(r => { while (r.length < maxCols) r.push(''); return r; });
      const headers = normRows[0] || [];
      const body = normRows.slice(1);
      const surnameIdx = headers.findIndex(h => h.toUpperCase().includes('APELLIDO'));
      const sortedBody = surnameIdx >= 0
        ? [...body].sort((a, b) => (a[surnameIdx] || '').localeCompare(b[surnameIdx] || '', 'es', { sensitivity: 'base' }))
        : body;

      const buildTable = dataRows => {
        if (!dataRows.length) return '';
        const colWidths = new Array(dataRows[0].length).fill(0);
        dataRows.forEach(r => r.forEach((c, i) => colWidths[i] = Math.max(colWidths[i], c.length, 3)));
        return dataRows.map((r, rIdx) => {
          const line = '| ' + r.map((c, i) => Utils.padRight(c, colWidths[i])).join(' | ') + ' |';
          if (rIdx === 0) return line + '\n| ' + colWidths.map(w => '-'.repeat(w)).join(' | ') + ' |';
          return line;
        }).join('\n');
      };

      mainTableMd = `\n\n### DATOS PARTICIPANTES:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
                    buildTable([headers, ...sortedBody]);
    }

    const finalMd = modulesBlock + '\n' + tempBlock + mainTableMd;
    if (out1) out1.textContent = finalMd;
    if (out2) out2.textContent = finalMd;
    return finalMd;
  }

  function copyMd() {
    const md = generate();
    if (!md.trim()) { UI.toast('No hay contenido', 'warn'); return; }
    Utils.copyText(md).then(() => UI.toast('Copiado al portapapeles')).catch(() => UI.toast('No se pudo copiar', 'error'));
  }

  function reset() {
    const btn = $('#tempo-btn-reset'), label = $('#tempo-btn-reset-label');
    if (!btn.classList.contains('pending')) {
      btn.classList.add('pending');
      label.textContent = '¿Confirmar?';
      _resetTimer = setTimeout(() => { btn.classList.remove('pending'); label.textContent = 'Limpiar'; }, 3000);
    } else {
      clearTimeout(_resetTimer);
      Store.clearNamespace(NS);
      state = {
        excelInput: '', actaInput: '', codigo: '',
        modulos: {
          app: false, appName: 'Aplicación',   appH: 2, appDate: '',
          col: false, colName: 'Colaboración', colH: 2, colDate: '',
          ent: false, entName: 'Entornos',     entH: 2, entDate: ''
        },
        sessions: [{ id: Date.now(), date: getInitialDate(), start: '16:00', end: '19:00' }]
      };
      mount(_root);
      UI.toast('Datos de Temporalización limpiados', 'info');
    }
  }

  // Compartir / importar
  function sharePax() {
    const txt = state.excelInput.trim();
    if (!txt) return UI.toast('No hay datos Excel', 'warn');
    const rows = txt.split('\n').filter(r => r.trim()).map(r => r.split('\t').map(c => c.trim()));
    const headers = (rows[0] || []).map(h => h.toLowerCase());
    const idxNif = headers.findIndex(h => h.includes('nif'));
    const idxApe = headers.findIndex(h => h.includes('apellido'));
    const idxNom = headers.findIndex(h => h.includes('nombre'));
    const idxMail = headers.findIndex(h => h.includes('mail') || h.includes('correo'));
    const data = rows.slice(1).map(r => ({
      nif: idxNif >= 0 ? r[idxNif] : '',
      surname: idxApe >= 0 ? r[idxApe] : '',
      name: idxNom >= 0 ? r[idxNom] : '',
      email: idxMail >= 0 ? r[idxMail] : ''
    })).filter(p => p.surname || p.name || p.nif);
    if (!data.length) return UI.toast('No se detectaron participantes', 'warn');
    Shared.publish('participants', data, ID);
    UI.toast(`${data.length} participantes compartidos`);
  }
  function shareSessions() {
    if (!state.sessions.length) return UI.toast('No hay sesiones', 'warn');
    Shared.publish('sessions', state.sessions.map(s => {
      const p = Utils.parseDateParts(s.date);
      const rawDate = p ? `${p.y}-${(p.m + 1).toString().padStart(2, '0')}-${p.d.toString().padStart(2, '0')}` : '';
      return { rawDate, start: s.start, end: s.end };
    }), ID);
    UI.toast(`${state.sessions.length} sesiones compartidas`);
  }
  function shareCode() {
    if (!state.codigo.trim()) return UI.toast('No hay código', 'warn');
    Shared.publish('courseLabel', state.codigo.trim(), ID);
    UI.toast('Etiqueta compartida');
  }

  function importShared(kind) {
    const entry = Shared.get(kind);
    if (!entry || !entry.data) return UI.toast('No hay datos compartidos', 'warn');
    if (kind === 'participants') {
      const headers = ['NIF', 'APELLIDOS', 'NOMBRE', 'EMAIL'];
      const rows = [headers.join('\t'), ...entry.data.map(p =>
        [p.nif || '', p.surname || '', p.name || '', p.email || ''].join('\t')
      )];
      state.excelInput = rows.join('\n');
      $('#tempo-excel-input').value = state.excelInput;
      saveState(); generate();
      UI.toast(`${entry.data.length} participantes importados`);
    } else if (kind === 'sessions') {
      state.sessions = entry.data.map(s => ({
        id: Date.now() + Math.random(),
        date: s.rawDate ? Utils.formatForInput(new Date(s.rawDate + 'T12:00:00')) : getInitialDate(),
        start: s.start, end: s.end
      }));
      renderSessions(); saveState(); generate();
      UI.toast(`${state.sessions.length} sesiones importadas`);
    } else if (kind === 'courseLabel') {
      state.codigo = entry.data;
      $('#tempo-code-input').value = entry.data;
      saveState(); generate();
      UI.toast('Etiqueta importada');
    }
  }

  function switchSub(id) {
    $$('.subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === id));
    $$('.subpanel').forEach(p => p.classList.toggle('active', p.dataset.panel === id));
    if (id === 'result') generate();
  }

  function mount(container) {
    _root = container;
    container.innerHTML = TEMPLATE;
    loadState();

    if (!state.sessions.length) {
      state.sessions.push({ id: Date.now(), date: getInitialDate(), start: '16:00', end: '19:00' });
    }

    $('#tempo-excel-input').value = state.excelInput || '';
    $('#tempo-acta-input').value = state.actaInput || '';
    $('#tempo-code-input').value = state.codigo || '';
    renderModules();
    renderSessions();
    generate();

    $$('.subtab-btn').forEach(b => b.addEventListener('click', () => switchSub(b.dataset.sub)));
    $('#tempo-excel-input').addEventListener('input', e => { state.excelInput = e.target.value; saveState(); generate(); });
    $('#tempo-acta-input').addEventListener('input', e => applyActaInput(e.target.value));
    $('#tempo-code-input').addEventListener('input', e => { state.codigo = e.target.value; saveState(); generate(); });
    $('#tempo-btn-copy').addEventListener('click', copyMd);
    $('#tempo-btn-reset').addEventListener('click', reset);
    $('#tempo-share-pax').addEventListener('click', sharePax);
    $('#tempo-share-sessions').addEventListener('click', shareSessions);
    $('#tempo-share-code').addEventListener('click', shareCode);
    $$('[data-import-shared]').forEach(b => b.addEventListener('click', () => importShared(b.dataset.importShared)));
  }

  function unmount() { saveState(); _root = null; }

  return {
    id: ID,
    label: 'Temporalización',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>',
    mount, unmount,
  };
})();

  function loadState() {

    if (stored && Array.isArray(stored.allData)) state = stored;

  function saveState() { Store.set(NS, 'state', state); }

  function getWidgetData(td) {
    if (!td) return null;
    for (const script of td.querySelectorAll('script')) {
      const src = script.textContent || '';
      const s = src.indexOf('{'), e = src.lastIndexOf('}');
      if (s === -1 || e === -1) continue;
      try { return JSON.parse(src.slice(s, e + 1)); } catch {}
    }
    return null;
  }

  function parseRows(doc) {
    const rows = doc.querySelectorAll('tr[id^="form1:table1:tableRowGroup1:"]');
    const out = [];
    for (const row of rows) {
      const id = row.id;
      const tituloTd = row.querySelector(`[id="${id}:tituloTableColumn"]`);
      if (!tituloTd) continue;
      const tituloData = getWidgetData(tituloTd);
      if (!tituloData) continue;
      const estadoData    = getWidgetData(row.querySelector(`[id="${id}:estadoTableColumn"]`));
      const centroData    = getWidgetData(row.querySelector(`[id="${id}:centroTableColumn"]`));
      const modalidadData = getWidgetData(row.querySelector(`[id="${id}:modalidadTableColumn"]`));
      const modalidad = modalidadData?.value ?? '';
      const titulo    = tituloData.value ?? '';
      out.push({
        estado:    estadoData?.title ?? '',
        centro:    centroData?.value ?? '',
        modalidad,
        titulo,
        codigo:    (tituloData.title ?? '').replace(/Código\s*:\s*/i, '').trim(),
        id:        '',
        actuacion: inferActuacion(modalidad, titulo),
        texto:     '',
      });
    }
    return out;
  }

  function inferActuacion(modalidad, titulo) {
    if (titulo.toUpperCase().includes('ETWINNING')) return 'ETWINNING';

    if (m.includes('seminario'))            return 'SEMINARIO';

    if (m.includes('proyecto de innovaci')) return 'PIE';

      const cls = c.sortable ? (c.key === state.sortKey ? `sortable sort-${state.sortDir}` : 'sortable') : '';
      return `<th class="${cls}" ${c.sortable ? `data-sort="${c.key}"` : ''}>${Utils.esc(c.label)}</th>`;
    }).join('');
    const body = filtered.map(r => {
      const hasText = (r.texto || '').length > 0;
      const convCell = r.codigo ? `<button class="btn btn-secondary tiny refo-conv-btn ${hasText ? 'has-text' : ''}"
        data-codigo="${Utils.esc(r.codigo)}" data-titulo="${Utils.esc(r.titulo)}">
        ${hasText ? '✓ Ver' : 'Ver'}
      </button>` : '<span class="faint">—</span>';
      const textoCell = hasText
        ? `<span class="texto-cell" title="${Utils.esc(r.texto)}" style="max-width:260px; display:inline-block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; font-size:0.8rem; color:var(--text-muted);">${Utils.esc(r.texto.slice(0, 90))}${r.texto.length > 90 ? '…' : ''}</span>`
        : `<span class="faint">—</span>`;
      return `<tr>
        <td>${estadoBadge(r.estado)}</td>
        <td>${Utils.esc(r.centro)}</td>
        <td>${Utils.esc(r.modalidad)}</td>
        <td class="mono small">${Utils.esc(r.codigo)}</td>
        <td><input type="text" class="refo-id-input" value="${Utils.esc(r.id)}" data-codigo="${Utils.esc(r.codigo)}" maxlength="21" placeholder="—" style="width:160px; padding:3px 7px; font-size:0.75rem;"></td>
        <td>${Utils.esc(r.titulo)}</td>
        <td><span class="mono tiny">${Utils.esc(r.actuacion) || '<span class="faint">—</span>'}</span></td>
        <td>${convCell}</td>
        <td>${textoCell}</td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

    wrap.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => sortBy(th.dataset.sort));
    });
    wrap.querySelectorAll('.refo-conv-btn').forEach(btn => {
      btn.addEventListener('click', () => openConvPanel(btn.dataset.codigo, btn.dataset.titulo));
    });
    wrap.querySelectorAll('.refo-id-input').forEach(inp => {
      inp.addEventListener('change', () => {
        const row = state.allData.find(r => r.codigo === inp.dataset.codigo);
        if (row) { row.id = inp.value.trim().slice(0, 21); saveState(); }
      });
    });
  }

  function estadoBadge(estado) {
    if (!estado) return `<span class="badge b-def">—</span>`;
    const s = estado.toLowerCase();
    let cls = 'b-def';
    if      (s.includes('desarrollo') || s.includes('organizacion') || s.includes('propuesta')) cls = 'b-dev';
    else if (s.includes('realizada') || s.includes('publicada') || s.includes('activa'))        cls = 'b-ok';
    else if (s.includes('suspendida') || s.includes('cancelada'))                               cls = 'b-sus';
    else if (s.includes('visada'))                                                              cls = 'b-vis';
    else if (s.includes('cerrada'))                                                             cls = 'b-cerr';
    return `<span class="badge ${cls}">${Utils.esc(estado)}</span>`;
  }

  function sortBy(key) {
    state.sortDir = state.sortKey === key ? (state.sortDir === 'asc' ? 'desc' : 'asc') : 'asc';
    state.sortKey = key;
    doSort(); renderTable(); saveState();
  }
  function doSort() {
    if (!state.sortKey) return;
    const k = state.sortKey;
    filtered.sort((a, b) => {
      const va = String(a[k] ?? '').toLowerCase();
      const vb = String(b[k] ?? '').toLowerCase();
      if (k === 'codigo') {
        const na = parseFloat(va), nb = parseFloat(vb);
        if (!isNaN(na) && !isNaN(nb)) return state.sortDir === 'asc' ? na - nb : nb - na;
      }
      return va < vb ? (state.sortDir === 'asc' ? -1 : 1) : va > vb ? (state.sortDir === 'asc' ? 1 : -1) : 0;
    });
  }

  function applyFilter() {
    const q = $('#refo-filter-input').value.toLowerCase();
    state.filterText = q;
    filtered = q
      ? state.allData.filter(r => [r.titulo, r.centro, r.modalidad, r.estado, r.codigo].some(v => (v || '').toLowerCase().includes(q)))
      : [...state.allData];
    doSort(); updateCount(); renderTable(); updateMdFilesBtn(); saveState();
  }
