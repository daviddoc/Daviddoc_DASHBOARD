<!DOCTYPE html>
<html lang="es" class="dark">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOTAS — Aplicación Unificada</title>
<link rel="icon"
  href='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2358a6ff%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%224%22 width=%2218%22 height=%2218%22 rx=%222%22/><line x1=%228%22 y1=%222%22 x2=%228%22 y2=%226%22/><line x1=%2216%22 y1=%222%22 x2=%2216%22 y2=%226%22/><line x1=%223%22 y1=%2210%22 x2=%2221%22 y2=%2210%22/></svg>'>
<style>
:root {
  --bg-dark: #0b0f19;
  --bg-card: #161b22;
  --bg-input: #0d1117;
  --bg-hover: #1c2128;
  --border: #30363d;
  --border-soft: rgba(48, 54, 61, 0.5);
  --text-main: #c9d1d9;
  --text-strong: #f0f6fc;
  --text-muted: #8b949e;
  --text-faint: #6e7681;
  --accent: #2f81f7;
  --accent-hover: #58a6ff;
  --accent-soft: rgba(47, 129, 247, 0.15);
  --accent-soft-2: rgba(47, 129, 247, 0.08);
  --danger: #f85149;
  --danger-soft: rgba(248, 81, 73, 0.1);
  --success: #238636;
  --success-hi: #3fb950;
  --warn: #d29922;
  --warn-hi: #e3b341;
  --purple: #bc8cff;
  --orange: #f0883e;
  --module-col-bg: rgba(47, 129, 247, 0.08);
  --row-alt-bg: rgba(255, 255, 255, 0.03);
  --row-active-bg: rgba(47, 129, 247, 0.1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}

h1, h2, h3, h4 { margin-top: 0; }

/* ── Header global ──────────────────────────────── */
header.app-header {
  height: 56px;
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  flex-shrink: 0;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
}

.brand-icon {
  background: var(--accent-soft);
  padding: 4px;
  border-radius: 6px;
  border: 1px solid rgba(47, 129, 247, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-strong);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-title em {
  color: var(--accent-hover);
  font-style: normal;
  font-weight: 700;
}

.brand-sep {
  color: var(--text-faint);
  margin: 0 0.4rem;
}

.brand-current {
  color: var(--text-muted);
  font-weight: 600;
  font-size: 0.85rem;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  gap: 0.4rem;
  align-items: center;
  flex-shrink: 0;
}

/* ── Botones genéricos ───────────────────────────── */
.btn {
  border: none;
  border-radius: 0.5rem;
  padding: 0.4rem 0.8rem;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: inherit;
  transition: all 0.15s;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-primary {
  background-color: var(--accent);
  color: white;
}
.btn-primary:hover:not(:disabled) { background-color: var(--accent-hover); }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid transparent;
}
.btn-ghost:hover:not(:disabled) {
  color: var(--text-strong);
  background: rgba(177, 186, 196, 0.12);
}

.btn-secondary {
  background-color: rgba(56, 139, 253, 0.1);
  color: var(--accent-hover);
  border: 1px solid rgba(56, 139, 253, 0.3);
}
.btn-secondary:hover:not(:disabled) { background-color: var(--accent); color: white; }

.btn-success {
  background: rgba(63, 185, 80, 0.15);
  color: var(--success-hi);
  border: 1px solid rgba(63, 185, 80, 0.35);
}
.btn-success:hover:not(:disabled) { background: rgba(63, 185, 80, 0.25); }

.btn-warn {
  background: rgba(210, 153, 34, 0.12);
  color: var(--warn-hi);
  border: 1px solid rgba(210, 153, 34, 0.3);
}
.btn-warn:hover:not(:disabled) { background: rgba(210, 153, 34, 0.22); }

.btn.pending { color: var(--danger) !important; }

/* Action button (small, icon) */
.action-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  font-family: inherit;
}
.action-btn:hover { background: var(--bg-hover); }

.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-main);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
.icon-btn.remove { color: var(--danger); }
.icon-btn.remove:hover { background: rgba(218, 54, 51, 0.1); }
.icon-btn.add { color: var(--accent); }
.icon-btn.add:hover { background: rgba(46, 160, 67, 0.1); }

/* ── Module tabs (top nav) ───────────────────────── */
nav.module-tabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
}

.module-tab {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  padding: 12px 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: all 0.2s;
  white-space: nowrap;
  font-family: inherit;
  position: relative;
}
.module-tab:hover { color: var(--text-main); background: var(--accent-soft-2); }
.module-tab.active {
  color: var(--accent-hover);
  border-bottom-color: var(--accent);
}
.module-tab .tab-num {
  font-size: 0.7rem;
  color: var(--text-faint);
  font-weight: 700;
}
.module-tab.active .tab-num { color: var(--accent); }

/* ── Container & Module Panels ───────────────────── */
.app-container {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  position: relative;
}

.module-panel {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.module-panel.active { display: flex; }

/* Sub-tabs (dentro de un módulo) */
.subtabs {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  margin: 0.5rem 1rem 0;
  border-radius: 0.5rem 0.5rem 0 0;
}

.subtab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.8rem;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.subtab-btn:hover { color: var(--text-main); background: var(--accent-soft-2); }
.subtab-btn.active {
  color: var(--accent-hover);
  border-bottom-color: var(--accent);
}

.subpanel {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  gap: 1rem;
}
.subpanel.active { display: flex; }

/* ── Cards ───────────────────────────────────────── */
.card,
details.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  overflow: visible;
}

.card > h3,
.card-title-bar,
details.card > summary {
  padding: 0.85rem 1rem;
  margin: 0;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  background-color: var(--bg-hover);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

details.card > summary {
  cursor: pointer;
  list-style: none;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before {
  content: '▶';
  font-size: 0.7em;
  transition: transform 0.2s;
}
details.card[open] > summary::before { transform: rotate(90deg); }
details.card[open] > summary { border-bottom: 1px solid var(--border); }
details.card:not([open]) > summary { border-bottom: none; }

.card-body {
  padding: 1rem;
}

.card-title-bar {
  justify-content: space-between;
}
.card-title-bar .title-text {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
}

/* ── Forms ───────────────────────────────────────── */
label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

input[type="text"],
input[type="number"],
input[type="time"],
input[type="date"],
input[type="url"],
input[type="email"],
textarea,
select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 0.6rem 0.75rem;
  border-radius: 0.5rem;
  width: 100%;
  font-family: 'Consolas', 'Cascadia Code', monospace;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--text-faint); }

textarea {
  resize: vertical;
  min-height: 100px;
  line-height: 1.5;
}

.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
@media (max-width: 720px) {
  .form-grid-2 { grid-template-columns: 1fr; }
}

.input-icon-wrapper {
  position: relative;
  width: 100%;
}
.input-icon-wrapper input { padding-right: 32px; }
.input-icon {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
}
.input-icon:hover { color: var(--text-main); }

/* ── Lists ───────────────────────────────────────── */
.item-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.list-item {
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--bg-input);
  padding: 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

/* ── Tables ──────────────────────────────────────── */
.table-container {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
}

table.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  white-space: nowrap;
}

table.data-table th,
table.data-table td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

table.data-table th {
  background: var(--bg-card);
  position: sticky;
  top: 0;
  z-index: 10;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  user-select: none;
}

table.data-table th.sortable { cursor: pointer; }
table.data-table th.sortable:hover { background: var(--bg-hover); color: var(--text-main); }
table.data-table th.sort-asc, table.data-table th.sort-desc { color: var(--accent-hover); }
table.data-table th.sort-asc::after { content: ' ↑'; }
table.data-table th.sort-desc::after { content: ' ↓'; }

table.data-table th.module-header,
table.data-table td.module-cell {
  background-color: var(--module-col-bg);
  border-left: 1px solid rgba(255, 255, 255, 0.05);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
}

table.data-table th.th-toggle {
  text-align: center;
  cursor: pointer;
}
table.data-table th.th-toggle:hover { background-color: rgba(47, 129, 247, 0.12); }
.toggle-all-indicator {
  margin-top: 4px;
  font-size: 0.72em;
  font-weight: 600;
}

table.data-table tbody tr:nth-child(even) { background-color: var(--row-alt-bg); }
table.data-table tbody tr:focus-within {
  background-color: var(--row-active-bg) !important;
  box-shadow: inset 3px 0 0 var(--accent);
}
table.data-table tbody tr:hover { background-color: var(--bg-hover); }
table.data-table tbody tr.row-approved { background-color: rgba(35, 134, 54, 0.15) !important; }
table.data-table tbody tr.row-name-active {
  background-color: rgba(47, 129, 247, 0.25) !important;
  box-shadow: inset 3px 0 0 var(--accent);
}

/* Grid checkboxes (Certificador attendance grid) */
.grid-check {
  width: 100%;
  height: 100%;
  min-width: 60px;
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: monospace;
  font-size: 1.2em;
  user-select: none;
}
.grid-check:focus {
  outline: 2px solid var(--accent);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 4px;
}
.check-active { color: var(--text-strong); font-weight: bold; }
.check-inactive { color: transparent; }

.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid;
}
.status-fail { color: var(--danger); font-weight: bold; }
.status-pass { color: var(--accent); font-weight: bold; }

/* Badges (Refo states) */
.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid;
  white-space: nowrap;
}
.b-dev  { background: rgba(210, 153, 34, 0.12);  color: var(--warn-hi);    border-color: rgba(210, 153, 34, 0.3); }
.b-ok   { background: rgba(63, 185, 80, 0.12);   color: var(--success-hi); border-color: rgba(63, 185, 80, 0.3); }
.b-sus  { background: rgba(248, 81, 73, 0.12);   color: var(--danger);     border-color: rgba(248, 81, 73, 0.3); }
.b-vis  { background: rgba(188, 140, 255, 0.12); color: var(--purple);     border-color: rgba(188, 140, 255, 0.3); }
.b-cerr { background: rgba(240, 136, 62, 0.12);  color: var(--orange);     border-color: rgba(240, 136, 62, 0.3); }
.b-def  { background: rgba(139, 148, 158, 0.1);  color: var(--text-muted); border-color: var(--border); }

/* ── Markdown output ─────────────────────────────── */
.markdown-output {
  background: var(--bg-input);
  padding: 15px;
  border-radius: 6px;
  font-family: 'DejaVu Sans Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  white-space: pre;
  overflow-x: auto;
  border: 1px solid var(--border);
  color: var(--text-strong);
  font-size: 12px;
  user-select: text;
  line-height: 1.5;
}

/* ── Toast ───────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  padding: 0.6rem 1rem;
  border-radius: 0.5rem;
  font-size: 0.8rem;
  font-weight: 600;
  pointer-events: none;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  z-index: 2000;
  max-width: 360px;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: #1a3a2a; border: 1px solid var(--success); color: var(--success-hi); }
#toast.info    { background: #1a2a3a; border: 1px solid var(--accent);  color: var(--accent-hover); }
#toast.warn    { background: #3a2a1a; border: 1px solid var(--warn);    color: var(--warn-hi); }
#toast.error   { background: #3a1a1a; border: 1px solid var(--danger);  color: var(--danger); }

/* ── Side panel (drawer) ─────────────────────────── */
#side-panel-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 100;
  backdrop-filter: blur(2px);
}
#side-panel-backdrop.open { display: block; }

#side-panel {
  position: fixed;
  top: 0; right: 0;
  width: min(720px, 100vw);
  height: 100vh;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 101;
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
}
#side-panel.open { transform: translateX(0); }

.sp-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-hover);
  flex-shrink: 0;
}
.sp-title { font-size: 0.9rem; font-weight: 700; color: var(--text-strong); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-codigo { font-size: 0.72rem; color: var(--text-faint); font-family: monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sp-body {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.sp-iframe-wrap {
  flex: 1;
  position: relative;
  background: #fff;
  display: flex;
  flex-direction: column;
}
.sp-iframe-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  flex: 1;
}
.sp-url-bar {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}
.sp-url-bar input {
  flex: 1;
  font: 11px/1 monospace;
  padding: 6px 8px;
  border-radius: 3px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-main);
}

.sp-iframe-blocked {
  position: absolute;
  inset: 0;
  display: none;
  background: var(--bg-input);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
.sp-iframe-blocked.show { display: flex; }
.sp-iframe-blocked .ic { font-size: 28px; opacity: 0.5; }

.sp-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-hover);
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
}
.sp-hint {
  font-size: 0.75rem;
  color: var(--text-faint);
}
.sp-hint kbd {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
}
.sp-paste-area {
  width: 100%;
  min-height: 56px;
  max-height: 140px;
  background: var(--bg-input);
  border: 1px dashed var(--border);
  border-radius: 4px;
  color: var(--text-main);
  font-family: monospace;
  font-size: 11px;
  padding: 7px 10px;
  resize: vertical;
}
.sp-paste-area:focus { border-color: var(--accent); border-style: solid; outline: none; }

.sp-vista {
  flex: 1;
  overflow: auto;
  padding: 16px 20px;
  font-family: 'Menlo', 'DejaVu Sans Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--bg-input);
  color: var(--text-main);
  user-select: text;
}

/* ── Dropdown (Shared menu) ──────────────────────── */
.dropdown {
  position: relative;
}
.dropdown-menu {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 280px;
  max-width: 360px;
  z-index: 60;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  padding: 6px;
}
.dropdown.open .dropdown-menu { display: block; }
.dropdown-header {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 6px 10px 4px;
  letter-spacing: 0.05em;
}
.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

<script>
(function loadPdfJs() {
  const tryPaths = ['./_LIBRERÍAS/pdfjs/pdf.min.js', './pdf.min.js'];
  const workerPaths = ['./_LIBRERÍAS/pdfjs/pdf.worker.min.js', './pdf.worker.min.js'];
  let i = 0;
  function next() {
    if (i >= tryPaths.length) return;
    const s = document.createElement('script');
    s.src = tryPaths[i];
    s.onload = () => {
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = workerPaths[i];
        window.__PDFJS_READY__ = true;
      }
    };
    s.onerror = () => { i++; next(); };
    document.head.appendChild(s);
  }
  next();
})();
</script>

<script>
'use strict';

/* =========================================================
   ============================  CORE  =====================
   ========================================================= */

// ── Utils: helpers compartidos por todos los módulos ────────
const Utils = (() => {
  const esc = s => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function download(content, filename, mime) {
    const bom = mime.includes('csv') ? '﻿' : '';
    const isBlob = content instanceof Blob;
    const blob = isBlob ? content : new Blob([bom + content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 8000);
  }

  function copyText(text) {
    if (!text) return Promise.reject(new Error('empty'));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); }
      catch (e) { reject(e); }
      finally { document.body.removeChild(ta); }
    });
  }

  function sanitizeFilename(s) {
    return String(s ?? '').replace(/[/\\:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
  }

  // ── Tiempo / Duración ──
  function durationMin(start, end) {
    if (!start || !end) return 0;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    if (isNaN(sh) || isNaN(eh)) return 0;
    let diff = (eh * 60 + em) - (sh * 60 + sm);
    if (diff < 0) diff += 24 * 60;
    return diff;
  }

  function formatHM(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  }

  function minutesToHmm(m) {
    const h = Math.floor(m / 60);
    const mins = Math.round(m % 60);
    return `${h}:${mins.toString().padStart(2, '0')}`;
  }

  function formatHorasDisplay(hm) {
    const [h, m] = hm.split(':');
    return m === '00' ? `${parseInt(h)} h` : `${parseInt(h)}:${m} h`;
  }

  // ── Tiempo: parser inteligente ──
  function parseTimeInput(val) {
    if (!val) return val;
    const v = String(val).trim().replace(':', '');
    if (/^\d{4}$/.test(v)) return `${v.slice(0, 2)}:${v.slice(2)}`;
    if (/^\d{1,2}$/.test(v)) return `${v.padStart(2, '0')}:00`;
    if (/^\d{3}$/.test(v)) return `0${v.slice(0, 1)}:${v.slice(1)}`;
    return val;
  }

  // ── Fechas: helpers en español ──
  const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // dd mmm
  function formatCustomDate(isoDate) {
    if (!isoDate) return '';
    const d = new Date(isoDate + 'T12:00:00');
    if (isNaN(d)) return isoDate;
    return `${d.getDate()} ${MESES_CORTOS[d.getMonth()]}`;
  }

  // dd mmm yy (Tempo style)
  function formatForInput(dObj) {
    return `${dObj.getDate()} ${MESES_CORTOS[dObj.getMonth()]} ${dObj.getFullYear().toString().slice(-2)}`;
  }

  // Acepta: dd/mm, dd/mm/yyyy, dd-mm-yyyy, ddmmyy, ddmmyyyy, dd mmm, dd mmm yy
  function parseDateParts(inputStr) {
    if (!inputStr) return null;
    let clean = String(inputStr).trim().toLowerCase().replace(/\./g, '/').replace(/-/g, '/');
    if (/^\d{1,2}\/\d{1,2}$/.test(clean)) clean += '/' + new Date().getFullYear();
    if (/^\d{6,8}$/.test(clean)) {
      const d = parseInt(clean.slice(0, 2));
      const m = parseInt(clean.slice(2, 4)) - 1;
      let y = clean.slice(4); if (y.length === 2) y = '20' + y;
      return { d, m, y };
    }
    if (/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(clean)) {
      const [y, m, d] = clean.split('/');
      return { d: parseInt(d), m: parseInt(m) - 1, y };
    }
    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(clean)) {
      const [d, m, y] = clean.split('/');
      const fullY = y.length === 2 ? '20' + y : y;
      return { d: parseInt(d), m: parseInt(m) - 1, y: fullY };
    }
    const parts = clean.split(/\s+/);
    if (parts.length >= 2) {
      const d = parseInt(parts[0]);
      const mIdx = MESES_CORTOS.indexOf(parts[1].substring(0, 3));
      if (!isNaN(d) && mIdx !== -1) {
        let y = String(new Date().getFullYear());
        if (parts.length >= 3 && /^\d{2,4}$/.test(parts[2])) {
          y = parts[2]; if (y.length === 2) y = '20' + y;
        }
        return { d, m: mIdx, y };
      }
    }
    return null;
  }

  function parseAndFormatDate(val) {
    const p = parseDateParts(val);
    if (!p) return val;
    return formatForInput(new Date(parseInt(p.y), p.m, p.d));
  }

  function formatDateForTemporalizacion(inputStr) {
    const p = parseDateParts(inputStr);
    if (!p) return inputStr;
    const day = p.d.toString().padStart(2, '0');
    const month = (p.m + 1).toString().padStart(2, '0');
    return `${p.y}/${month}/${day}`;
  }

  function formatNaturalDate(dateStr, start, end) {
    const p = parseDateParts(dateStr);
    if (!p) return '';
    return `- ${p.d} ${MESES_LARGOS[p.m]} de ${start} a ${end}.`;
  }

  function formatNaturalDateOnly(dateStr) {
    const p = parseDateParts(dateStr);
    if (!p) return '';
    return `- ${p.d} ${MESES_LARGOS[p.m]}.`;
  }

  function todayInputDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function padRight(str, len) {
    const s = str || '';
    return s + ' '.repeat(Math.max(0, len - s.length));
  }

  // CRC32 / ZIP (para PFC)
  let _crcTable = null;
  function crc32(data) {
    if (!_crcTable) {
      _crcTable = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        _crcTable[i] = c;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) crc = _crcTable[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function createZip(files) {
    const enc = new TextEncoder();
    const entries = files.map(f => {
      const name = enc.encode(f.name);
      const data = enc.encode(f.content);
      return { name, data, crc: crc32(data) };
    });
    const lParts = [], cParts = []; let off = 0;
    for (const e of entries) {
      const lb = new ArrayBuffer(30 + e.name.length), lv = new DataView(lb);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
      lv.setUint32(14, e.crc, true); lv.setUint32(18, e.data.length, true); lv.setUint32(22, e.data.length, true);
      lv.setUint16(26, e.name.length, true); lv.setUint16(28, 0, true);
      const la = new Uint8Array(lb); la.set(e.name, 30);
      const cb = new ArrayBuffer(46 + e.name.length), cv = new DataView(cb);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, e.crc, true); cv.setUint32(20, e.data.length, true); cv.setUint32(24, e.data.length, true);
      cv.setUint16(28, e.name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, off, true);
      const ca = new Uint8Array(cb); ca.set(e.name, 46);
      lParts.push(la, e.data); cParts.push(ca); off += la.length + e.data.length;
    }
    const cdSz = cParts.reduce((s, p) => s + p.length, 0);
    const eb = new ArrayBuffer(22), ev = new DataView(eb);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSz, true); ev.setUint32(16, off, true); ev.setUint16(20, 0, true);
    const all = [...lParts, ...cParts, new Uint8Array(eb)];
    const buf = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
    let p = 0; for (const a of all) { buf.set(a, p); p += a.length; }
    return new Blob([buf], { type: 'application/zip' });
  }

  return {
    esc, download, copyText, sanitizeFilename,
    durationMin, formatHM, minutesToHmm, formatHorasDisplay, parseTimeInput,
    MESES_CORTOS, MESES_LARGOS,
    formatCustomDate, formatForInput, parseDateParts, parseAndFormatDate,
    formatDateForTemporalizacion, formatNaturalDate, formatNaturalDateOnly,
    todayInputDate, padRight, crc32, createZip,
  };
})();

// ── Store: localStorage namespaced ──────────────────────────
const Store = (() => {
  const PREFIX = 'notas:';
  function key(ns, field) { return field ? `${PREFIX}${ns}:${field}` : `${PREFIX}${ns}`; }
  function get(ns, field, fallback = null) {
    try {
      const raw = localStorage.getItem(key(ns, field));
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch { return fallback; }
  }
  function set(ns, field, value) {
    try { localStorage.setItem(key(ns, field), JSON.stringify(value)); } catch {}
  }
  function remove(ns, field) { localStorage.removeItem(key(ns, field)); }
  function clearNamespace(ns) {
    const prefix = key(ns, '');
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k === key(ns) || k.startsWith(prefix))) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  }
  function clearAll() {
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(PREFIX)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  }
  return { get, set, remove, clearNamespace, clearAll };
})();

// ── Bus: pub/sub ────────────────────────────────────────────
const Bus = (() => {
  const subs = new Map();
  function on(event, cb) {
    if (!subs.has(event)) subs.set(event, new Set());
    subs.get(event).add(cb);
    return () => subs.get(event)?.delete(cb);
  }
  function emit(event, payload) {
    subs.get(event)?.forEach(cb => { try { cb(payload); } catch (e) { console.error(e); } });
  }
  return { on, emit };
})();

// ── Shared: pool de datos compartidos entre módulos ─────────
const Shared = (() => {
  const NS = 'shared';
  // Tipos: participants, sessions, courseLabel, valoracionReport, centro, codigoActividad
  const KINDS = {
    participants:     { label: 'Participantes',         describe: arr => `${arr?.length ?? 0} personas` },
    sessions:         { label: 'Sesiones',              describe: arr => `${arr?.length ?? 0} sesiones` },
    courseLabel:      { label: 'Etiqueta del curso',    describe: s   => s ? `"${s}"` : '' },
    valoracionReport: { label: 'Informe valoración',    describe: s   => s ? `${s.length} chars`  : '' },
    centro:           { label: 'Centro',                describe: c   => c?.nombre ?? '' },
    codigoActividad:  { label: 'Código actividad',      describe: s   => s ? s : '' },
  };

  function publish(kind, data, sourceModuleId = null) {
    Store.set(NS, kind, { data, sourceModuleId, ts: Date.now() });
    Bus.emit('shared:changed', { kind });
    Bus.emit('shared:' + kind, data);
  }

  function get(kind) {
    return Store.get(NS, kind, null);
  }

  function getAvailable() {
    const out = [];
    for (const k of Object.keys(KINDS)) {
      const entry = get(k);
      if (entry && entry.data != null && (
        (Array.isArray(entry.data) && entry.data.length) ||
        (typeof entry.data === 'string' && entry.data.length) ||
        (typeof entry.data === 'object' && !Array.isArray(entry.data))
      )) {
        out.push({
          kind: k,
          label: KINDS[k].label,
          describe: KINDS[k].describe(entry.data),
          source: entry.sourceModuleId,
          ts: entry.ts,
          data: entry.data,
        });
      }
    }
    return out;
  }

  function clear(kind) {
    if (kind) Store.remove(NS, kind);
    else Object.keys(KINDS).forEach(k => Store.remove(NS, k));
    Bus.emit('shared:changed', { kind });
  }

  return { publish, get, getAvailable, clear, KINDS };
})();

// ── UI: toast, side panel ───────────────────────────────────
const UI = (() => {
  let toastTimer = null;
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Side panel API: cualquier módulo puede pedirlo, recibe contenedor donde renderizar
  let panelCloseHandler = null;
  function openPanel({ title = 'Panel', codigo = '', render, onClose } = {}) {
    const sp = document.getElementById('side-panel');
    const bd = document.getElementById('side-panel-backdrop');
    document.getElementById('sp-title').textContent = title;
    document.getElementById('sp-codigo').textContent = codigo;
    const body = document.getElementById('sp-body');
    body.innerHTML = '';
    if (typeof render === 'function') render(body);
    panelCloseHandler = onClose;
    sp.classList.add('open');
    bd.classList.add('open');
  }
  function closePanel() {
    document.getElementById('side-panel').classList.remove('open');
    document.getElementById('side-panel-backdrop').classList.remove('open');
    if (typeof panelCloseHandler === 'function') {
      try { panelCloseHandler(); } catch {}
      panelCloseHandler = null;
    }
    document.getElementById('sp-body').innerHTML = '';
  }

  function isPanelOpen() {
    return document.getElementById('side-panel').classList.contains('open');
  }

  // Init listeners (one time)
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('sp-close').addEventListener('click', closePanel);
    document.getElementById('side-panel-backdrop').addEventListener('click', closePanel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && isPanelOpen()) closePanel();
    });
  });

  return { toast, openPanel, closePanel, isPanelOpen };
})();

// ── Router: gestiona los módulos top-level ──────────────────
const Router = (() => {
  const modules = [];
  let currentId = null;
  const mountedContainers = new Map();

  function register(mod) {
    modules.push(mod);
  }

  function init(modList) {
    modList.forEach(register);
    renderTabs();

    const last = Store.get('app', 'currentModule', modules[0]?.id);
    const start = modules.find(m => m.id === last) ? last : modules[0]?.id;
    if (start) activate(start);

    // Atajos Ctrl/Cmd+1..N
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
        const n = parseInt(e.key);
        if (!isNaN(n) && n >= 1 && n <= modules.length) {
          e.preventDefault();
          activate(modules[n - 1].id);
        }
      }
    });
  }

  function renderTabs() {
    const nav = document.getElementById('module-tabs');
    nav.innerHTML = '';
    modules.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'module-tab';
      btn.dataset.moduleId = m.id;
      btn.innerHTML = `<span class="tab-num">${i + 1}.</span> ${m.icon || ''} <span>${m.label}</span>`;
      btn.addEventListener('click', () => activate(m.id));
      nav.appendChild(btn);
    });
  }

  function activate(id) {
    if (currentId === id) return;
    const mod = modules.find(m => m.id === id);
    if (!mod) return;

    // Unmount actual
    if (currentId) {
      const cur = modules.find(m => m.id === currentId);
      if (cur && typeof cur.unmount === 'function') {
        try { cur.unmount(); } catch (e) { console.error(e); }
      }
      const prevContainer = mountedContainers.get(currentId);
      if (prevContainer) prevContainer.classList.remove('active');
    }

    // Mount nuevo
    let container = mountedContainers.get(id);
    if (!container) {
      container = document.createElement('div');
      container.className = 'module-panel';
      container.id = `panel-${id}`;
      document.getElementById('app-container').appendChild(container);
      mountedContainers.set(id, container);
    }
    container.classList.add('active');

    if (typeof mod.mount === 'function') {
      try { mod.mount(container); } catch (e) { console.error('mount error:', e); }
    }

    currentId = id;
    Store.set('app', 'currentModule', id);

    // Update tabs UI
    document.querySelectorAll('.module-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.moduleId === id);
    });

    // Update brand
    document.getElementById('brand-current').textContent = mod.label;

    Bus.emit('router:activate', { id });
  }

  function getCurrentId() { return currentId; }
  function getModule(id) { return modules.find(m => m.id === id); }
  function listModules() { return modules.slice(); }

  return { init, register, activate, getCurrentId, getModule, listModules };
})();

// ── Compartido: dropdown UI ─────────────────────────────────

    const menu = document.getElementById('shared-menu');

      html += `<div class="dropdown-item">

    menu.innerHTML = html;

    menu.querySelectorAll('[data-clear]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        Shared.clear(btn.dataset.clear);
        refresh();
      });
    });
  }

  function init() {
    const dd = document.getElementById('shared-dropdown');
    const btn = document.getElementById('btn-shared');
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = dd.classList.contains('open');

    });
    document.addEventListener('click', e => {
      if (!dd.contains(e.target)) dd.classList.remove('open');
    });

    refresh();
  }

  return { init, refresh };
})();
