  // ── HTML → Markdown (para pegado en panel) ──
  function htmlToMd(html) {
    const wrap = document.createElement('div');
    wrap.innerHTML = html;
    wrap.querySelectorAll('script,style,img,button,input,select,nav').forEach(n => n.remove());
    return nodeToMd(wrap)
      .replace(/[ \t]+$/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  function nodeToMd(node) {
    if (node.nodeType === 3) return node.textContent.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ');
    if (node.nodeType !== 1) return '';
    const tag = node.tagName.toLowerCase();
    const kids = () => Array.from(node.childNodes).map(nodeToMd).join('');
    if (['script','style','img','button','input','select'].includes(tag)) return '';
    switch (tag) {
      case 'h1': return `# ${kids().trim()}\n\n`;
      case 'h2': return `## ${kids().trim()}\n\n`;
      case 'h3': return `### ${kids().trim()}\n\n`;
      case 'h4': return `#### ${kids().trim()}\n\n`;
      case 'h5': return `##### ${kids().trim()}\n\n`;
      case 'h6': return `###### ${kids().trim()}\n\n`;
      case 'strong': case 'b': { const t = kids().trim(); return t ? `**${t}**` : ''; }
      case 'em': case 'i': { const t = kids().trim(); return t ? `*${t}*` : ''; }
      case 'a': {
        const href = node.getAttribute('href') || '';
        const t = kids().trim();
        return (href && !href.startsWith('javascript')) ? `[${t}](${href})` : t;
      }
      case 'br': return '\n';
      case 'li': return `- ${kids().trim()}\n`;
      case 'ul': case 'ol': return '\n' + kids() + '\n';
      case 'p': { const t = kids().trim(); return t ? `${t}\n\n` : ''; }
      case 'hr': return '\n---\n\n';
      case 'blockquote': return kids().trim().split('\n').map(l => `> ${l}`).join('\n') + '\n\n';
      case 'code': return `\`${kids()}\``;
      case 'pre': return '```\n' + kids().trim() + '\n```\n\n';
      case 'span': return kids();
      case 'th': case 'td': return kids().trim() + '\t';
      case 'tr': return kids().trim() + '\n';
      case 'table': return '\n' + kids() + '\n';
      default: {
        const BLOCK = new Set(['div','section','article','aside','main','header','footer','figure','figcaption','thead','tbody','tfoot']);
        if (BLOCK.has(tag)) {
          const inner = kids();
          return inner.endsWith('\n') ? inner : inner + '\n';
        }
        return kids();
      }
    }
  }

  // ── Exports ──
  function exportCSV() {
    const H = ['ESTADO','CENTRO','MODALIDAD','CÓDIGO','TÍTULO','CONVOCATORIA','TEXTO'];
    const rows = filtered.map(r => [
      r.estado, r.centro, r.modalidad, r.codigo, r.titulo,
      r.codigo ? BASE_URL + r.codigo : '', r.texto
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    Utils.download([H.join(','), ...rows].join('\r\n'), 'refo_extract.csv', 'text/csv;charset=utf-8;');
  }

  function exportMarkdown() {
    const H = ['ESTADO','CENTRO','MODALIDAD','CÓDIGO','TÍTULO','CONVOCATORIA','TEXTO'];
    const sep = H.map(() => '---').join(' | ');
    const rows = filtered.map(r => {
      const url = r.codigo ? BASE_URL + r.codigo : '';
      const conv = url ? `[Ver](${url})` : '';
      const txt = (r.texto || '').replace(/\n+/g, ' ').slice(0, 300) + ((r.texto || '').length > 300 ? '…' : '');
      return [r.estado, r.centro, r.modalidad, r.codigo, r.titulo, conv, txt].join(' | ');
    });
    const md = [
      '| ' + H.join(' | ') + ' |',
      '| ' + sep + ' |',
      ...rows.map(r => '| ' + r + ' |'),
    ].join('\n');
    Utils.download(md, 'refo_extract.md', 'text/markdown;charset=utf-8;');
  }

  function exportMdFiles() {
    const rows = filtered.filter(r => r.texto);

    // Generar fecha para el nombre del ZIP
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    // Array para almacenar los archivos del ZIP
    const zipFiles = [];

    rows.forEach(r => {
      const frontmatter = [
        '---',
        `Título: ${r.titulo}`,
        `Código: ${r.codigo}`,
        `ID: ${r.id}`,
        `Modalidad: ${r.modalidad}`,
        `Centro: ${r.centro}`,
        `Convocatoria: ${BASE_URL}${r.codigo}`,
        `Inscripción: ${INSCRIPCION_URL}${r.codigo}`,
        '---',
        '',
      ].join('\n');
      const actContent = ACTUACIONES_CONTENT[r.actuacion] ?? '';
      const convocatoria = `# 📄 CONVOCATORIA\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n${r.texto}\n\n`;
      const comunicaciones = `# 📞 COMUNICACIONES\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n`;
      const content = frontmatter + MD_TEMPLATE_A + actContent + MD_TEMPLATE_B + convocatoria + comunicaciones;

      // Nombre base del archivo (sin extensión)
      const baseFilename = Utils.sanitizeFilename(r.id || `${r.codigo} - ${r.titulo}`);
      const mdFilename = baseFilename + '.md';

      // Agregar el archivo .md al ZIP
      zipFiles.push({
        name: mdFilename,
        content: content
      });

      // Crear la estructura de carpetas
      // Carpeta con el mismo nombre del archivo (sin .md)
      const folderName = baseFilename;

      // Convertir código: 99088 -> 99088_MEMORIA
      // Agregar _MEMORIA al código
      let memoriaFolder = 'MEMORIA';
      if (r.codigo && r.codigo.trim()) {
        memoriaFolder = r.codigo.trim() + '_MEMORIA';
      }

      // Crear un archivo placeholder en la subcarpeta (para que la carpeta se cree en el ZIP)
      zipFiles.push({
        name: `${folderName}/${memoriaFolder}/.gitkeep`,
        content: ''
      });
    });

    // Crear el ZIP y descargarlo
    const zipBlob = Utils.createZip(zipFiles);
    Utils.download(zipBlob, `${dateStr}_ACTIVIDADES.zip`, 'application/zip');
  }

  function showAlert(msg, type) {
    const el = $('#refo-alert');
    el.textContent = msg; el.className = 'alert ' + type;
    el.style.display = 'block';
  }

  function updateCount() {
    const label = $('#refo-count-label'), info = $('#refo-filter-info');
    if (!state.allData.length) { label.textContent = 'sin datos'; info.textContent = ''; return; }
    label.textContent = `${state.allData.length} registro${state.allData.length !== 1 ? 's' : ''}`;
    info.textContent = filtered.length < state.allData.length ? `mostrando ${filtered.length}` : '';
  }
  function setExportBtns(en) {
    $('#refo-btn-csv').disabled = !en;
    $('#refo-btn-md').disabled = !en;
    updateMdFilesBtn();
  }
  function updateMdFilesBtn() {
    const any = filtered.some(r => r.texto);
    $('#refo-btn-md-files').disabled = !any;
  }

  function clearAll() {
    state = { allData: [], filterText: '', sortKey: null, sortDir: 'asc' };
    filtered = [];
    $('#refo-html-input').value = '';
    $('#refo-filter-input').value = '';
    $('#refo-filter-wrap').style.display = 'none';
    $('#refo-filter-info').textContent = '';
    $('#refo-alert').style.display = 'none';
    $('#refo-table-wrap').innerHTML = `<div class="empty-state"><div class="ic">📋</div><p>Pega el HTML del panel REFORACEN y pulsa <strong>Procesar</strong></p></div>`;
    updateCount(); setExportBtns(false);
    saveState();
  }

  function mount(container) {
    _root = container;
    container.innerHTML = TEMPLATE;
    loadState();
    filtered = [...state.allData];

    if (state.allData.length) {
      $('#refo-filter-wrap').style.display = '';
      $('#refo-filter-input').value = state.filterText || '';
      doSort();
      renderTable();
      updateCount();
      setExportBtns(true);
    }

    $('#refo-btn-process').addEventListener('click', processHTML);
    $('#refo-btn-clear').addEventListener('click', clearAll);
    $('#refo-filter-input').addEventListener('input', applyFilter);
    $('#refo-btn-csv').addEventListener('click', exportCSV);
    $('#refo-btn-md').addEventListener('click', exportMarkdown);
    $('#refo-btn-md-files').addEventListener('click', exportMdFiles);
  }

  function unmount() { saveState(); _root = null; }

  return {
    id: ID,
    label: 'Actividades',
    icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2v12h12V2H2zm1 1h10v10H3V3zm2 2v1h6V5H5zm0 2.5v1h6v-1H5zm0 2.5v1h6v-1H5z"/></svg>',
    mount, unmount,
  };
})();

const modulePFC = (() => {
  const ID = 'pfc';
  const NS = 'pfc';

  let rows = [];
  let _root = null;

  const TEMPLATE = `
    <div class="subpanel active" data-panel="main" style="padding:1rem; gap:0.75rem;">
      <div class="card">
        <div class="card-title-bar">
          <span class="title-text">HTML Reforacen (página «Modificar Plan»)</span>

            <button class="btn btn-ghost" id="pfc-btn-vista-pf">Vista PF</button>
          </div>
        </div>
        <div class="table-container" style="max-height: calc(100vh - 320px); overflow:auto;">
          <table class="data-table" id="pfc-table">
            <thead>
              <tr>
                <th>CENTRO</th>
                <th>CÓDIGO PF</th>
                <th>DURACIÓN</th>
                <th>AÑOS</th>
                <th>INICIO</th>
                <th>FIN</th>
                <th>ID</th>
                <th>DATOS CENTRO (HTML)</th>
                <th>INSPECTOR/A</th>
                <th>MEMORIA PLAN</th>
                <th>⬇ ZIP</th>
              </tr>
            </thead>
            <tbody id="pfc-tbody">
              <tr><td colspan="11" class="empty-state" style="padding:30px;">Pega el HTML de Reforacen y pulsa <strong>PROCESAR</strong></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  function $(s) { return _root?.querySelector(s); }
  function $$(s) { return Array.from(_root?.querySelectorAll(s) || []); }

  function loadState() {
    const stored = Store.get(NS, 'rows', null);
    if (Array.isArray(stored)) {
      rows = stored.map(r => ({ ...r, pdfFile: null })); // No persistimos archivo, sólo metadata
    }
  }
  function saveState() {
    Store.set(NS, 'rows', rows.map(r => ({
      centro: r.centro, planCode: r.planCode, duracion: r.duracion, anios: r.anios,
      inicio: r.inicio, fin: r.fin, id: r.id || '', centroHtml: r.centroHtml || '',
      centroData: r.centroData || null, inspectorText: r.inspectorText || '',
      pdfName: r.pdfName || '', pdfData: r.pdfData || null
    })));
  }

  // ── Parse Reforacen ──
  function parseReforacen(html) {
    const rowMap = {};
    const re = /_createWidget\('[^']*tableRowGroup1:(\d+):(\w+TableColumn):\w+',(\{[^}]+\})/g;
    let m;
    while ((m = re.exec(html)) !== null) {
      const idx = +m[1], col = m[2];
      let obj; try { obj = JSON.parse(m[3]); } catch { continue; }
      if (!rowMap[idx]) rowMap[idx] = {};
      rowMap[idx][col] = obj;
    }
    return Object.keys(rowMap).map(Number).sort((a, b) => a - b).map(idx => {
      const r = rowMap[idx];
      const centro = r.centroTableColumn?.value || '';
      const planCode = (r.centroTableColumn?.title || '').replace(/^Código:\s*/, '').trim();
      const duracion = r.duracionTableColumn?.value || '';
      const anios = parseInt(duracion) || '';
      const inicio = fmt2425(r.cursoInicialTableColumn?.value || '');
      const fin = fmt2425(r.cursoFinalTableColumn?.value || '');
      return centro ? { centro, planCode, duracion, anios, inicio, fin } : null;
    }).filter(Boolean);
  }

  function fmt2425(s) { return s.replace(/(\d{4})\/(\d{4})/, (_, a, b) => `${a}-${b.slice(2)}`); }
  function fmt4444(s) { return s.replace(/(\d{4})-(\d{2})/, (_, a, b) => `${a}/20${b}`); }

  // ── Parse Centro HTML ──
  function parseCentroHTML(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const data = { nombre: '', nombreCompleto: '', tipo: '', codigo: '', titularidad: '', direccion: '', telefono: '', mail: '', web: '', lat: null, lng: null, redes: [], secciones: [] };
    const nameSpan = doc.querySelector('.infoCentroTitle .name');
    const provSpan = doc.querySelector('.infoCentroTitle .infoCentroTitleProv');
    if (nameSpan) {
      data.nombre = nameSpan.textContent.replace(/\s*[-–]\s*$/, '').replace(/\s+/g, ' ').trim();
      const prov = provSpan?.textContent.trim() || '';
      data.nombreCompleto = data.nombre + (prov ? ` - ${prov}` : '');
    } else {
      const h2 = doc.querySelector('h2.infoCentroTitle');
      const full = (h2?.textContent || '').replace(/\s+/g, ' ').trim();
      const sp = full.match(/^(.+?)\s*-\s*(.+\(.+\))\s*$/);
      if (sp) { data.nombre = sp[1].trim(); data.nombreCompleto = full; }
      else { data.nombre = full; data.nombreCompleto = full; }
    }
    for (const s of doc.querySelectorAll('script:not([src])')) {
      const am = s.textContent.match(/aM\[0\]=\['[^']*',\s*'([^']+)',\s*'([^']+)'/);
      if (am) { data.lng = parseFloat(am[1]); data.lat = parseFloat(am[2]); break; }
    }
    for (const box of doc.querySelectorAll('.icBox')) {
      const titleEl = box.querySelector('.icBox_Title');
      if (!titleEl) continue;
      const titulo = titleEl.textContent.trim();
      if (/referencia|localiz/i.test(titulo)) continue;
      if (/datos generales/i.test(titulo)) parseGeneralData(box, data);
      else { const md = icBoxToMd(box); if (md.trim()) data.secciones.push({ titulo, md }); }
    }
    return data;
  }

  function parseGeneralData(box, data) {
    for (const item of box.querySelectorAll('.icBox_Item,.icBox_item')) {
      const label = (item.querySelector('.icBox_Label')?.textContent || '').toLowerCase().trim();
      if (label.includes('tipo de centro')) data.tipo = clean(item.querySelector('.icBox_Data')?.textContent || '');
      else if (label.includes('código')) data.codigo = (item.querySelector('.icBox_Data')?.textContent || '').trim();
      else if (label.includes('titularidad')) data.titularidad = clean(item.querySelector('.icBox_Data')?.textContent || '');
      else if (label.includes('direcci')) {
        data.direccion = Array.from(item.querySelectorAll('.icBox_DataInner'))
          .map(s => s.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' ');
      } else if (label.includes('redes') || item.querySelector('.redSocial')) {
        for (const a of item.querySelectorAll('a[href]')) {
          const href = a.getAttribute('href');
          if (href && !data.redes.find(r => r.url === href)) data.redes.push({ nombre: detectRed(href), url: href });
        }
      }
      const left = item.querySelector('.icBox_left');
      if (left && !data.telefono) { const ph = left.textContent.replace(/\s+/g, '').match(/\d{9}/); if (ph) data.telefono = ph[0]; }
      if (!data.mail) { const ml = item.querySelector('a[href^="mailto:"]'); if (ml) data.mail = ml.textContent.trim(); }
      if (!data.web) { const wl = item.querySelector('.icBox_right a[href^="http"]:not([href^="mailto:"])'); if (wl) data.web = wl.getAttribute('href'); }
    }
  }

  function detectRed(href) {
    if (!href) return 'Red Social';
    if (href.includes('facebook')) return 'Facebook';
    if (href.includes('twitter') || href.includes('x.com')) return 'X';
    if (href.includes('instagram')) return 'Instagram';
    if (href.includes('youtube')) return 'Youtube';
    if (href.includes('linkedin')) return 'LinkedIn';
    if (href.includes('tiktok')) return 'TikTok';
    return 'Red Social';
  }

  function icBoxToMd(box) {
    const content = box.querySelector('.icBox_Content');
    if (!content) return '';
    const allUls = Array.from(content.querySelectorAll('ul'));
    const topUls = allUls.filter(ul => { const p = ul.parentElement?.closest('ul'); return !p || !content.contains(p); });
    if (!topUls.length) return content.textContent.replace(/\s+/g, ' ').trim();
    return topUls.map(ul => listToMd(ul, 0)).join('');
  }
  function listToMd(ul, depth) {
    let out = ''; const ind = '    '.repeat(depth);
    for (const li of ul.children) {
      if (li.tagName !== 'LI') continue;
      const link = li.querySelector(':scope > a');
      let text = '';
      if (link) text = `[${link.textContent.replace(/\s+/g, ' ').trim()}](${link.getAttribute('href') || ''})`;
      else text = Array.from(li.childNodes).filter(n => n.nodeType === Node.TEXT_NODE || (n.nodeType === Node.ELEMENT_NODE && n.tagName !== 'UL')).map(n => n.textContent.replace(/\s+/g, ' ').trim()).join(' ').trim();
      if (text) out += `${ind}- ${text}\n`;
      const nested = li.querySelector(':scope > ul');
      if (nested) out += listToMd(nested, depth + 1);
    }
    return out;
  }

  // ── PDF parse ──
  async function extractPDFData(file) {
    if (!window.pdfjsLib) throw new Error('PDF.js no cargado');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      text += tc.items.map(i => i.str + (i.hasEOL ? '\n' : ' ')).join('') + '\n';
    }
    return parsePDFText(text, file.name);
  }

  function parsePDFText(text, filename) {
    const data = { filename, director: { nombre: '', mail: '' }, coordinador: { nombre: '', mail: '' }, itinerarios: [] };
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const isAllCaps = s => /^[A-ZÁÉÍÓÚÜÑ][A-ZÁÉÍÓÚÜÑ,\s\.]+$/.test(s) && s.split(/\s+/).length >= 2;
    const isEmail = s => /[\w.+%-]+@[\w.-]+\.\w{2,}/.test(s);
    const SKIP_LABEL = /^(teléfono|fax|correo|direcci|localidad|código|nombre|tipo|titular|datos|e-mail|número|total|plazas|horas|presupuesto|enseñanza|itinerario|seminario|curso|grupo|jornada|taller|duración|inicio|fin|curso:|de la|cuadro|datos|identificación)/i;

    function findPerson(startIdx) {
      for (let j = startIdx + 1; j < Math.min(startIdx + 12, lines.length); j++) {
        const L = lines[j];
        if (SKIP_LABEL.test(L) || isEmail(L)) continue;
        if (isAllCaps(L)) {
          let mail = '';
          for (let k = j; k < Math.min(j + 4, lines.length); k++) {
            const em = lines[k].match(/[\w.+%-]+@[\w.-]+\.\w{2,}/);
            if (em) { mail = em[0]; break; }
          }
          if (/^(COMUNICACIÓN|METODOLOG|TECNIFIC|CONVIVENC|DIGITAL|LIDERAZGO|INCLUSIÓN|INNOVA|FORMAC)/i.test(L)) continue;
          return { nombre: L, mail };
        }
      }
      return { nombre: '', mail: '' };
    }

    for (let i = 0; i < lines.length; i++) {
      if (/Coordinador\/a/i.test(lines[i]) && !data.coordinador.nombre) {
        const f = findPerson(i); if (f.nombre) data.coordinador = f;
      }
      if (/Director\/a/i.test(lines[i]) && !data.director.nombre) {
        const f = findPerson(i); if (f.nombre) data.director = f;
      }
    }

    const flat = lines.join(' ');
    const cursoPos = [];
    const cursoRe = /CURSO:\s*(\d{4}\/\d{4})/gi;
    let cm; while ((cm = cursoRe.exec(flat)) !== null) cursoPos.push({ año: cm[1], pos: cm.index });

    const itPos = [];
    const itRe = /ITINERARIO:\s*([A-ZÁÉÍÓÚÜÑ][^\n\r]{3,60}?)(?=\s*(?:Plazas|ITINERARIO:|$))/gi;
    let itm; while ((itm = itRe.exec(flat)) !== null) itPos.push({ nombre: itm[1].replace(/\s+/g, ' ').trim(), pos: itm.index });

    const itMap = new Map();
    for (let i = 0; i < itPos.length; i++) {
      const { nombre, pos } = itPos[i];
      const end = itPos[i + 1]?.pos ?? flat.length;
      const section = flat.slice(pos, end);
      if (!itMap.has(nombre)) itMap.set(nombre, []);
      const actRe = /(Seminario|Curso|Grupo de Trabajo|Jornada|Taller):\s*([^\d€\n\r]{5,120}?)(?=\s+\d|\s*$)/gi;
      let am;
      while ((am = actRe.exec(section)) !== null) {
        const absPos = pos + am.index;
        let año = cursoPos[0]?.año || '';
        for (const cp of cursoPos) { if (cp.pos <= absPos) año = cp.año; }
        const añoFmt = fmt2425(año);
        const list = itMap.get(nombre);
        let ce = list.find(c => c.año === añoFmt);
        if (!ce) { ce = { año: añoFmt, actividades: [] }; list.push(ce); }
        ce.actividades.push({ tipo: am[1], nombre: am[2].replace(/\s+/g, ' ').trim() });
      }
    }
    data.itinerarios = Array.from(itMap.entries()).map(([nombre, cursos]) => ({ nombre, cursos }));
    return data;
  }

  function clean(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

    s += `### LISTA DE COTEJO\n┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n#### INFORME FINAL\n1. Valoración global del desarrollo del plan.\n\t* Ha sido útil y suficiente, ha resultado excesivo, se hubiera necesitado algún otro itinerario / actividad...\n * Se ha cumplido con la planificación.\n * Se han alcanzado los objetivos previstos.\n * Se han cubierto/no se han cubierto las expectivas.\n * Problemas encontrados y cómo se han solventado...\n * Ha repercutido / no ha repercutido en el alumnado.\n * Cómo ha funcionado la coordinación del equipo interno/externo.\n\t* ¿Hay diferencias significativas entre la memoria del coordinador y la valoración del asesor?\n2. Actividades suspendidas: cuales y motivo.\n3. Actividades realizadas: valoraciones, utilidad y posible continuidad.\n4. Mejoras y opciones de continuidad y progresión detectadas.\n5. Coordinación interna, y coordinación centro-asesor.\n\n### JUSTIFICACIÓN ASESOR\n┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\`\`\`counter: 3000\n \n\`\`\`\n\n`;
    return s;
  }

  function buildFile2Id(id, planCode) {
    const base = id.replace(/-+$/, '');
    return (base + `-PF-${planCode}`).slice(0, 21).padEnd(21, '-');
  }

  // ── Render ──
  function renderTable() {
    const tbody = $('#pfc-tbody');
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="11" class="empty-state" style="padding:30px;">Pega el HTML de Reforacen y pulsa <strong>PROCESAR</strong></td></tr>'; return; }
    tbody.innerHTML = '';
    rows.forEach((row, i) => {
      const tr = document.createElement('tr');
      const idLen = (row.id || '').length;
      tr.innerHTML = `
        <td class="small">${Utils.esc(row.centro)}</td>
        <td class="mono small">${Utils.esc(row.planCode)}</td>
        <td class="small">${Utils.esc(row.duracion)}</td>
        <td class="tac small">${Utils.esc(String(row.anios))}</td>
        <td class="mono small">${Utils.esc(row.inicio)}</td>
        <td class="mono small">${Utils.esc(row.fin)}</td>
        <td>
          <input class="pfc-in" maxlength="21" value="${Utils.esc(row.id || '')}" placeholder="#·" data-i="${i}" data-f="id" style="width:170px; padding:4px 6px; font-size:0.75rem;">
          <div class="tiny tar ${idLen === 21 ? '' : 'faint'}" id="pfc-idc-${i}" style="color: ${idLen === 21 ? 'var(--success-hi)' : 'var(--text-faint)'}; width:170px;">${idLen}/21</div>
        </td>
        <td>
          <textarea class="pfc-in" rows="2" placeholder="Pegar código fuente del directorio…" data-i="${i}" data-f="centroHtml" style="min-height:50px; font-size:11px;">${Utils.esc(row.centroHtml || '')}</textarea>
          <div class="tiny" id="pfc-fb-c-${i}"></div>
        </td>
        <td>
          <textarea class="pfc-in" rows="2" placeholder="Nombre inspector@&#10;email@" data-i="${i}" data-f="inspectorText" style="min-height:50px; font-size:11px;">${Utils.esc(row.inspectorText || '')}</textarea>
        </td>
        <td>
          <div style="display:flex; flex-direction:column; gap:2px; min-width:130px;">
            <label style="margin:0;">
              <input type="file" accept=".pdf" data-i="${i}" class="pfc-pdf-input" style="display:none;">
              <span class="btn btn-secondary tiny" style="cursor:pointer;">${row.pdfName ? '📄 ' + shortName(row.pdfName) : 'Seleccionar PDF'}</span>
            </label>
            ${row.pdfName ? `<div class="tiny faint" style="word-break:break-all;">${Utils.esc(row.pdfName)}</div>` : ''}
            <div class="tiny" id="pfc-fb-p-${i}"></div>
          </div>
        </td>
        <td><button class="btn btn-secondary tiny" data-dl-i="${i}" ${canDl(row) ? '' : 'disabled'}>ZIP</button></td>
      `;
      tbody.appendChild(tr);
    });
    bindEvents();
    refreshPanelSelectors();
  }

  function shortName(s) { return s.length > 22 ? s.slice(0, 20) + '…' : s; }
  function canDl(row) { return (row.id || '').length === 21; }

  function bindEvents() {
    $$('.pfc-in[data-i][data-f]').forEach(el => {
      el.addEventListener('input', () => {
        const i = +el.dataset.i, f = el.dataset.f;
        rows[i][f] = el.value;
        if (f === 'id') {
          const n = el.value.length, ctr = $(`#pfc-idc-${i}`);
          if (ctr) {
            ctr.textContent = `${n}/21`;
            ctr.style.color = n === 21 ? 'var(--success-hi)' : 'var(--text-faint)';
          }
          updDl(i);
        }
        saveState();
      });
      if (el.dataset.f === 'centroHtml') {
        el.addEventListener('paste', () => setTimeout(() => {
          rows[+el.dataset.i].centroHtml = el.value;
          doParseCentro(+el.dataset.i);
        }, 60));
      }
    });

    $$('.pfc-pdf-input').forEach(inp => {
      inp.addEventListener('change', async () => {
        const i = +inp.dataset.i, file = inp.files[0]; if (!file) return;
        rows[i].pdfName = file.name;
        const labelSpan = inp.parentElement.querySelector('span');
        if (labelSpan) labelSpan.textContent = '📄 ' + shortName(file.name);
        fb(`pfc-fb-p-${i}`, '⏳ Procesando PDF…', true);
        try {
          rows[i].pdfData = await extractPDFData(file);
          const p = rows[i].pdfData;
          const ok = p.coordinador.nombre || p.director.nombre || p.itinerarios.length > 0;
          fb(`pfc-fb-p-${i}`, ok ? `✓ ${p.itinerarios.length} itinerario/s` : '⚠ PDF leído, datos limitados', !!ok);
          saveState();
        } catch (e) { fb(`pfc-fb-p-${i}`, '✗ ' + e.message, false); }
        updDl(i);
      });
    });

    $$('[data-dl-i]').forEach(btn => btn.addEventListener('click', () => doDownload(+btn.dataset.dlI)));
  }

  function fb(id, msg, ok) {
    const el = $('#' + id);
    if (el) { el.textContent = msg; el.style.color = ok ? 'var(--success-hi)' : 'var(--danger)'; }
  }

  function doParseCentro(i) {
    const html = rows[i].centroHtml; if (!html?.trim()) return;
    try {
      rows[i].centroData = parseCentroHTML(html);
      fb(`pfc-fb-c-${i}`, `✓ ${rows[i].centroData.nombre || 'Centro'}`, true);
      saveState();
    } catch { fb(`pfc-fb-c-${i}`, '✗ Error al parsear HTML', false); }
    updDl(i);
  }
  function updDl(i) { const btn = _root.querySelector(`[data-dl-i="${i}"]`); if (btn) btn.disabled = !canDl(rows[i]); }

  async function doDownload(i) {
    const row = rows[i];
    if (!canDl(row)) { UI.toast('El campo ID debe tener exactamente 21 caracteres.', 'warn'); return; }
    const id1 = Utils.sanitizeFilename(row.id);
    const id2 = Utils.sanitizeFilename(buildFile2Id(row.id, row.planCode));
    const zip = Utils.createZip([
      { name: `${id1}.md`, content: generateFile1(row) },
      { name: `${id2}.md`, content: generateFile2(row) }
    ]);
    Utils.download(zip, `${Utils.sanitizeFilename(row.centro)}_PF${row.planCode}.zip`, 'application/zip');
  }

  // ── Process button ──
  function processHTML() {
    const html = $('#pfc-paste').value.trim(); if (!html) return;
    const parsed = parseReforacen(html);
    const status = $('#pfc-parse-status');
    if (!parsed.length) { status.textContent = '⚠ No se encontraron planes.'; status.style.color = 'var(--danger)'; return; }
    const prev = {}; rows.forEach(r => { prev[r.planCode] = r; });
    rows = [];
    parsed.forEach(p => {
      rows.push({
        id: '', centroHtml: '', centroData: null, inspectorText: '', pdfName: '', pdfData: null,
        ...prev[p.planCode], ...p
      });
    });
    status.textContent = `✓ ${rows.length} plan${rows.length !== 1 ? 'es' : ''} cargado${rows.length !== 1 ? 's' : ''}.`;
    status.style.color = 'var(--success-hi)';
    renderTable();
    saveState();
  }

  // ── Side Panel: Buscar Centro / Vista ──
  function openDirectorioPanel() {
    UI.openPanel({
      title: 'Directorio de Centros',
      codigo: '',
      render: body => {
        body.innerHTML = `
          <div class="sp-iframe-wrap">
            <div class="sp-url-bar">
              <input id="pfc-sp-url" type="url" value="https://directorio.educa.jcyl.es/es/busqueda-avanzada">
              <button class="btn btn-primary tiny" id="pfc-sp-go">Ir →</button>
            </div>
            <iframe id="pfc-sp-iframe" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-top-navigation-by-user-activation"></iframe>
          </div>
          <div class="sp-footer">
            <div class="sp-hint">Navega al centro. Para extraer datos: consigue el código fuente y pégalo en la columna <strong>DATOS CENTRO</strong> de la tabla.</div>
          </div>
        `;
        const iframe = body.querySelector('#pfc-sp-iframe');
        const urlInput = body.querySelector('#pfc-sp-url');
        const goBtn = body.querySelector('#pfc-sp-go');
        const go = () => { if (urlInput.value.trim()) iframe.src = urlInput.value.trim(); };
        goBtn.addEventListener('click', go);
        urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
        setTimeout(go, 100);
      }
    });
  }

  function openVistaPanel(mode) {
    UI.openPanel({
      title: mode === 'vista-centro' ? 'Vista Centro (Archivo 1)' : 'Vista PF (Archivo 2)',
      codigo: '',
      render: body => {
        body.innerHTML = `
          <div style="padding: 8px 12px; border-bottom:1px solid var(--border); background:var(--bg-card); display:flex; gap:8px; align-items:center;">
            <label style="margin:0; text-transform:none; letter-spacing:0;">Centro:</label>
            <select id="pfc-vista-sel" style="max-width:280px;"></select>
            <button class="btn btn-secondary" id="pfc-vista-copy">Copiar todo</button>
          </div>
          <div class="sp-vista" id="pfc-vista-content"></div>
        `;
        const sel = body.querySelector('#pfc-vista-sel');
        const content = body.querySelector('#pfc-vista-content');
        function refresh() {
          sel.innerHTML = '';
          rows.forEach((r, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = r.centro || (i + 1);
            sel.appendChild(opt);
          });
          render();
        }
        function render() {
          if (!rows.length || sel.value === '') { content.textContent = '(sin datos)'; return; }
          const row = rows[+sel.value];
          content.textContent = mode === 'vista-centro' ? generateFile1(row) : generateFile2(row);
        }
        sel.addEventListener('change', render);
        body.querySelector('#pfc-vista-copy').addEventListener('click', () => {
          Utils.copyText(content.textContent).then(() => UI.toast('Copiado al portapapeles'));
        });
        refresh();
      }
    });
  }

  function refreshPanelSelectors() { /* lazy: panel populates on open */ }

  function mount(container) {
    _root = container;
    container.innerHTML = TEMPLATE;
    loadState();
    if (rows.length) renderTable();

    $('#pfc-btn-process').addEventListener('click', processHTML);
    $('#pfc-paste').addEventListener('paste', () => setTimeout(processHTML, 80));
    $('#pfc-btn-buscar').addEventListener('click', openDirectorioPanel);
    $('#pfc-btn-vista-centro').addEventListener('click', () => openVistaPanel('vista-centro'));
    $('#pfc-btn-vista-pf').addEventListener('click', () => openVistaPanel('vista-pf'));
  }

  function unmount() { saveState(); _root = null; }

  return {
    id: ID,
    label: 'Centros y PF',
    icon: '<svg width="14" height="14" viewBox="0 0 32 32"><rect width="32" height="32" rx="5" fill="none"/><path d="M7 10h8v13H7zM17 10h8v13h-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15 10 Q16 7.5 17 10" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    mount, unmount,
  };
})();

// MÓDULO 5: VALORACIÓN WEB
// ═══════════════════════════════════════════════════════════
const moduleValoracion = (() => {
  const ID = 'val';
  const NS = 'val';

  const PREGUNTAS = [
    "Nota global de la actividad", "Adecuación de Instalaciones y espacios", "Adecuación de equipamiento y materiales",
    "Interés de los contenidos", "Utilidad para su aplicación al aula/trabajo",
    "Adecuación metodológica - innovación", "Adecuación metodológica innovación",
    "Distribución de tiempos", "Organización - gestión de la actividad", "Organización gestión de la actividad",
    "Clima - ambiente de realización", "Clima ambiente de realización",
    "Valoración global de los formadores", "Grado de cumplimiento de las expectativas",
    "Grado de aprovechamiento individual", "Desarrollo de competencias profesionales", "Compromiso de aplicación al aula/trabajo",
    "Satisfacción con la formación realizada"
  ];

  let _root = null;
  let currentFile = null;
  let lastReport = '';

  const TEMPLATE = `
    <div class="subpanel active" data-panel="main" style="padding:1.5rem; align-items:center; gap:1.2rem;">
      <div class="row wrap" style="width:100%; max-width:900px; margin: 0 auto; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" id="val-share" disabled title="Publicar en datos compartidos para que otro módulo lo importe">↗ Compartir informe</button>
        <button class="btn btn-primary" id="val-btn-process" disabled>
          <span>Generar Informe</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button class="btn btn-ghost" id="val-btn-copy">
          <svg width="13" height="13"><use href="#icon-copy"></use></svg> Copiar
        </button>
        <button class="btn btn-ghost" id="val-btn-clear">
          <svg width="13" height="13"><use href="#icon-trash"></use></svg> Limpiar
        </button>
      </div>

      <input type="file" id="val-file-input" accept="application/pdf" hidden>
      <div id="val-dropzone" style="width:100%; max-width:900px; margin: 0 auto; border:2px dashed var(--border); border-radius:12px; background:var(--bg-card); padding:40px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; transition:all 0.2s;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted); opacity:0.7;">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <h3 style="margin:0; color: var(--text-strong);">Arrastra o sube la memoria</h3>
        <p class="muted small" style="margin:0;">Selecciona el archivo PDF de la actividad descargada desde <strong>REFORACEN</strong></p>
      </div>

      <div id="val-file-info" style="display:none; align-items:center; gap:8px; padding:10px 20px; border-radius:30px; background:rgba(35,134,54,0.1); border:1px solid rgba(35,134,54,0.3); color:#7ee787; font-size:0.8rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span id="val-file-name"></span>
      </div>

      <div id="val-status" class="alert err" style="display:none; max-width:900px; width:100%; margin:0 auto;"></div>

      <pre id="val-output" class="markdown-output" style="display:none; width:100%; max-width:900px; margin:0 auto; min-height:200px;" contenteditable="true" spellcheck="false"></pre>
    </div>
  `;

  function $(s) { return _root?.querySelector(s); }

  function loadState() {
    lastReport = Store.get(NS, 'lastReport', '') || '';
  }
  function saveState() { Store.set(NS, 'lastReport', lastReport); }

  function validar(file) {
    const status = $('#val-status');
    status.style.display = 'none';
    if (file.type !== 'application/pdf') {
      status.textContent = 'Error: El archivo debe ser un PDF válido.';
      status.style.display = 'block';
      return;
    }
    currentFile = file;
    $('#val-file-name').textContent = file.name;
    $('#val-file-info').style.display = 'flex';
    $('#val-btn-process').disabled = false;
    $('#val-dropzone').style.display = 'none';
  }

  async function procesar() {
    if (!currentFile) return;
    if (!window.pdfjsLib) {
      $('#val-status').textContent = 'Error: PDF.js no se ha cargado correctamente.';
      $('#val-status').style.display = 'block';
      return;
    }
    const btn = $('#val-btn-process');
    const original = btn.innerHTML;
    btn.innerHTML = '<span>Analizando…</span>';
    btn.disabled = true;
    try {
      const buffer = await currentFile.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let texto = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        texto += content.items.map(s => s.str).join(' ') + '\n\n';
      }
      const datos = parsear(texto);
      if (!datos.items.length) {
        UI.toast('No se encontraron datos de valoración en el apartado 5.4.', 'warn');
        btn.innerHTML = original; btn.disabled = false;
      } else {
        generarInforme(datos);
        btn.innerHTML = '<span>Informe generado</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
        btn.disabled = true; btn.style.opacity = '0.8';
      }
    } catch (e) {
      console.error(e);
      $('#val-status').textContent = 'Error al leer el PDF: ' + e.message;
      $('#val-status').style.display = 'block';
      btn.innerHTML = original; btn.disabled = false;
    }
  }

  function parsear(txt) {
    const clean = txt.replace(/\s+/g, ' ');
    const match = clean.match(/5\.4\.?-?\s*Valoración/i);
    if (!match) return { items: [], obs: 'Sección 5.4 no encontrada.' };
    const section = clean.substring(match.index);
    const items = []; const found = new Set();
    PREGUNTAS.forEach(p => {
      const regex = new RegExp(`${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')}.{0,300}?(\\d+[,.]\\d{2})`, 'i');
      const m = section.match(regex);
      if (m) {
        const val = parseFloat(m[1].replace(',', '.'));
        const name = p.replace(' - ', ' ').replace('  ', ' ');
        if (!found.has(name)) { items.push({ p, val }); found.add(name); }
      }
    });
    let obs = '(No se han registrado observaciones)';
    const obsM = section.match(/Observaciones:/i);
    if (obsM) {
      let raw = section.substring(obsM.index + obsM[0].length);
      const end = raw.match(/(6\.-|Código:|Página \d|Junta de Castilla)/i);
      if (end) raw = raw.substring(0, end.index);
      const trim = raw.trim();
      if (trim.length > 3 && trim.toUpperCase() !== 'BOR') obs = trim;
    }
    return { items, obs };
  }

  function generarInforme(datos) {
    const sorted = datos.items.sort((a, b) => b.val - a.val);
    const max = Math.max(...sorted.map(d => d.val));
    const min = Math.min(...sorted.map(d => d.val));
    let graf = '';
    sorted.forEach(i => {
      const label = i.p.length > 44 ? i.p.substring(0, 44) : i.p;
      const ch = i.val === max ? '█' : (i.val === min ? '░' : '▒');
      graf += `${label.padEnd(45, ' ')} | ${ch.repeat(Math.round(i.val * 2.25))} ${i.val.toFixed(2)}\n`;
    });
    const final = `## 🔴🔒✔️ VALORACIÓN WEB\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n${graf}\n\n## 🔴🔒⚠️ OBSERVACIONES VALORACIÓN\n▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀\n${datos.obs}`;
    lastReport = final;
    saveState();
    const out = $('#val-output');
    out.textContent = final;
    out.style.display = 'block';
    $('#val-share').disabled = false;
  }

  function copiar() {
    const txt = ($('#val-output')?.innerText || lastReport || '').trim();
    if (!txt) return UI.toast('No hay informe para copiar', 'warn');
    Utils.copyText(txt).then(() => UI.toast('Copiado al portapapeles'));
  }

  function limpiar() {
    currentFile = null;
    lastReport = '';
    saveState();
    $('#val-file-input').value = '';
    $('#val-file-info').style.display = 'none';
    $('#val-dropzone').style.display = 'flex';
    const out = $('#val-output');
    out.innerText = ''; out.style.display = 'none';
    const btn = $('#val-btn-process');
    btn.innerHTML = '<span>Generar Informe</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    btn.disabled = true; btn.style.opacity = '';
    $('#val-status').style.display = 'none';
    $('#val-share').disabled = true;
  }

  function shareReport() {
    const txt = ($('#val-output')?.innerText || lastReport || '').trim();
    if (!txt) return UI.toast('No hay informe para compartir', 'warn');
    Shared.publish('valoracionReport', txt, ID);
    UI.toast('Informe de Valoración compartido');
  }

  function mount(container) {
    _root = container;
    container.innerHTML = TEMPLATE;
    loadState();

    if (lastReport) {
      $('#val-output').textContent = lastReport;
      $('#val-output').style.display = 'block';
      $('#val-share').disabled = false;
    }

    const dz = $('#val-dropzone');
    const input = $('#val-file-input');
    dz.addEventListener('click', () => input.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); dz.style.borderColor = 'var(--accent)'; dz.style.background = 'var(--accent-soft-2)'; });
    dz.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); dz.style.borderColor = ''; dz.style.background = ''; });
    dz.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      dz.style.borderColor = ''; dz.style.background = '';
      if (e.dataTransfer.files.length) validar(e.dataTransfer.files[0]);
    });
    input.addEventListener('change', () => { if (input.files.length) validar(input.files[0]); });

    $('#val-btn-process').addEventListener('click', procesar);
    $('#val-btn-copy').addEventListener('click', copiar);
    $('#val-btn-clear').addEventListener('click', limpiar);
    $('#val-share').addEventListener('click', shareReport);
  }

  function unmount() { _root = null; }

  return {
    id: ID,
    label: 'Valoración Web',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 13 11 15 15 11"/></svg>',
    mount, unmount,
  };
})();

function initTabOverflow() {
  const nav = document.getElementById('module-tabs');
  if (!nav) return;

  const moreBtn = document.createElement('button');
  moreBtn.className = 'module-tab tab-overflow-btn';
  moreBtn.textContent = '···';
  moreBtn.title = 'Más módulos';
  moreBtn.style.display = 'none';
  nav.appendChild(moreBtn);

  const menu = document.createElement('div');
  menu.className = 'tab-overflow-menu';
  menu.style.display = 'none';
  document.body.appendChild(menu);

  const closeMenu = () => { menu.style.display = 'none'; };
  moreBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = menu.style.display === 'none';
    if (open) {
      const r = moreBtn.getBoundingClientRect();
      menu.style.top  = r.bottom + 'px';
      menu.style.left = r.left   + 'px';
      menu.style.display = '';
    } else {
      closeMenu();
    }
  });
  document.addEventListener('click', closeMenu);

  function refresh() {
    const allTabs = Array.from(nav.querySelectorAll('.module-tab:not(.tab-overflow-btn)'));
    allTabs.forEach(t => { t.style.display = ''; });
    moreBtn.style.display = 'none';

    if (nav.scrollWidth <= nav.clientWidth) return;

    moreBtn.style.display = '';
    const activeTab = allTabs.find(t => t.classList.contains('active'));
    const hideable = [...allTabs].reverse().filter(t => t !== activeTab);
    for (const tab of hideable) {
      if (nav.scrollWidth <= nav.clientWidth) break;
      tab.style.display = 'none';
    }

    menu.innerHTML = '';
    allTabs.filter(t => t.style.display === 'none').forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'module-tab' + (tab.classList.contains('active') ? ' active' : '');
      btn.innerHTML = tab.innerHTML;
      btn.addEventListener('click', () => {
        Router.activate(tab.dataset.moduleId);
        closeMenu();
      });
      menu.appendChild(btn);
    });
  }

  Bus.on('router:activate', refresh);
  new ResizeObserver(refresh).observe(nav);
}

document.addEventListener('DOMContentLoaded', () => {
  // El orden aquí define el orden de los tabs
  Router.init([
    modulePFC,
    moduleRefo,
    moduleTempo,
    moduleCertificador,
    moduleValoracion,
  ]);
  SharedUI.init();
  initTabOverflow();
});

</script>
